<style>
:root{

  --text-label:#8f8f94;

  --coral:#ff7770;

  --top-title:rgba(255,255,255,.48);

  --bad-glow:radial-gradient(ellipse at 50% 42%,rgba(255,119,112,.48) 0%,rgba(255,119,112,.28) 18%,rgba(255,119,112,.13) 40%,rgba(255,119,112,.05) 60%,transparent 78%);
  --card-shadow:0 18px 55px rgba(0,0,0,.18);

}
[data-theme="light"]{
  /* ===== LIGHT THEME ===== */
  --bg:#f6f4f1;
  --panel:#ffffff;
  --text:#242426;
  --muted:#727278;
  --text-secondary:#55565b;
  --text-strong:#55565b;
  --text-subtle:#727278;
  --text-label:#727278;
  --mint:#3fa68a;
  --coral:#e95e66;

  --button:var(--coral);
  --line:rgba(0,0,0,.09);
  --top-line:rgba(32,32,35,.08);
  --top-title:rgba(37,37,40,.48);
  --progress:rgba(32,32,35,.28);
  --answer-surface:rgba(36,36,38,.035);
  --game-title:rgba(36,36,38,.09);
  --version:rgba(37,37,40,.30);
  --good:rgba(63,166,138,.5);
  --bad:rgba(233,94,102,.5);
  --good-glow:radial-gradient(ellipse at 50% 42%,rgba(63,166,138,.18) 0%,rgba(63,166,138,.09) 18%,rgba(63,166,138,.03) 40%,transparent 70%);
  --bad-glow:radial-gradient(ellipse at 50% 42%,rgba(233,94,102,.19) 0%,rgba(233,94,102,.09) 18%,rgba(233,94,102,.025) 40%,transparent 70%);
  --card-shadow:none;
  --session-button-bg:#eeeae5;

  --blue:#5588e0;
}

*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;display:flex;justify-content:center}
.app{width:min(720px,100%);padding:calc(env(safe-area-inset-top) + 8px) 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:10;padding-bottom:17px;background:var(--bg)}.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--top-line);border-radius:99px}.top-title{font-size:18px;font-weight:700;color:var(--top-title)}.counter{color:var(--muted);font-size:14px}.top-title,.counter{transform:translateY(4px)}.progress{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:99px;overflow:hidden;z-index:1}.progress i{display:block;height:100%;background:var(--progress);width:0}.card{position:relative;overflow:hidden;min-height:390px;border-radius:26px;background:var(--card-bg);box-shadow:var(--card-lift);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 24px}
.eyebrow{font-size:16px;color:var(--muted);margin-bottom:18px}.word{font-size:clamp(48px,11vw,76px);font-weight:650;letter-spacing:-.04em;text-align:center}.translation{font-size:16px;color:var(--muted);margin-top:14px;text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.choice{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:17px 8px;font-size:25px;font-weight:650;cursor:pointer}.choice:active{transform:scale(.98)}.der{color:var(--blue)}.die{color:var(--coral)}.das{color:var(--mint)}
.feedback{display:none;margin-top:18px;border-radius:22px;padding:22px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}.feedback.show{display:block}.feedback::before{content:"";position:absolute;left:50%;top:-230px;width:155%;height:650px;transform:translateX(-50%);pointer-events:none}.feedback.correct::before{background:var(--good-glow)}.feedback.wrong::before{background:var(--bad-glow)}.feedback h2,.feedback p,.feedback .answer-card,.feedback .rule-card{position:relative}.feedback h2{margin:0 0 10px;font-size:24px}.feedback p{margin:8px 0;color:var(--text-secondary);line-height:1.45}.answer-card,.rule-card{margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--answer-surface)}.answer-card{text-align:center}.answer-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}.rule-label{font-size:14px;text-transform:uppercase;letter-spacing:.035em;color:var(--text-label);font-weight:400;margin-bottom:12px}.answer-word{font-size:30px;font-weight:700;transition:color .2s ease}

.answer-translation{color:var(--muted);margin-top:6px}.rule-title{font-size:16px;font-weight:400;margin-bottom:8px;line-height:1.5}.rule-examples{font-size:13px;font-style:italic;color:var(--text-subtle);margin-top:10px;line-height:1.45}.rule-reliability{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--text-subtle)}.rule-reliability strong{color:var(--text-strong)}.feedback.correct{border-color:var(--good)}.feedback.wrong{border-color:var(--bad)}.continue{width:100%;margin-top:18px;border:0;border-radius:15px;padding:15px;background:var(--button);color:white;font-size:17px;font-weight:650;cursor:pointer}

/* ===== START SCREEN · shared design across all exercises (Design Police 2026-09-25) =====
   Same colours, button shape, press effect, table button and version mark in every exercise.
   Title fonts stay per group: Artikel+Pronomen / Verbformen / Präpositionen. */
:root{
  --start-btn-bg:#2a2a2d;
  --start-btn-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 14px rgba(0,0,0,.14);
  --start-line:rgba(255,255,255,.10);
  --start-table-text:#c8c7c4;
  --start-version:rgba(255,255,255,.24);
}
[data-theme="light"]{
  --start-btn-bg:#fff;
  --start-btn-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 14px rgba(0,0,0,.08);
  --start-line:rgba(0,0,0,.10);
  --start-table-text:#55565b;
  --start-version:rgba(36,36,38,.34);
}
#sessionScreen .session-options{display:flex;flex-wrap:nowrap;justify-content:center;gap:12px}
#sessionScreen .session-option{flex:0 0 96px;width:96px;min-width:0;height:58px;margin:0;padding:0;border:0;border-radius:16px;
  background:var(--start-btn-bg);color:var(--text);box-shadow:var(--start-btn-shadow);font:650 21px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;justify-content:center;transform:none;cursor:pointer;
  transition:transform .12s ease,filter .12s ease}
#sessionScreen .session-option:hover{transform:none;background:var(--start-btn-bg);box-shadow:var(--start-btn-shadow)}
#sessionScreen .session-option:active{transform:scale(.97);filter:brightness(.94)}
.version-mark{position:fixed;left:0;right:0;top:auto;bottom:calc(env(safe-area-inset-bottom) + 28px);margin:0;padding:0;
  text-align:center;font:400 11px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:.04em;color:var(--start-version);pointer-events:none;z-index:5}
/* Artikel start screen: no card; same structure and height as Pronomen (block flow, margins collapse the same way) */
#sessionScreen{display:block;min-height:690px;padding:20px 14px;border:0;border-radius:0;background:transparent;box-shadow:none}
#sessionScreen.hidden{display:none}
#sessionScreen h1{margin:0 0 10px}
#sessionScreen p{font-size:16px;line-height:1.5;margin:16px 0}
#sessionScreen .session-options{margin:28px 0}

/* ===== SUMMARY SCREEN · shared buttons across all exercises (Design Police 2026-09-25) =====
   "Noch eine Runde" (quiet, outlined) + "Zur Startseite" (main). Style taken from Ortspräpositionen. */
:root{
  --end-again-bg:transparent;
  --end-again-text:rgba(242,240,237,.55);
  --end-again-line:rgba(255,255,255,.10);

}

  --end-main-text:#f6f4f1;
}
#endScreen .finish-actions{width:min(100%,360px);margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:10px}
#endScreen #playAgain,#endScreen #homeBack{width:100%;height:56px;margin:0;padding:0;border:0;border-radius:17px;font:650 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transform:none;transition:transform .12s ease,filter .12s ease}
#endScreen #playAgain{background:var(--end-again-bg);color:var(--end-again-text);border:1px solid var(--end-again-line)}

#endScreen #playAgain:active,#endScreen #homeBack:active{transform:scale(.97);filter:brightness(.94)}
/* Artikel summary: same structure and sizes as Pronomen (no card) */
#endScreen{display:block;min-height:690px;padding:20px 14px;border:0;border-radius:0;background:transparent;box-shadow:none}
#endScreen.hidden{display:none}
#endScreen .game-title-done{margin-bottom:45px}
#endScreen h1{font-size:34px;letter-spacing:-.03em;margin:0 0 10px}

#endScreen p{color:var(--muted);font-size:16px;line-height:normal;margin:0 0 28px}
#endScreen .finish-actions{margin-top:20px}

/* ===== TOP BAR · shared design across all exercises (Design Police 2026-09-25) =====
   Title and counter in the palette grey, 3px progress line: hairline track + grey fill.
   Green stays reserved for "correct". */
:root{--bar-track:rgba(255,255,255,.10)}
[data-theme="light"]{--bar-track:rgba(0,0,0,.10)}
#game .top-title{color:var(--muted)}
#game .top:after{background:var(--bar-track)}
#game .progress i{background:var(--muted)}
/* Top bar position = Partizip II (reference): title and counter centred 33.5px from the top, line at 55px, 18px side margins */
#game{padding-top:11px}
#game .top{padding-bottom:18px}

/* ===== WORD CARD · shared by Artikel and Fester Kasus (Design Police 2026-09-25) ===== */
:root{
  --card-bg:#2a2a2d;
  --card-lift:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.30);
}
[data-theme="light"]{
  --card-bg:#fff;
  --card-lift:0 2px 4px rgba(0,0,0,.04),0 14px 34px rgba(0,0,0,.09);
}

/* ===== ANSWER BUTTONS · shared by Artikel, Fester Kasus, Ortspräpositionen (Design Police 2026-09-25) ===== */
#choices .choice{border:0;border-radius:14px;min-height:56px;height:56px;padding:0 10px;
  background:var(--start-btn-bg);box-shadow:var(--start-btn-shadow);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;font-size:22px;font-weight:650;
  transition:transform .12s ease,filter .12s ease,opacity .16s ease}
#choices .choice:hover{transform:none;background:var(--start-btn-bg);box-shadow:var(--start-btn-shadow)}
#choices .choice:active{transform:scale(.97);filter:brightness(.94);box-shadow:var(--start-btn-shadow)}

/* ===== WEITER · the quiet button, shared by all exercises (Design Police 2026-09-25) =====
   Blueprint: Partizip II. It doesn't urge you on; you read the answer first.
   Same surface + outline as the typing field; full text colour; as wide as the answer area. */
:root{--quiet-bg:rgba(255,255,255,.03);--quiet-line:rgba(255,255,255,.10)}
[data-theme="light"]{--quiet-bg:#fff;--quiet-line:rgba(0,0,0,.10)}
#continue{height:56px;border:1px solid var(--quiet-line);border-radius:17px;background:var(--quiet-bg);color:var(--text);
  font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;box-shadow:none;cursor:pointer;transition:transform .12s ease,filter .12s ease;padding:0;}
#continue:hover{background:var(--quiet-bg);box-shadow:none;transform:none}
#continue:active{transform:scale(.97);filter:brightness(.94)}

/* Version number only on the start and summary screens, not during the exercise (Design Police 2026-09-25) */
body:has(#game:not(.hidden)) .version-mark{display:none}

/* Feedback headline: a bit smaller, centred like the line under it, no exclamation mark (Design Police 2026-09-25) */
#feedbackTitle{font-size:20px;text-align:center}
#choiceLine{text-align:center}

/* Feedback headline in the answer colour, like the label in Fester Kasus (Design Police 2026-09-25) */
.feedback.correct #feedbackTitle{color:var(--mint)}
.feedback.wrong #feedbackTitle{color:var(--coral)}
</style>

<script src="../components/deutsch-translation-v1.js?v=2"></script>
<script src="words.js?v=3"></script>
<script src="../components/deutsch-progress-v1.js"></script>
<script>
const words=window.WORDS;
let deck=[],index=0,total=0,correct=0,sessionSize=0;
const $=id=>document.getElementById(id);

// Persistent difficulty: mistakes make a word more likely to reappear in future rounds.
const STORAGE_KEY='artikelGameDifficultyV1';
let difficulty={};
try{difficulty=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){difficulty={}}
const wordKey=w=>w.article+'|'+w.word;

// Progress tracking (Documentation/PROGRESS_TRACKER.md). Guarded: Artikel keeps working if the helper is missing.
const PROGRESS_ID='artikel';
const hasProgress=()=>typeof window.DeutschProgress==='object';
// Counted per RULE, not per noun: all nouns of one rule (e.g. -ung → die) share one progress item.
// Nouns without a reliable rule and exceptions (ruleType none / exception) are their own item.
const isIndividual=w=>w.ruleType==='none'||w.ruleType==='exception';
const progressKey=w=>isIndividual(w)?'word:'+wordKey(w):'rule:'+w.ruleLabel+'|'+w.article;
function progressLabel(w){
 if(isIndividual(w))return w.article+' '+w.word;
 let l=w.ruleLabel.replace(/ ENDING$/,'').replace(/ PATTERN$/,'').replace(/ → MOSTLY (DER|DIE|DAS)$/,'');
 l=l.startsWith('-')?l.toLowerCase():l.charAt(0)+l.slice(1).toLowerCase();
 return l+' → '+w.article;
}
// Weight = number of nouns the item covers, so the bar % = share of the 238 nouns I reliably know.
if(hasProgress()){
 const items=new Map();
 words.forEach(w=>{const k=progressKey(w),e=items.get(k);if(e)e.weight++;else items.set(k,{key:k,label:progressLabel(w),weight:1})});
 DeutschProgress.init(PROGRESS_ID,[...items.values()]);
}
function saveDifficulty(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(difficulty))}catch(e){}}
function updateDifficulty(w,ok){
 const key=wordKey(w),old=difficulty[key]||1;
 // Wrong answers raise the weight; correct answers gently bring it back toward normal.
 difficulty[key]=ok?Math.max(1,old-0.5):Math.min(4,old+1);
 saveDifficulty();
}
function newDeck(){
 // Build ONE session with unique nouns only.
 // Difficult nouns are more likely to be selected for the session,
 // but a noun can never appear twice inside the same session.
 const ranked=words.map(w=>{
   const weight=Math.max(1,difficulty[wordKey(w)]||1);
   // Weighted sampling without replacement:
   // higher weight = better chance to land near the front.
   const key=-Math.log(Math.max(Math.random(),1e-12))/weight;
   return {w,key};
 }).sort((a,b)=>a.key-b.key);

 deck=ranked.slice(0,Math.min(sessionSize,ranked.length)).map(x=>x.w);
 index=0;
}
function current(){return deck[index]}
/* Long words never wrap: they stay on one line and shrink just enough to fit
   the card (e.g. Harley-Davidson, Geschwindigkeit on narrow phones). */
function fitOneLine(el){
 if(!el)return;
 el.style.fontSize='';el.style.whiteSpace='nowrap';
 const box=el.parentElement;if(!box||!box.clientWidth)return;
 const cs=getComputedStyle(box);
 const avail=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 const need=el.scrollWidth;
 if(avail>0&&need>avail){el.style.fontSize=Math.floor(parseFloat(getComputedStyle(el).fontSize)*avail/need*0.97)+'px'}
}
addEventListener('resize',()=>{fitOneLine($('word'));fitOneLine(document.querySelector('.answer-word'))});
function render(){const w=current();$('word').textContent=w.word;$('translation').textContent=getTranslation(w,'translation');$('feedback').className='feedback';$('choices').style.display='grid';$('card').style.display='flex';$('counter').textContent=`${index+1} / ${sessionSize}`;$('bar').style.width=`${(index/sessionSize)*100}%`;fitOneLine($('word'))}

const DAILY_STATS_KEY='deutschDailyStatsV1';
function localDayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function recordDailyArtikel(ok){
  try{
    const today=localDayKey();
    let data=JSON.parse(localStorage.getItem(DAILY_STATS_KEY)||'{}');

    if(data.date!==today){
      data={date:today,artikel:{answers:0,correct:0}};
    }

    if(!data.artikel) data.artikel={answers:0,correct:0};
    data.artikel.answers++;
    if(ok) data.artikel.correct++;

    localStorage.setItem(DAILY_STATS_KEY,JSON.stringify(data));
  }catch(e){}
}

function choose(article){const w=current(),ok=article===w.article;total++; recordDailyArtikel(ok); updateDifficulty(w,ok); if(hasProgress())DeutschProgress.record(PROGRESS_ID,progressKey(w),ok); if(ok){correct++}
 $('feedback').className='feedback show '+(ok?'correct':'wrong');$('feedbackTitle').textContent=ok?'✓ Richtig':'✕ Nicht ganz';$('choiceLine').innerHTML=ok?`Deine Wahl: <strong>${article}</strong>.`:`Deine Wahl: <strong>${article}</strong>. Richtig: <strong>${w.article}</strong>.`;$('answerArticle').textContent=w.article;$('answerWord').textContent=w.word;$('answerTranslation').textContent=getTranslation(w,'translation');$('ruleLabel').textContent=`WHY ${w.article.toUpperCase()}? (${w.ruleLabel})`;$('ruleTitle').textContent=w.explanation;$('ruleExamples').textContent=Array.isArray(w.examples)?w.examples.join(', '):w.examples;$('ruleReliability').innerHTML=`<strong>Heads up:</strong> ${w.reliability}`;$('choices').style.display='none';$('card').style.display='none';fitOneLine(document.querySelector('.answer-word'))}
function startSession(size){
 sessionSize=size; total=0; correct=0;
 
 newDeck();
 $('sessionScreen').classList.add('hidden');
 $('endScreen').classList.add('hidden');
 $('game').classList.remove('hidden');
 render();
}
function endSession(){
 $('game').classList.add('hidden');
 $('endScreen').classList.remove('hidden');
 $('endCorrect').textContent=`${correct} / ${sessionSize}`;
 const pct=Math.round((correct/sessionSize)*100);
 $('endSummary').textContent=`${pct} % richtig. Was schwierig war, kommt öfter wieder.`;
}
$('continue').onclick=()=>{
 if(total>=sessionSize){endSession();return}
 index++;
 render();
};
document.querySelectorAll('.session-option').forEach(b=>b.onclick=()=>startSession(Number(b.dataset.size)));
$('playAgain').onclick=()=>{$('endScreen').classList.add('hidden');$('sessionScreen').classList.remove('hidden')};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.a));
document.addEventListener('keydown',e=>{if($('feedback').classList.contains('show')){if(e.key==='Enter'||e.key===' ')$('continue').click();return}if(e.key==='ArrowLeft'||e.key==='1')choose('der');if(e.key==='ArrowUp'||e.key==='2')choose('die');if(e.key==='ArrowRight'||e.key==='3')choose('das')});



function goBackToHome(){
  try{
    if(window.parent && window.parent!==window){
      if(typeof window.parent.closeApp==="function"){window.parent.closeApp();return;}
      const parentDoc=window.parent.document;
      const shell=parentDoc.getElementById("appShell");
      const frame=parentDoc.getElementById("appFrame");
      if(shell && frame){
        shell.classList.remove("open");shell.setAttribute("aria-hidden","true");
        parentDoc.documentElement.classList.remove("app-open");frame.src="about:blank";return;
      }
    }
  }catch(e){}
  window.parent.postMessage({type:"deutsch:home"},"*");
}
document.getElementById("homeBack").onclick=goBackToHome;
</script></body></html>
