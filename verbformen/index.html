<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verbformen.</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verbformen">
<style>
*{box-sizing:border-box}
:root{--bg:#17181a;--cream:#eee7dc;--mint:#5bc8a4;--coral:#ff7770;--line:rgba(255,255,255,.08)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{height:100vh;height:100dvh;overflow:hidden;padding:0}
.app{position:fixed;inset:0;width:min(100%,480px);height:100vh;height:100dvh;margin:0 auto;padding:24px;padding-top:max(24px,calc(env(safe-area-inset-top) + 12px));padding-bottom:max(24px,env(safe-area-inset-bottom));overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#777;font-size:13px;position:sticky;top:0;z-index:50;background:var(--bg);padding:4px 0 10px;margin-bottom:0}
.brand{font-family:Georgia,serif;font-size:20px;color:#a5a19a;letter-spacing:-.5px}.mode{text-transform:uppercase;letter-spacing:.15em;font-size:9px;color:#686967;white-space:nowrap}.top #count{text-align:right}
.progress{height:3px;background:#292a2c;border-radius:9px;overflow:hidden;margin-bottom:32px;position:sticky;top:36px;z-index:50}
.progress>i{display:block;height:100%;background:#777;border-radius:9px}
.card{position:relative;text-align:center;padding:30px 20px 26px;isolation:isolate}
.card:before{content:"";position:absolute;z-index:-1;inset:-100px -30px;background:radial-gradient(ellipse at 50% 53%,rgba(91,200,164,.09),transparent 63%);opacity:.35}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#6f706f;margin-bottom:18px}
.verb{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(58px,17vw,84px);letter-spacing:-3px;line-height:1;margin-bottom:13px}
.translation{color:#737473;font-size:16px;margin-bottom:44px}
.answer{width:100%;height:66px;border:1px solid #343638;border-radius:18px;background:#1c1d1f;color:var(--cream);font-family:Georgia,serif;font-size:29px;text-align:center;outline:none;padding:0 18px}
.answer:focus{border-color:rgba(91,200,164,.55);box-shadow:0 0 0 3px rgba(91,200,164,.08)}
.answer::placeholder{color:#48494a}
.check,.next,.choice,.again{font:inherit;cursor:pointer}
.check{margin-top:14px;width:100%;height:56px;border:0;border-radius:17px;background:#ece6dc;color:#1b1c1e;font-size:16px;font-weight:650}
.check:active,.next:active,.choice:active,.again:active{transform:scale(.99)}
.result{display:none;margin-top:28px;border-top:1px solid var(--line);padding:30px 26px 0;text-align:left}
.result.show{display:block}
.result.good{border-top-color:var(--mint);box-shadow:0 -24px 65px -32px rgba(91,200,164,.8)}
.result.bad{border-top-color:var(--coral);box-shadow:0 -24px 70px -30px rgba(255,119,112,.85)}
.state{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.good .state{color:var(--mint)}.bad .state{color:var(--coral)}
.forms{font-family:Georgia,serif;font-size:26px;line-height:1.35;margin-bottom:10px}
.meta{color:#92918e;font-size:15px;line-height:1.55}.example{margin-top:15px;color:#b8b3aa;font-size:15px;font-style:italic}
.next{display:none;margin-top:18px;width:100%;height:56px;border:1px solid #37383a;border-radius:17px;background:#222326;color:var(--cream);font-size:16px;font-weight:600}
.next.show{display:block}
.start,.finish{text-align:center;padding:36px 20px}
.title{font-family:Georgia,serif;font-size:clamp(54px,15vw,78px);font-weight:400;letter-spacing:-3px;margin:0 0 12px}
.subtitle{color:#777;font-size:16px;margin:0 0 36px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{height:62px;border:1px solid #36383a;border-radius:18px;background:#202124;color:var(--cream);font-size:20px}
.choice:hover{border-color:#555}
.finish h2{font-family:Georgia,serif;font-size:48px;font-weight:400;margin:0 0 12px}
.finish p{color:#888;margin:0 0 28px;line-height:1.5}
.again{width:100%;height:56px;border:0;border-radius:17px;background:#ece6dc;color:#1b1c1e;font-weight:650}
.hidden{display:none!important}

/* Stable top-anchored layout: keyboard/result changes never re-center the app. */
@media(max-width:600px){
 .app{padding-left:24px;padding-right:24px;padding-top:max(18px,calc(env(safe-area-inset-top) + 10px));}
 .card{padding-top:14px}
}

/* v6: stable layout — no keyboard-driven resizing */
@media(max-width:600px){
 .result{margin-top:22px;padding:22px 24px 0}
 .state{font-size:10px;margin-bottom:9px}
 .forms{font-size:22px;line-height:1.28;margin-bottom:7px}
 .meta{font-size:13px;line-height:1.4}
 .example{margin-top:10px;font-size:13px;line-height:1.4}
 .next{margin-top:13px;height:52px}
}
.version-tag{
 position:fixed;
 right:8px;
 bottom:max(6px,env(safe-area-inset-bottom));
 z-index:9999;
 font-size:9px;
 letter-spacing:.08em;
 color:rgba(255,255,255,.22);
 pointer-events:none;
}


/* v14 custom mobile keyboard */
.touch-keyboard{display:none}
@media(max-width:900px){
 .check{display:none!important}
 .app.showing-result .touch-keyboard{display:none!important}
 .touch-keyboard{display:block!important;width:100%;margin-top:16px;padding:15px 10px 12px;border:1px solid #303235;border-radius:24px;background:#191a1c}
 .key-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
 .key-row-mid{padding:0 4.5%}.key-row-bottom{gap:5px}
 .key{min-width:0;flex:1;height:52px;padding:0;border:1px solid #3b3d40;border-radius:11px;background:#222326;color:#e9e3d9;font:500 20px/1 system-ui;touch-action:manipulation}
 .key-special{color:#b7d5ca}.key-backspace{flex:1.35;font-size:22px}
 .key-submit{width:100%;height:54px;margin-top:4px;border:0;border-radius:15px;background:#e9e3d9;color:#17181a;font-size:16px;font-weight:700;touch-action:manipulation}
}

</style>
</head>
<body>
<main class="app" id="appRoot">
 <section id="start" class="start">
  <h1 class="title">Verbformen.</h1>
  <p class="subtitle">How many verbs?</p>
  <div class="choices">
   <button class="choice" data-size="10">10</button>
   <button class="choice" data-size="20">20</button>
   <button class="choice" data-size="30">30</button>
  </div>
 </section>

 <section id="study" class="hidden">
  <div class="top"><span class="brand">Verbformen.</span><span class="mode">Partizip II</span><span id="count"></span></div>
  <div class="progress"><i id="bar"></i></div>
  <section class="card">
   <div class="verb" id="verb"></div>
   <div class="translation" id="translation"></div>
   <input id="answer" class="answer" placeholder="…" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
   <button class="check" id="check">Check</button>

   <div id="touchKeyboard" class="touch-keyboard" aria-label="German keyboard">
    <div class="key-row"><button type="button" class="key" data-key="q">q</button><button type="button" class="key" data-key="w">w</button><button type="button" class="key" data-key="e">e</button><button type="button" class="key" data-key="r">r</button><button type="button" class="key" data-key="t">t</button><button type="button" class="key" data-key="z">z</button><button type="button" class="key" data-key="u">u</button><button type="button" class="key" data-key="i">i</button><button type="button" class="key" data-key="o">o</button><button type="button" class="key" data-key="p">p</button></div>
    <div class="key-row key-row-mid"><button type="button" class="key" data-key="a">a</button><button type="button" class="key" data-key="s">s</button><button type="button" class="key" data-key="d">d</button><button type="button" class="key" data-key="f">f</button><button type="button" class="key" data-key="g">g</button><button type="button" class="key" data-key="h">h</button><button type="button" class="key" data-key="j">j</button><button type="button" class="key" data-key="k">k</button><button type="button" class="key" data-key="l">l</button></div>
    <div class="key-row key-row-bottom"><button type="button" class="key key-special" data-key="ä">ä</button><button type="button" class="key" data-key="y">y</button><button type="button" class="key" data-key="x">x</button><button type="button" class="key" data-key="c">c</button><button type="button" class="key" data-key="v">v</button><button type="button" class="key" data-key="b">b</button><button type="button" class="key" data-key="n">n</button><button type="button" class="key" data-key="m">m</button><button type="button" class="key key-special" data-key="ö">ö</button><button type="button" class="key key-special" data-key="ü">ü</button><button type="button" class="key key-special" data-key="ß">ß</button><button type="button" class="key key-backspace" data-action="backspace">⌫</button></div>
    <button type="button" class="key-submit" data-action="submit">Check</button>
   </div>

   <div class="result" id="result">
    <div class="state" id="state"></div>
    <div class="forms" id="forms"></div>
    <div class="meta" id="meta"></div>
    <div class="example" id="example"></div>
   </div>
   <button class="next" id="next">Continue</button>
  </section>
 </section>

 <section id="finish" class="finish hidden">
  <h2>Done.</h2>
  <p id="summary"></p>
  <button class="again" id="again">Another session</button>
 </section>
</main>
<div class="version-tag">v15</div>

<script src="verbs.js"></script>
<script>
const STORAGE_KEY="verbformenDifficultyV1";
let difficulty={};
try{difficulty=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(e){difficulty={}}

let deck=[],index=0,sessionSize=10,checked=false,correctCount=0;

const $=id=>document.getElementById(id);
const useTouchKeyboard = window.innerWidth <= 900;
const touchKeyboard = $("touchKeyboard");
if(useTouchKeyboard){
 $("answer").readOnly = true;
 $("answer").inputMode = "none";
}
touchKeyboard.addEventListener("click", e => {
 const b=e.target.closest("button");
 if(!b || $("answer").disabled) return;
 if(b.dataset.key) $("answer").value += b.dataset.key;
 else if(b.dataset.action==="backspace") $("answer").value=$("answer").value.slice(0,-1);
 else if(b.dataset.action==="submit") checkAnswer();
});
$("answer").addEventListener("pointerdown", e => {
 if(useTouchKeyboard){e.preventDefault();$("answer").blur();}
});

const key=v=>v.infinitive.toLowerCase();

function saveDifficulty(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(difficulty));
}

function weightFor(v){
 return Math.max(1,Number(difficulty[key(v)]||1));
}

/* Weighted sampling WITHOUT replacement:
   difficult verbs are more likely to enter a session,
   but no verb can occur twice in that session. */
function buildDeck(size){
 const ranked=VERBS.map(v=>{
   const weight=weightFor(v);
   const randomKey=-Math.log(Math.max(Math.random(),1e-12))/weight;
   return {v,randomKey};
 }).sort((a,b)=>a.randomKey-b.randomKey);

 return ranked.slice(0,Math.min(size,VERBS.length)).map(x=>x.v);
}

function startSession(size){
 sessionSize=Math.min(size,VERBS.length);
 deck=buildDeck(sessionSize);
 index=0;correctCount=0;
 $("start").classList.add("hidden");
 $("finish").classList.add("hidden");
 $("study").classList.remove("hidden");
 render();
}

function render(){
 $("appRoot").classList.remove("showing-result");
 const v=deck[index];checked=false;
 $("verb").textContent=v.infinitive;
 $("translation").textContent=v.translation;
 $("answer").value="";
 $("result").className="result";
 $("next").className="next";
 $("check").style.display="";
 $("count").textContent=(index+1)+" / "+deck.length;
 $("bar").style.width=((index+1)/deck.length*100)+"%";
 $("answer").disabled=false;
 setTimeout(()=>{
   const isTouchPhone = window.matchMedia("(pointer: coarse)").matches;
   if(!isTouchPhone){
     try{$("answer").focus({preventScroll:true})}catch(e){$("answer").focus()}
   }
  },80);
}

function updateDifficulty(v,correct){
 const k=key(v);
 let d=weightFor(v);
 if(correct){
   d=Math.max(1,d-0.5);
 }else{
   d=Math.min(6,d+1.5);
 }
 difficulty[k]=Number(d.toFixed(2));
 saveDifficulty();
}

function checkAnswer(){
 if(checked){next();return}
 const v=deck[index];
 const a=$("answer").value.trim().toLowerCase();
 if(!a)return;

 checked=true;
 const ok=a===v.participle.toLowerCase();
 if(ok)correctCount++;
 updateDifficulty(v,ok);

 $("result").className="result show "+(ok?"good":"bad");
 $("state").textContent=ok?"Correct":"Not quite";
 $("forms").textContent=v.infinitive+" → "+v.preterite+" → "+v.participle;
 $("meta").innerHTML="Perfekt: <b>"+v.auxiliary+" "+v.participle+"</b>";
 $("example").textContent=v.example;
 $("appRoot").classList.add("showing-result");
 $("answer").disabled=true;
 $("answer").blur();
 $("check").style.display="none";
 $("next").className="next show";
}

function next(){
 if(index+1>=deck.length){finishSession();return}
 index++;
 render();

 // On iPhone/mobile, Continue should take us straight into typing
 // without requiring another tap on the input.
 if(window.matchMedia("(pointer: coarse)").matches){
   setTimeout(()=>{
     try{$("answer").focus({preventScroll:true})}catch(e){$("answer").focus()}
   },180);
 }
}

function finishSession(){
 $("study").classList.add("hidden");
 $("finish").classList.remove("hidden");
 $("summary").textContent=correctCount+" of "+deck.length+" correct. Difficult verbs will have a better chance of returning in a future session.";
}

document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>startSession(Number(b.dataset.size))));
$("check").onclick=checkAnswer;
$("next").onclick=next;
$("again").onclick=()=>{
 $("finish").classList.add("hidden");
 $("start").classList.remove("hidden");
};

document.addEventListener("keydown", e => {
 if (e.key === "Enter") {
   e.preventDefault();

   if (checked) {
     next();
   } else if (document.activeElement === $("answer")) {
     checkAnswer();
   }
 }
});
</script>
</body>
</html>
