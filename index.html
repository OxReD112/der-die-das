<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1d">
  <title>Deutsch</title>
  <style>
    :root{--bg:#1b1b1d;--text:#f2f0ed;--muted:#8f8f94;--line:#303034;--mint:#55d7b5}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 28px) max(24px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 32px) max(24px,env(safe-area-inset-left))}
    .page{width:min(100%,720px);margin:0 auto}
    header{margin-bottom:52px}
    h1{margin:0;font-size:32px;line-height:1;letter-spacing:-.7px;font-weight:750}
    .rule{height:4px;width:100%;margin-top:18px;background:var(--line);border-radius:99px;overflow:hidden}
    .rule:before{content:"";display:block;width:18%;height:100%;background:var(--mint);border-radius:99px}
    .intro{margin:0 0 26px;color:var(--muted);font-size:15px;line-height:1.4}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 20px}
    .module{display:block;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
    .icon-wrap{width:100%;aspect-ratio:1;border-radius:25%;overflow:hidden;background:#202023;box-shadow:0 15px 38px rgba(0,0,0,.18);transition:transform .12s ease,opacity .12s ease}
    .module:active .icon-wrap{transform:scale(.975);opacity:.88}
    .icon-wrap img{display:block;width:100%;height:100%;object-fit:cover}
    .name{margin-top:11px;font-size:17px;line-height:1.2;font-weight:650;text-align:center;letter-spacing:-.15px}
    .status{min-height:16px;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.2;text-align:center}
    @media(min-width:650px){body{padding-top:48px}header{margin-bottom:62px}.grid{gap:34px 28px}.name{font-size:18px}}
    @media(max-width:360px){body{padding-left:20px;padding-right:20px}.grid{gap:22px 16px}.name{font-size:16px}}
  
/* Home v2 */
header{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 22px);
  left:max(24px, env(safe-area-inset-left));
  right:max(24px, env(safe-area-inset-right));
  z-index:20;
  margin:0;
  padding:0;
  background:var(--bg);
}
.rule{display:none!important}

.page{
  padding-top:76px;
}

.grid{
  grid-template-columns:repeat(2, minmax(0, 150px));
  justify-content:center;
  gap:28px 28px;
}

.icon-wrap{
  width:100%;
  max-width:150px;
  margin:0 auto;
}

@media(max-width:430px){
  .grid{
    grid-template-columns:repeat(2, minmax(0, 118px));
    gap:26px 24px;
  }
  .icon-wrap{max-width:118px}
}

@media(max-width:360px){
  .grid{
    grid-template-columns:repeat(2, minmax(0, 108px));
    gap:24px 20px;
  }
  .icon-wrap{max-width:108px}
}


/* Home v2.2 — desktop alignment + 3-column modules */
header{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 22px);
  left:50%;
  right:auto;
  width:min(calc(100% - 48px),720px);
  transform:translateX(-50%);
  z-index:20;
  margin:0;
  padding:0;
  background:var(--bg);
}

.intro{
  text-align:center;
}

.grid{
  grid-template-columns:repeat(3, minmax(0, 118px));
  justify-content:center;
  gap:28px 26px;
}

.icon-wrap{
  width:100%;
  max-width:118px;
  margin:0 auto;
}

@media(max-width:430px){
  header{
    width:calc(100% - 48px);
  }
  .grid{
    grid-template-columns:repeat(3, minmax(0, 92px));
    gap:24px 16px;
  }
  .icon-wrap{max-width:92px}
  .name{font-size:15px}
}

@media(max-width:350px){
  .grid{
    grid-template-columns:repeat(3, minmax(0, 82px));
    gap:22px 12px;
  }
  .icon-wrap{max-width:82px}
  .name{font-size:14px}
}


/* Home v2.3 — embedded exercise shell */
.module{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  padding:0;
  margin:0;
  background:none;
  font:inherit;
  cursor:pointer;
}

.app-open,
.app-open body{
  overflow:hidden;
  height:100%;
}

.app-shell{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  background:#1b1b1d;
}

.app-shell.open{
  display:block;
}

.app-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#1b1b1d;
}

.home-back{
  position:absolute;
  z-index:1001;
  top:calc(env(safe-area-inset-top) + 8px);
  left:max(10px, env(safe-area-inset-left));
  width:42px;
  height:42px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(27,27,29,.78);
  color:#f2f0ed;
  font:300 38px/36px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  text-align:center;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  cursor:pointer;
}


/* Home v2.4 */
header h1{
  text-align:center;
}

.home-version{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 10px);
  z-index:10;
  text-align:center;
  color:#55555a;
  font-size:11px;
  line-height:1;
  letter-spacing:.35px;
  pointer-events:none;
}


/* Home v2.5 — subtle floating Home control */
.home-back{
  top:auto!important;
  right:auto!important;
  bottom:calc(env(safe-area-inset-bottom) + 12px)!important;
  left:max(12px, env(safe-area-inset-left))!important;
  width:44px!important;
  height:44px!important;
  padding:0!important;
  border:1px solid rgba(255,255,255,.07)!important;
  border-radius:50%!important;
  background:rgba(27,27,29,.58)!important;
  color:rgba(242,240,237,.52)!important;
  font:400 22px/42px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif!important;
  text-align:center!important;
  -webkit-backdrop-filter:blur(10px)!important;
  backdrop-filter:blur(10px)!important;
  box-shadow:none!important;
}

/* On wider screens, align it with the left edge of the embedded app area
   rather than the browser window edge. */
@media(min-width:529px){
  .home-back{
    left:calc(50% - 240px + 12px)!important;
  }
}


/* Home v2.6 — wider home glyph */
.home-back{
  font-stretch:expanded;
}
.home-back::first-letter{
  /* fallback handled by transform on the button's text rendering */
}
.home-back{
  text-indent:0;
}

.home-glyph{
  display:inline-block;
  transform:scaleX(1.28);
  transform-origin:center;
}


/* Home v2.7 — daily dashboard */
.today{
  width:min(100%, 520px);
  margin:42px auto 0;
  padding-top:24px;
  border-top:1px solid rgba(255,255,255,.08);
}
.today-title{
  margin:0 0 15px;
  font-size:14px;
  font-weight:600;
  color:#d8d6d2;
}
.today-row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:6px 0;
  color:#8f8f94;
  font-size:13px;
  line-height:1.35;
}
.today-row strong{
  color:#d8d6d2;
  font-weight:500;
}
.today-total{
  margin-top:15px;
  color:#6f6f74;
  font-size:12px;
  text-align:center;
}

</style>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
  <main class="page">
    <header><h1>Deutsch.</h1></header>
    <p class="intro">Was möchtest du heute üben?</p>
    <section class="grid" aria-label="Übungen">
      <button class="module" type="button" data-app="artikel/?v=2.2"><div class="icon-wrap"><img src="artikel/icon.png" alt=""></div><div class="name">Artikel</div><div class="status">&nbsp;</div></button>
      <button class="module" type="button" data-app="verbformen/?v=2.1"><div class="icon-wrap"><img src="verbformen/icon.png" alt=""></div><div class="name">Verbformen</div><div class="status">&nbsp;</div></button>
      <button class="module" type="button" data-app="wortschatz/?v=2.1"><div class="icon-wrap"><img src="wortschatz/icon.png" alt=""></div><div class="name">Wortschatz</div><div class="status">&nbsp;</div></button>
      <button class="module" type="button" data-app="pronomen/?v=2.1"><div class="icon-wrap"><img src="pronomen/icon.png" alt=""></div><div class="name">Pronomen</div><div class="status">&nbsp;</div></button>
    </section>

    <section class="today" aria-label="Heutige Statistik">
      <h2 class="today-title">Heute</h2>
      <div class="today-row"><strong>Artikel</strong><span id="todayArtikel">0 Antworten · 0 richtig</span></div>
      <div class="today-row"><strong>Verbformen</strong><span>—</span></div>
      <div class="today-row"><strong>Wortschatz</strong><span>noch offen</span></div>
      <div class="today-row"><strong>Pronomen</strong><span>—</span></div>
      <div class="today-total" id="todayTotal">0 Übungen heute</div>
    </section>
  </main>


  <div class="home-version" aria-hidden="true">Deutsch Home · v2.9</div>

  <section id="appShell" class="app-shell" aria-hidden="true">
    <button id="homeBack" class="home-back" type="button" aria-label="Home"><span class="home-glyph">⌂</span></button>
    <iframe id="appFrame" class="app-frame" title="Deutsch exercise"></iframe>
  </section>

  <script>

    const DAILY_STATS_KEY='deutschDailyStatsV1';
    function localDayKey(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function renderDailyStats(){
      let data={};
      try{ data=JSON.parse(localStorage.getItem(DAILY_STATS_KEY)||'{}'); }catch(e){}
      if(data.date!==localDayKey()) data={};
      const a=data.artikel||{answers:0,correct:0};
      document.getElementById('todayArtikel').textContent=`${a.answers} Antworten · ${a.correct} richtig`;
      document.getElementById('todayTotal').textContent=`${a.answers} Übungen heute`;
    }

    const shell = document.getElementById('appShell');
    const frame = document.getElementById('appFrame');
    const back = document.getElementById('homeBack');

    document.querySelectorAll('[data-app]').forEach(button => {
      button.addEventListener('click', () => {
        frame.src = button.dataset.app;
        shell.classList.add('open');
        shell.setAttribute('aria-hidden', 'false');
        document.documentElement.classList.add('app-open');
      });
    });

    function closeApp() {
      renderDailyStats();
      shell.classList.remove('open');
      shell.setAttribute('aria-hidden', 'true');
      document.documentElement.classList.remove('app-open');
      frame.src = 'about:blank';
    }

    back.addEventListener('click', closeApp);
    renderDailyStats();
  </script>

</body>
</html>
