<!-- Reusable German keyboard component -->
<style>
.keyboard{
  /* ===== PALETTE (dark, default) — override these to theme the keyboard ===== */
  --key:#303033;
  --key-text:#eee;
  --key-active-bg:#3a3a3e;
  --special-text:#b8ddd2;
  --mint:#43d2ad;
  --ok-active-text:#fff;
  --popup-bg:#3a3a3e;
  --popup-text:#eee;

  /* ===== LAYOUT ===== */
  display:none;
  width:100%;
  margin-top:20px;
  padding-top:12px;
  position:relative;
}

/* Light theme — active only when something above this component in the
   DOM (the host page's <html>) carries data-theme="light". This component
   never decides its own theme; it just inherits whatever the host page set. */
[data-theme="light"] .keyboard{
  --key:#efece6;
  --key-text:#242426;
  --key-active-bg:#e2ded4;
  --special-text:#2f8f78;
  --mint:#2f9e82;
  --ok-active-text:#fff;
  --popup-bg:#efece6;
  --popup-text:#242426;
}

/* Visible only when both are true: this is a touch device (detected once,
   below, and marked with "is-touch") AND the host app wants it shown right
   now (the "show" class, toggled per question). Neither class alone shows it. */
.keyboard.is-touch.show{display:block}

.keyPopup{position:absolute;z-index:20;display:none;align-items:center;justify-content:center;pointer-events:none;width:48px;height:56px;border:1px solid transparent;border-radius:11px;background:var(--popup-bg);color:var(--popup-text);font-size:25px;font-weight:500;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.keyPopup.show{display:flex}

/* ===== ROWS & KEYS ===== */
.row{display:flex;justify-content:center;gap:3px;margin-bottom:5px}
.key{height:44px;width:calc((100% - 27px)/10);padding:0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;flex:0 0 calc((100% - 27px)/10);min-width:0;border:1px solid transparent;border-radius:10px;background:var(--key);color:var(--key-text);font-size:20px;-webkit-tap-highlight-color:transparent}
.row.third{justify-content:flex-end}
.row.third .back{margin-left:0;flex:0 0 calc(2 * ((100% - 27px)/10) + 3px);width:calc(2 * ((100% - 27px)/10) + 3px)}
.row.special{width:100%;justify-content:center;gap:3px}
.row.special .key{color:var(--special-text)}
.row.special .space{flex:1 1 auto;width:auto;color:var(--key-text)}
.row.special .ok{margin-left:0;flex:0 0 calc(2.5 * ((100% - 27px)/10) + 4.5px);width:calc(2.5 * ((100% - 27px)/10) + 4.5px);color:var(--mint);border-color:transparent;font-size:22px;font-weight:500}

/* ===== PRESS FEEDBACK (touch only) ===== */
.keyboard.is-touch .key{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transform:scale(1);transform-origin:center;transition:transform .09s ease,background-color .09s ease,border-color .09s ease;will-change:transform}
.keyboard.is-touch .key:active,.keyboard.is-touch .key.is-pressed{transform:scale(1.08);background:var(--key-active-bg);border-color:transparent;position:relative;z-index:3}
.keyboard.is-touch .key.ok:active,.keyboard.is-touch .key.ok.is-pressed{border-color:var(--mint);background:var(--mint);color:var(--ok-active-text)}
</style>
<div class="keyboard" id="keyboard"><div class="keyPopup" id="keyPopup" aria-hidden="true"></div>
 <div class="row" data-keys="QWERTYUIOP"></div>
 <div class="row" data-keys="ASDFGHJKL"></div>
 <div class="row third" data-keys="ßZXCVBNM"><button class="key back" data-key="BACK">⌫</button></div>
 <div class="row special"><button class="key" data-key="ä">ä</button><button class="key" data-key="ö">ö</button><button class="key" data-key="ü">ü</button><button class="key space" data-key="SPACE" aria-label="Space">&nbsp;</button><button class="key ok" data-key="OK">✓</button></div>
</div>
<script>
(()=>{
 const kb=document.getElementById("keyboard"),popup=document.getElementById("keyPopup");
 if(!kb||!popup)return;

 // This keyboard only ever appears on touch devices. Detected once here,
 // rather than by the host page fighting viewport-width media queries.
 const isTouchDevice = navigator.maxTouchPoints > 0 || window.matchMedia("(pointer: coarse)").matches;
 if(isTouchDevice) kb.classList.add("is-touch");

 let hideTimer=0;
 const release=()=>{
   kb.querySelectorAll(".key.is-pressed").forEach(k=>k.classList.remove("is-pressed"));
   clearTimeout(hideTimer);
   hideTimer=setTimeout(()=>{popup.classList.remove("show");popup.textContent=""},50);
 };
 kb.addEventListener("touchstart",e=>{
   const key=e.target.closest(".key");if(!key)return;
   key.classList.add("is-pressed");clearTimeout(hideTimer);
   const k=key.dataset.key||"";if(k.length!==1)return;
   popup.textContent=key.textContent;popup.classList.add("show");
   const kr=key.getBoundingClientRect(),r=kb.getBoundingClientRect(),pr=popup.getBoundingClientRect();
   popup.style.left=(kr.left-r.left+kr.width/2-pr.width/2)+"px";
   popup.style.top=(kr.top-r.top-pr.height+1)+"px";
 },{passive:true});
 // Each tap must produce exactly one key. A tap fires "touchend" and then,
 // a moment later, the browser's own synthetic "click". We type on touchend,
 // cancel that synthetic click, and additionally ignore any click that comes
 // within 800 ms of the most recent touch. (The old version used a shared
 // 450 ms timer: when typing fast, an earlier tap's timer switched the guard
 // off before the later tap's click arrived, so that letter typed twice.)
 let lastTouchEnd=0;
 const emit=(b)=>{
   if(!b)return;
   kb.dispatchEvent(new CustomEvent("deutsch-keyboard-input",{bubbles:true,composed:true,detail:{key:b.dataset.key||""}}));
 };
 kb.addEventListener("touchend",e=>{
   lastTouchEnd=Date.now();
   const b=e.target.closest("[data-key]");
   if(b){if(e.cancelable)e.preventDefault();emit(b)}
   release();
 },{passive:false});
 kb.addEventListener("touchcancel",e=>{lastTouchEnd=Date.now();release()},{passive:true});
 kb.addEventListener("click",e=>{
   const b=e.target.closest("[data-key]");if(!b)return;
   if(Date.now()-lastTouchEnd<800){e.preventDefault();return}
   emit(b);
 });
 document.querySelectorAll("#keyboard .row[data-keys]").forEach(row=>{
   const back=row.querySelector(".back");
   for(const ch of row.dataset.keys){
     const b=document.createElement("button");b.className="key";b.dataset.key=ch.toLowerCase();b.textContent=ch;row.insertBefore(b,back);
   }
 });
})();
</script>
