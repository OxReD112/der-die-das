<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("deutschThemeV1") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fester Kasus" />
    <title>Fester Kasus</title>
    <link rel="stylesheet" href="kasus.css?v=1" />
  </head>
  <body>
    <main class="app">
      <section id="sessionScreen">
        <h1>Fester Kasus</h1>
        <p>Wie viele Übungen?</p>
        <div class="session-options">
          <button class="session-option" data-size="10">10</button>
          <button class="session-option" data-size="20">20</button>
          <button class="session-option" data-size="30">30</button>
        </div>
      </section>

      <section id="game" class="hidden">
        <header class="top">
          <div class="top-row">
            <div class="top-title">Fester Kasus</div>
            <div class="counter" id="counter">1 / 10</div>
          </div>
          <div class="progress"><i id="bar"></i></div>
        </header>

        <section class="card" id="questionCard">
          <div class="preposition" id="preposition">mit</div>
          <div class="translation" id="translation"></div>
        </section>

        <section class="answer-state hidden" id="answerState">
          <div class="answer-card-main" id="answerCardMain">
            <div class="answer-eyebrow" id="answerEyebrow">Richtig</div>
            <div class="answer-preposition" id="answerPreposition">mit</div>
            <div class="answer-divider" id="answerDivider"></div>
            <div class="answer-case-large" id="answerCase">Dativ</div>
            <div class="answer-note" id="rule"></div>
            <div class="answer-example" id="exampleText"></div>
            <div class="answer-example-translation" id="exampleTranslation"></div>
          </div>
        </section>

        <section class="choices" id="choices">
          <button class="case-choice" data-case="Akkusativ">Akkusativ</button>
          <button class="case-choice" data-case="Dativ">Dativ</button>
          <button class="case-choice" data-case="Genitiv">Genitiv</button>
        </section>
        <button class="hidden" id="next">Weiter</button>
      </section>

      <section class="hidden" id="endScreen">
        <h1>Fertig.</h1>
        <div class="end-score" id="endScore">0 / 10</div>
        <div class="end-note" id="endNote"></div>
        <div class="finish-actions">
          <button id="playAgain">Noch eine Runde</button>
          <button id="homeBack">Zur Startseite</button>
        </div>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>
      <div class="version-mark">v19</div>
    </main>

    <script src="../../components/deutsch-translation-v1.js?v=2"></script>
    <script src="../../components/deutsch-day-v1.js?v=1"></script>
    <script src="prepositions.js?v=12"></script>
    <script src="../../components/deutsch-progress-v1.js"></script>
    <script src="kasus.js?v=2"></script>
    <script src="../../components/deutsch-wide-v1.js?v=2"></script>
</body>
</html>
