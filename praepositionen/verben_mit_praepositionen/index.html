<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
(function(){
  if(localStorage.getItem("deutschThemeV1")==="light"){
    document.documentElement.setAttribute("data-theme","light");
  }
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verben + Präp.">
<title>Verben mit Präpositionen</title>
<style>
/* Registered so each half of the line/glow can fade between mint and red.
   --state-l = preposition (left half), --state-r = case (right half). */
@property --state-l{syntax:"<color>";inherits:true;initial-value:#5bc8a4}
@property --state-r{syntax:"<color>";inherits:true;initial-value:#5bc8a4}

:root{
  /* ===== PALETTE (dark, default) — same as Pronomen ===== */
  --bg:#1b1b1d;
  --text:#f2f0ed;
  --muted:#8f8f94;
  --tertiary-text:#c8c7c4;
  --secondary-text:#c8c7c4;
  --mint:#5bc8a4;
  --red:#ff7770;

  --key:#303033;

  --line:rgba(255,255,255,.10);
  --divider:rgba(255,255,255,.08);
  --feedback-divider:rgba(255,255,255,.11);
  --gap-line:rgba(255,255,255,.28);

  --version-text:rgba(255,255,255,.18);

  --cta-bg:#eee8df;
  --cta-text:#171719;

  --home-bg:rgba(255,255,255,.10);
  --home-text:rgba(238,231,220,.55);
  --home-back-bg:#ece6dc;
  --home-back-text:#1b1c1e;
  --weak-text:#c8c7c4;

  /* ===== CASE BUTTONS (same as Fester Kasus) ===== */
  --button-bg:#2a2b2e;
  --button-bg-hover:#313235;
  --button-text:#fff;
  --button-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 14px rgba(0,0,0,.14);
  --button-shadow-hover:inset 0 1px 0 rgba(255,255,255,.05),0 7px 18px rgba(0,0,0,.16);
  --button-shadow-active:inset 0 1px 0 rgba(255,255,255,.03),0 3px 9px rgba(0,0,0,.12);
  --focus:rgba(255,255,255,.18);
}

[data-theme="light"]{
  --bg:#f6f4f1;
  --text:#242426;
  --muted:#727278;
  --tertiary-text:#727278;
  --secondary-text:#55565b;
  --mint:#3fa68a;
  --red:#e95e66;

  --key:#efece6;

  --line:rgba(0,0,0,.10);
  --divider:rgba(0,0,0,.08);
  --feedback-divider:rgba(0,0,0,.11);
  --gap-line:rgba(0,0,0,.25);

  --version-text:rgba(0,0,0,.18);

  --cta-bg:#242426;
  --cta-text:#f5f5f7;

  --home-bg:rgba(0,0,0,.06);
  --home-text:rgba(36,36,38,.6);
  --home-back-bg:#242426;
  --home-back-text:#f5f5f7;
  --weak-text:#55565b;

  --button-bg:#fff;
  --button-bg-hover:#f4f2ef;
  --button-text:#242426;
  --button-shadow:0 0 0 1px rgba(0,0,0,.09),0 4px 12px rgba(0,0,0,.07);
  --button-shadow-hover:0 0 0 1px rgba(0,0,0,.07),0 6px 16px rgba(0,0,0,.07);
  --button-shadow-active:0 0 0 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.05);
  --focus:rgba(0,0,0,.18);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;justify-content:center}
.app{width:min(760px,100%);padding:calc(env(safe-area-inset-top) + 8px) 18px 42px}
.screen{min-height:690px;padding:20px 14px}
.hidden{display:none!important}
.start-title{margin:38px 0 11px;font-size:36px;line-height:1.05;letter-spacing:-.04em}
.start-sub{font-size:16px;font-weight:400;line-height:1.5;color:var(--muted);margin-bottom:4px}
.center{text-align:center}
.muted{color:var(--muted)}
h1{font-size:34px;letter-spacing:-.03em;margin:0 0 10px}
p{line-height:1.5}
.options{display:flex;justify-content:center;gap:10px;margin:28px 0}
.btn,.size{border:1px solid var(--line);background:var(--key);color:var(--text);border-radius:17px;padding:15px 18px;font-size:17px;font-weight:650;cursor:pointer;font-family:inherit}
.size{font-size:22px;min-width:82px}
.btn:active{transform:scale(.98)}
/* Session-size buttons (10/20/30): same look as the case buttons, larger numbers. */
.size{border:0;border-radius:14px;background:var(--button-bg);color:var(--button-text);font-weight:650;box-shadow:var(--button-shadow);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.size:hover{background:var(--button-bg-hover);box-shadow:var(--button-shadow-hover);transform:translateY(-1px)}
.size:active{transform:scale(.985);box-shadow:var(--button-shadow-active)}
.size:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ===== TOP BAR ===== */
.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:10;padding-bottom:17px;background:var(--bg)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--divider);border-radius:99px}
.top-title{font-size:18px;font-weight:700}
.counter{color:var(--muted);font-size:14px}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:99px;overflow:hidden;z-index:1}
.progress i{display:block;height:100%;background:var(--mint);width:0;transition:width .25s ease}

/* ===== PROMPT ===== */
.exercise{display:flex;flex-direction:column}
.prompt{text-align:center;margin:44px auto 0;max-width:680px;width:100%}
.sentence{font-size:clamp(30px,7vw,45px);line-height:1.18;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.gap{position:relative;display:inline-block;min-width:3.2em;padding:0 .12em;border-bottom:2px solid var(--gap-line);text-align:center;line-height:1.1;vertical-align:baseline}
html:not(.is-touch) .gap.typing{cursor:text}
.gap.filled{border-bottom-color:transparent;min-width:0;padding:0}
/* Real text field inside the gap: needed for the macOS press-and-hold accent menu (ä ö ü). */
.gap-mirror{visibility:hidden;white-space:pre}
.gap-input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0 .12em;border:0;outline:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-align:center;caret-color:var(--text);-webkit-appearance:none;appearance:none}
html.is-touch .gap-input{pointer-events:none}
/* Slot under the verb: case question/buttons and "+ Kasus" share one grid cell. */
.above-slot{display:grid;margin-top:14px}
/* Keep the question area (and its buttons) above the feedback glow. */
.prompt{position:relative;z-index:1}
.above-slot>*{grid-area:1/1;transition:opacity .25s ease}
.above-slot>.off{opacity:0;visibility:hidden}
.case-line{align-self:start;font-size:clamp(22px,5vw,28px);font-weight:650;letter-spacing:-.02em;line-height:1.2}
.context{color:var(--muted);font-size:16px;line-height:1.4;margin-bottom:17px}

.check{display:none;width:min(600px,100%);margin:28px auto 0;height:56px;border:0;border-radius:17px;background:var(--cta-bg);color:var(--cta-text);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.check:active{transform:scale(.99)}
html:not(.is-touch) .check{display:block}
html:not(.is-touch) .check.hidden{display:none}

/* ===== FEEDBACK (Pronomen style, glow per step) ===== */
.feedback{--state-l:var(--mint);--state-r:var(--mint);position:relative;margin:30px 0 0;padding:32px 0 0;text-align:center;border-top:1px solid var(--feedback-divider);isolation:isolate;transition:--state-l .45s ease,--state-r .45s ease}
.feedback.wrong-l{--state-l:var(--red)}
.feedback.wrong-r{--state-r:var(--red)}
/* Glow: one ellipse per half, masked so they meet softly in the middle.
   When both halves have the same colour it looks like one single glow. */
.glow{position:absolute;z-index:-2;left:0;right:0;top:-180px;height:360px;pointer-events:none;opacity:.9}
.glow.l{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--state-l) 22%,transparent) 0%,color-mix(in srgb,var(--state-l) 10%,transparent) 32%,transparent 70%);-webkit-mask-image:linear-gradient(to right,#000 44%,transparent 56%);mask-image:linear-gradient(to right,#000 44%,transparent 56%)}
.glow.r{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--state-r) 22%,transparent) 0%,color-mix(in srgb,var(--state-r) 10%,transparent) 32%,transparent 70%);-webkit-mask-image:linear-gradient(to right,transparent 44%,#000 56%);mask-image:linear-gradient(to right,transparent 44%,#000 56%)}
/* Divider line: spreads out from the centre; left/right colours blend in the middle. */
.divider{position:absolute;z-index:-1;top:-1px;left:50%;width:0;height:2px;pointer-events:none;animation:spread .42s ease-out forwards}
/* The visible 2px line blends left → right colour in the middle.
   Its soft shadow (same as Pronomen: 18px, 70%) comes from two halves that
   meet exactly at 50%, so the glow is even and never doubles up. */
.divider i{position:absolute;top:0;height:2px}
.divider i.line{left:0;right:0;background:linear-gradient(to right,var(--state-l) 0%,var(--state-l) 46%,var(--state-r) 54%,var(--state-r) 100%)}
.divider i.sl{left:0;right:50%;box-shadow:0 0 18px color-mix(in srgb,var(--state-l) 70%,transparent)}
.divider i.sr{left:50%;right:0;box-shadow:0 0 18px color-mix(in srgb,var(--state-r) 70%,transparent)}
@keyframes spread{to{left:0;width:100%}}
/* Step-1 answer: one line, centred on the same row the result pills use later. */
.given{height:31px;display:flex;align-items:center;justify-content:center;gap:.35em;font-size:30px;font-weight:650;line-height:1;white-space:nowrap}
.bad{color:var(--red)}
.good{color:var(--mint)}
.struck{text-decoration:line-through;text-decoration-thickness:2px}

/* Compact case question + buttons (Fester Kasus style, smaller). */
.case-question{align-self:start;color:var(--muted);font-size:16px;line-height:1.2;padding-top:6px}
.case-step{margin-top:28px}
/* Phone: extra gap above the case buttons grows with the screen height
   (≈ half a button on an iPhone 15, a bit less on small phones, more on large ones).
   Tune the 8dvh / 40px pair to move them. */
html.is-touch .case-step{margin-top:calc(28px + max(0px, 8vh - 40px));margin-top:calc(28px + max(0px, 8dvh - 40px))}
.choices{display:grid;grid-template-columns:repeat(var(--case-count,2),1fr);gap:10px;width:min(600px,100%);margin:0 auto}
.case-choice{appearance:none;border:0;border-radius:14px;min-height:56px;padding:0 18px;background:var(--button-bg);color:var(--button-text);font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;cursor:pointer;box-shadow:var(--button-shadow);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.case-choice:hover{background:var(--button-bg-hover);box-shadow:var(--button-shadow-hover);transform:translateY(-1px)}
.case-choice:active{transform:scale(.985);box-shadow:var(--button-shadow-active)}
.case-choice:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media(max-width:520px){.case-choice{font-size:19px}}

.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:11px;font-size:13px;color:var(--secondary-text)}
.chip .mark{font-weight:700}
.chip.ok .mark{color:var(--mint)}
.chip.no .mark{color:var(--red)}
.chip .struck{color:var(--muted);text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.example{margin-top:24px;font-size:17px;font-weight:400;line-height:1.4;color:var(--tertiary-text)}
.example-tr{margin-top:5px;color:var(--muted);font-size:14px;line-height:1.4}
.continue{position:relative;z-index:2;touch-action:manipulation;width:min(600px,100%);margin-top:40px;border:0;border-radius:15px;padding:15px;background:var(--cta-bg);color:var(--cta-text);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}

/* ===== DONE ===== */
.done-title{font-size:58px;font-weight:700;letter-spacing:-.05em;margin:0 0 6px}
.done-score{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:18px 0 2px}
.done-score-label{color:var(--muted);font-size:14px;margin-bottom:16px}
.done-parts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.done-part{padding:8px 13px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--secondary-text)}
.done-part b{color:var(--text)}
.done-note{color:var(--muted);margin-bottom:28px}
.weak{margin:22px auto;max-width:420px;padding:16px;border:1px solid var(--line);border-radius:17px;color:var(--weak-text);line-height:1.55}
.done-actions{width:min(100%,440px);margin:20px auto 0;display:flex;flex-direction:column;align-items:stretch;gap:10px}
#home,#homeBack{width:100%;height:56px;border:0;border-radius:17px;font:inherit;font-size:16px;font-weight:650;cursor:pointer}
#home{background:var(--home-bg);color:var(--home-text)}
#homeBack{background:var(--home-back-bg);color:var(--home-back-text)}
#home:active,#homeBack:active{transform:scale(.99)}

/* ===== PHONE LAYOUT: TWO ZONES =====
   The question screen fills the phone's height and is split into
   1) a question zone (top): the question is centred in it, and
   2) a keyboard zone (bottom): keyboard + a gap below it that scales with
      the screen height (tune the 33.5dvh / 150px pair to move the keyboard).
   The keyboard zone stays reserved after Check (keyboard only becomes
   invisible), so the question never moves. The line and results are placed
   under the question without affecting the centring. */
html.is-touch .app{padding-bottom:0}
html.is-touch #game{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top) - 8px);min-height:calc(100dvh - env(safe-area-inset-top) - 8px);padding-bottom:env(safe-area-inset-bottom)}
html.is-touch .exercise{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto}
html.is-touch .qzone{display:flex;align-items:center}
html.is-touch .anchor{position:relative;width:100%}
html.is-touch .prompt{margin:0 auto}
html.is-touch .feedback{position:absolute;left:0;right:0;top:100%}
html.is-touch .kbzone{padding-bottom:max(4px,calc(33.5vh - 150px));padding-bottom:max(4px,calc(33.5dvh - 150px))}
html.is-touch .kbzone.kb-off{visibility:hidden}

.version{position:fixed;right:10px;bottom:8px;color:var(--version-text);font-size:11px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.divider{left:0;width:100%}}

/* ===== START SCREEN · shared design across all exercises (Design Police 2026-09-25) =====
   Same colours, button shape, press effect, table button and version mark in every exercise.
   Title fonts stay per group: Artikel+Pronomen / Verbformen / Präpositionen. */
:root{
  --start-btn-bg:#2a2a2d;
  --start-btn-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 14px rgba(0,0,0,.14);
  --start-line:rgba(255,255,255,.10);
  --start-table-text:#c8c7c4;
  --start-version:rgba(255,255,255,.24);
}
[data-theme="light"]{
  --start-btn-bg:#fff;
  --start-btn-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 14px rgba(0,0,0,.08);
  --start-line:rgba(0,0,0,.10);
  --start-table-text:#55565b;
  --start-version:rgba(36,36,38,.34);
}
#start .options{display:flex;flex-wrap:nowrap;justify-content:center;gap:12px}
#start .size{flex:0 0 96px;width:96px;min-width:0;height:58px;margin:0;padding:0;border:0;border-radius:16px;
  background:var(--start-btn-bg);color:var(--text);box-shadow:var(--start-btn-shadow);font:650 21px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;justify-content:center;transform:none;cursor:pointer;
  transition:transform .12s ease,filter .12s ease}
#start .size:hover{transform:none;background:var(--start-btn-bg);box-shadow:var(--start-btn-shadow)}
#start .size:active{transform:scale(.97);filter:brightness(.94)}
.version-mark{position:fixed;left:0;right:0;top:auto;bottom:calc(env(safe-area-inset-bottom) + 28px);margin:0;padding:0;
  text-align:center;font:400 11px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:.04em;color:var(--start-version);pointer-events:none;z-index:5}

/* ===== SUMMARY SCREEN · shared buttons across all exercises (Design Police 2026-09-25) =====
   "Noch eine Runde" (quiet, outlined) + "Zur Startseite" (main). Style taken from Ortspräpositionen. */
:root{
  --end-again-bg:transparent;
  --end-again-text:rgba(242,240,237,.55);
  --end-again-line:rgba(255,255,255,.10);
  --end-main-bg:#ece6dc;   /* cream: same as the Prüfen/Weiter buttons */
  --end-main-text:#1b1b1d;
}
[data-theme="light"]{
  --end-again-bg:transparent;
  --end-again-text:rgba(36,36,38,.55);
  --end-again-line:rgba(0,0,0,.10);
  --end-main-bg:#242426;
  --end-main-text:#f6f4f1;
}
#done .done-actions{width:min(100%,360px);margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:10px}
#done #home,#done #homeBack{width:100%;height:56px;margin:0;padding:0;border:0;border-radius:17px;font:650 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transform:none;transition:transform .12s ease,filter .12s ease}
#done #home{background:var(--end-again-bg);color:var(--end-again-text);border:1px solid var(--end-again-line)}
#done #homeBack{background:var(--end-main-bg);color:var(--end-main-text)}
#done #home:active,#done #homeBack:active{transform:scale(.97);filter:brightness(.94)}

/* ===== TOP BAR · shared design across all exercises (Design Police 2026-09-25) =====
   Title and counter in the palette grey, 3px progress line: hairline track + grey fill.
   Green stays reserved for "correct". */
:root{--bar-track:rgba(255,255,255,.10)}
[data-theme="light"]{--bar-track:rgba(0,0,0,.10)}
#game .top-title{color:var(--muted)}
#game .top:after{background:var(--bar-track)}
#game .progress i{background:var(--muted)}
/* Top bar position = Partizip II (reference): title and counter centred 33.5px from the top, line at 55px, 18px side margins */
#game.screen{padding-top:15px}
#game .top{margin-left:-14px;margin-right:-14px;padding-bottom:14px}

/* Question text sizes (Design Police): sentences 28px on phones */
@media(max-width:699px){.sentence{font-size:28px}}
/* Phone layout: question at a fixed height (same as Ortspräpositionen) instead of centred;
   the keyboard is lifted by the same amount (see placeQuestion), so all distances stay as before.
   The feedback still hangs below the question, so nothing moves when the answer appears. */
html.is-touch:not(.vmp-measure) .qzone{align-items:flex-start}
html.is-touch:not(.vmp-measure) .anchor{padding-top:var(--vmp-question-top,0px)}
html.is-touch:not(.vmp-measure) .kbzone{padding-bottom:calc(max(4px,calc(33.5vh - 150px)) + var(--vmp-lift,0px));padding-bottom:calc(max(4px,calc(33.5dvh - 150px)) + var(--vmp-lift,0px))}

/* ===== TYPING CURSOR · same blinking cursor as the typing fields in the other exercises (Design Police 2026-09-25) ===== */
@keyframes gapCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
/* drawn on the blank itself (the invisible text field inside it has no height while empty) */
.gap.typing:has(.gap-input:placeholder-shown)::after{content:"";position:absolute;left:50%;bottom:.14em;width:2px;height:1em;margin-left:-1px;
  background:var(--text);animation:gapCaret 1.1s steps(1) infinite;pointer-events:none}
.gap-input:placeholder-shown{caret-color:transparent}
.gap-input::placeholder{color:transparent}
@media(prefers-reduced-motion:reduce){.gap.typing:has(.gap-input:placeholder-shown)::after{animation:none}}

/* ===== WEITER · the quiet button, shared by all exercises (Design Police 2026-09-25) =====
   Blueprint: Partizip II. It doesn't urge you on; you read the answer first.
   Same surface + outline as the typing field; full text colour; as wide as the answer area. */
:root{--quiet-bg:rgba(255,255,255,.03);--quiet-line:rgba(255,255,255,.10)}
[data-theme="light"]{--quiet-bg:#fff;--quiet-line:rgba(0,0,0,.10)}
#continue{height:56px;border:1px solid var(--quiet-line);border-radius:17px;background:var(--quiet-bg);color:var(--text);
  font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;box-shadow:none;cursor:pointer;transition:transform .12s ease,filter .12s ease;padding:0;}
#continue:hover{background:var(--quiet-bg);box-shadow:none;transform:none}
#continue:active{transform:scale(.97);filter:brightness(.94)}

/* Version number only on the start and summary screens, not during the exercise (Design Police 2026-09-25) */
body:has(#game:not(.hidden)) .version-mark{display:none}

/* ===== PRÜFEN (desktop) · the one strong button in the game: main-button colours from the palette,
   same shape as "Zur Startseite" (Design Police 2026-09-25) ===== */
#check{height:56px;border:0;border-radius:17px;background:var(--end-main-bg);color:var(--end-main-text);
  font:650 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;box-shadow:none;cursor:pointer;transition:transform .12s ease,filter .12s ease}
#check:hover{background:var(--end-main-bg);transform:none;box-shadow:none}
#check:active{transform:scale(.97);filter:brightness(.94)}
/* ===== START SCREEN · description "Worum geht's?" (2026-09-26, same as the other exercises) =====
   Width = the 10/20/30 row (3 × 96px + 2 × 12px = 312px).
   Headline German, text in the user's language (Settings → Translations), fixed above the Home button / version mark.
   Palette grey text (the darkest text colour) so it blends in and doesn't compete with the buttons. */
.start-about{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);margin:0 auto;padding:0;width:312px;max-width:calc(100% - 36px);text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;z-index:4}
.start-about h2{margin:0 0 5px;font-size:13px;font-weight:650;line-height:1.3;color:var(--muted);letter-spacing:0}
.start-about .about-de{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
body:has(#start.hidden) .start-about{display:none}
</style>
</head>
<body><main class="app">

<section id="start" class="screen center">
  <h1 class="start-title">Verben mit Präpositionen</h1>
  <div class="start-sub">Wie viele Übungen?</div>
  <p class="muted">Schreib die Präposition, dann wähle den Kasus.</p>
  <div class="options"><button class="size" data-n="10">10</button><button class="size" data-n="20">20</button><button class="size" data-n="30">30</button></div>
</section>

<section id="game" class="screen hidden">
  <div class="top"><div><div class="top-title">Verben mit Präpositionen</div><div class="progress"><i id="bar"></i></div></div><div class="counter" id="counter">1 / 10</div></div>

  <div class="exercise" id="exercise">
   <div class="qzone"><div class="anchor">
    <div class="prompt" id="prompt">
      <div class="context" id="meaning"></div>
      <div class="sentence" id="sentence"><span id="verb"></span> <span class="gap typing" id="gap"></span></div>
      <!-- One slot under the verb: holds the question "Welcher Kasus?" during step 2,
           then "+ Kasus" after the answer (the buttons sit under the line). Its height is reserved from the start,
           so the line below never moves. -->
      <div class="above-slot">
        <div class="case-line off" id="caseLine" aria-hidden="true">&nbsp;</div>
        <div class="case-question off" id="caseQuestion">Welcher Kasus?</div>
      </div>
    </div>
    <button class="check" id="check">Prüfen</button>

    <div id="feedback" class="feedback hidden">
      <div class="glow l"></div><div class="glow r"></div>
      <div class="divider"><i class="sl"></i><i class="sr"></i><i class="line"></i></div>
      <div id="prepFeedback">
        <div class="given" id="given"></div>
        <div class="case-step hidden" id="caseStep">
          <div class="choices" id="choices"></div>
        </div>
      </div>
      <div id="finalFeedback" class="hidden">
        <div class="chips" id="chips"></div>
        <div class="example" id="example"></div>
        <div class="example-tr" id="exampleTr"></div>
        <button class="continue" id="continue">Weiter</button>
      </div>
    </div>
   </div></div>
    <div class="kbzone" id="kbZone"><div id="keyboardMount"></div></div>
  </div>
</section>

<section id="done" class="screen center hidden">
  <h1 class="done-title">Fertig.</h1>
  <div class="done-score" id="score">0 / 10</div>
  <div class="done-score-label">komplett richtig</div>
  <div class="done-parts" id="parts"></div>
  <div class="weak hidden" id="weak"></div>
  <div class="done-note">Was schwierig war, kommt öfter wieder.</div>
  <div class="done-actions">
    <button class="btn" id="home">Noch eine Runde</button>
    <button class="btn" id="homeBack">Zur Startseite</button>
  </div>
</section>

<div class="start-about" id="startAbout">
  <h2>Worum geht's?</h2>
  <p class="about-de" id="aboutText"></p>
</div>
<div class="version-mark">v3.12</div>
</main>

<script src="../../components/deutsch-translation-v1.js?v=2"></script>
<script>
// Start-screen description: shown in the user's language so it is surely understood (like a hint).
const START_ABOUT={text:{
  en:"Some verbs always come with the same preposition. A little practice helps you remember which one - and the case after it.",
  ru:"Некоторые глаголы всегда идут с определённым предлогом. Немного практики - и легче запомнить, с каким именно и какой после него падеж."}};
document.getElementById("aboutText").textContent=getTranslation(START_ABOUT,"text");
</script>
<script src="verben_mit_praepositionen.js?v=4"></script>
<script src="../../components/deutsch-progress-v1.js"></script>
<script>
const DATA = window.VERBEN_MIT_PRAEPOSITIONEN || [];
const $ = id => document.getElementById(id);

function isTouchDevice(){
  return navigator.maxTouchPoints > 0 || window.matchMedia("(pointer: coarse)").matches;
}
const IS_TOUCH = isTouchDevice();
document.documentElement.classList.toggle("is-touch", IS_TOUCH);

// ===== CASE BUTTONS =====
// Built from the cases that occur in the database (currently Akkusativ + Dativ).
// Entries whose case has no button (arbeiten als + Nominativ) skip step 2.
const CASE_ORDER = ["Akkusativ","Dativ","Genitiv"];
const CHOICE_CASES = CASE_ORDER.filter(c => DATA.some(x => x.case === c));
const asksCase = x => CHOICE_CASES.includes(x.case);

// ===== STATS (weak spots) =====
// Preposition and case tracked separately per entry: "<id>|prep", "<id>|case".
const STATS_STORE = "verbenPraepStatsV1";
const SESSION_WINDOW = 5, MIN_ATTEMPTS = 2, ERROR_THRESHOLD = .4;
let statsStore = {sessions:[]};
try{ statsStore = JSON.parse(localStorage.getItem(STATS_STORE) || '{"sessions":[]}'); }catch(e){ statsStore = {sessions:[]}; }
if(!Array.isArray(statsStore.sessions)) statsStore.sessions = [];
function saveStats(){ try{ localStorage.setItem(STATS_STORE, JSON.stringify(statsStore)); }catch(e){} }
function currentStats(){
  const map = {};
  statsStore.sessions.forEach((session, s) => {
    const weight = s + 1;
    for(const [key, v] of Object.entries(session.answers || {})){
      if(!map[key]) map[key] = {wc:0, ww:0, attempts:0};
      map[key].wc += (v.correct || 0) * weight;
      map[key].ww += (v.wrong || 0) * weight;
      map[key].attempts += (v.correct || 0) + (v.wrong || 0);
    }
  });
  for(const v of Object.values(map)){
    const total = v.wc + v.ww;
    v.errorRate = total ? v.ww / total : 0;
    v.weak = v.attempts >= MIN_ATTEMPTS && v.errorRate >= ERROR_THRESHOLD;
  }
  return map;
}

// ===== DIFFICULTY per verb (Documentation/PROGRESS_TRACKER.md) =====
// Common scale 1–4: wrong +1, right −0.5. A verb counts as right only if preposition AND case are right.
// Stored inside the same key (verbenPraepStatsV1 → .difficulty), so Backup already covers it.
// The per-part session stats above stay — they drive the "Needs more practice" list at the end.
// Format marker "__format": 2. Old data has none → starting scores are seeded ONCE from the
// session stats: 1 + error rate × 3, rounded to 0.5 (never missed → 1, always missed → 4).
const DIFFICULTY_FORMAT = 2;
if(statsStore.__format !== DIFFICULTY_FORMAT || !statsStore.difficulty || typeof statsStore.difficulty !== "object"){
  const stats = currentStats(), seeded = {};
  DATA.forEach(x => {
    const p = stats[x.id + "|prep"], c = stats[x.id + "|case"];
    if(!p && !c) return;
    const err = Math.max(p?.errorRate || 0, c?.errorRate || 0);
    seeded[x.id] = Math.min(4, Math.max(1, Math.round((1 + err * 3) * 2) / 2));
  });
  statsStore.difficulty = seeded;
  statsStore.__format = DIFFICULTY_FORMAT;
  saveStats();
}
function weightFor(x){ return Math.max(1, Number(statsStore.difficulty[x.id] || 1)); }
function updateDifficulty(x, ok){
  let d = weightFor(x);
  d = ok ? Math.max(1, d - 0.5) : Math.min(4, d + 1);
  statsStore.difficulty[x.id] = Number(d.toFixed(2));
  saveStats();
}

// ===== PROGRESS (one item per verb) =====
// Guarded: the exercise keeps working if the helper is missing.
const PROGRESS_ID = "verbenMitPraepositionen";
const hasProgress = () => typeof window.DeutschProgress === "object";
if(hasProgress()) DeutschProgress.init(PROGRESS_ID, DATA.map(x => ({key:x.id, label:`${x.verb} ${x.preposition} + ${x.case}`})));

// ===== DAILY STATS (Home tile) =====
const DAILY_STATS_KEY = "deutschDailyStatsV1";
function localDayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function recordDaily(correct){
  try{
    const today = localDayKey();
    let data = JSON.parse(localStorage.getItem(DAILY_STATS_KEY) || "{}");
    if(data.date !== today) data = {date:today};
    if(!data.verbenMitPraepositionen) data.verbenMitPraepositionen = {answers:0, correct:0};
    data.verbenMitPraepositionen.answers++;
    if(correct) data.verbenMitPraepositionen.correct++;
    localStorage.setItem(DAILY_STATS_KEY, JSON.stringify(data));
  }catch(e){}
}

// ===== SESSION =====
let session = [], index = 0, phase = "type", typed = "";
let prepOK = false, caseOK = null, chosenCase = null, caseShownAt = 0;
let score = {full:0, prep:0, cas:0, casTotal:0}, sessionAnswers = {}, liveSession = null;

function buildSession(size){
  // Weighted sampling without replacement by the verb's difficulty score (like Artikel).
  return DATA.map(x => {
    return {x, k: -Math.log(Math.max(Math.random(), 1e-12)) / weightFor(x)};
  }).sort((a, b) => a.k - b.k).slice(0, Math.min(size, DATA.length)).map(o => o.x);
}
// Stats are saved after every answer, so leaving mid-session keeps them.
// The session is added to the history on its first answer (empty ones never are).
function mark(key, ok){
  const v = sessionAnswers[key] || {correct:0, wrong:0};
  if(ok) v.correct++; else v.wrong++;
  sessionAnswers[key] = v;
  if(!liveSession){
    liveSession = {date:localDayKey(), answers:sessionAnswers};
    statsStore.sessions.push(liveSession);
    if(statsStore.sessions.length > SESSION_WINDOW) statsStore.sessions = statsStore.sessions.slice(-SESSION_WINDOW);
  }
  saveStats();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.trim().toLocaleLowerCase("de-DE").replace(/[.,!?;:]/g, "").replace(/\s+/g, " ");
function prepMatches(input, target){
  const a = norm(input), b = norm(target);
  return a === b || a.replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü") === b;
}

function start(size){
  session = buildSession(size); index = 0;
  score = {full:0, prep:0, cas:0, casTotal:0}; sessionAnswers = {}; liveSession = null;
  $("start").classList.add("hidden"); $("done").classList.add("hidden"); $("game").classList.remove("hidden");
  render();
}

function render(){
  const x = session[index];
  phase = "type"; typed = ""; prepOK = false; caseOK = null; chosenCase = null;
  $("counter").textContent = (index + 1) + " / " + session.length;
  $("bar").style.width = (index / session.length * 100) + "%";
  $("verb").textContent = x.verb;
  $("meaning").textContent = getTranslation(x, "meaning");
  $("gap").className = "gap typing";
  $("gap").innerHTML = '<span class="gap-mirror" id="gapMirror"></span>'
    + '<input class="gap-input" id="gapInput" type="text" placeholder=" " autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="20" aria-label="Präposition">';
  const input = $("gapInput");
  if(IS_TOUCH){
    // Phones use the in-app German keyboard; never open the system keyboard.
    input.readOnly = true; input.tabIndex = -1; input.setAttribute("inputmode","none");
  }else{
    input.addEventListener("input", () => { typed = input.value; paintGap(); });
    input.addEventListener("keydown", e => {
      if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); e.stopPropagation(); submitPrep(); }
    });
  }
  // Space for "+ Kasus" is always reserved so the meaning and the line never move.
  $("caseLine").className = "case-line off";
  $("caseLine").innerHTML = "&nbsp;";
  $("caseLine").setAttribute("aria-hidden","true");
  $("caseQuestion").classList.add("off");
  $("caseStep").classList.add("hidden");
  paintGap();
  $("check").classList.remove("hidden");
  $("feedback").className = "feedback hidden";
  $("finalFeedback").classList.add("hidden");
  $("prepFeedback").classList.remove("hidden");
  if(window.deutschKeyboardReady) $("keyboard").classList.add("show");
  $("kbZone").classList.remove("kb-off");
  fitSentence();
  placeQuestion();
  focusGap();
}

// The hidden mirror gives the gap its width; the text field sits on top of it.
function paintGap(){
  const input = $("gapInput"), mirror = $("gapMirror");
  if(!input) return;
  if(input.value !== typed) input.value = typed;
  mirror.textContent = typed;
  fitSentence();
}
function focusGap(){
  if(IS_TOUCH || phase !== "type") return;
  const input = $("gapInput");
  if(input && document.activeElement !== input) input.focus({preventScroll:true});
}

// Keep verb + gap on one line: shrink only when the line is wider than the screen.
function fitSentence(){
  const el = $("sentence");
  el.style.fontSize = "";
  const available = $("prompt").clientWidth;
  const width = el.scrollWidth;
  if(width > available && available > 0){
    el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * available / width * 0.97) + "px";
  }
}
window.addEventListener("resize", () => { if(!$("game").classList.contains("hidden")) fitSentence(); });

// Step 1 — preposition. Glow reflects the preposition.
function submitPrep(){
  if(phase !== "type" || !typed.trim()) return;
  const x = session[index];
  prepOK = prepMatches(typed, x.preposition);
  mark(x.id + "|prep", prepOK);
  if(prepOK) score.prep++;

  $("gap").className = "gap filled";
  $("gap").textContent = x.preposition;
  fitSentence();
  $("check").classList.add("hidden");
  // Phone: keyboard keeps its space (so the question doesn't move), it just hides.
  if(IS_TOUCH) $("kbZone").classList.add("kb-off");
  else if(window.deutschKeyboardReady) $("keyboard").classList.remove("show");

  $("given").innerHTML = prepOK
    ? `<span class="good">${esc(x.preposition)}</span>`
    : `<span class="bad struck">${esc(typed.trim())}</span><span class="good">→ ${esc(x.preposition)}</span>`;
  // Step 1: the whole line + glow shows the preposition result.
  $("feedback").className = "feedback" + (prepOK ? "" : " wrong-l wrong-r");

  if(asksCase(x)){
    phase = "case";
    caseShownAt = performance.now();
    $("caseQuestion").classList.remove("off");
    $("caseStep").classList.remove("hidden");
  }else{
    showAnswer();
  }
}

// Phone: the question starts at the same height as in Ortspräpositionen (69px below the top bar's line).
// The keyboard is lifted by exactly as much as the question was lifted, so the distances between the question,
// the keyboard and the case buttons stay what they were when the question was centred.
// Measured once per round (again on resize / when the keyboard has loaded), so nothing moves between questions.
let vmpPlaced = false;
function placeQuestion(force){
  if(!IS_TOUCH || (vmpPlaced && !force)) return;
  const root = document.documentElement;
  root.classList.add("vmp-measure");                        // original layout: question centred, keyboard low
  const centredTop = document.querySelector(".anchor").getBoundingClientRect().top;
  root.classList.remove("vmp-measure");
  const target = document.querySelector("#game .top").getBoundingClientRect().bottom + 69;
  const zoneTop = document.querySelector(".qzone").getBoundingClientRect().top;
  root.style.setProperty("--vmp-question-top", Math.max(0, Math.round(target - zoneTop)) + "px");
  root.style.setProperty("--vmp-lift", Math.max(0, Math.round(centredTop - target)) + "px");
  vmpPlaced = true;
}
window.addEventListener("resize", () => { if(!$("game").classList.contains("hidden")) placeQuestion(true); });

// Step 2 — case (asked for the CORRECT preposition).
function chooseCase(c){
  if(phase !== "case") return;
  const x = session[index];
  chosenCase = c;
  caseOK = c === x.case;
  mark(x.id + "|case", caseOK);
  score.casTotal++;
  if(caseOK) score.cas++;
  showAnswer();
}

function chip(ok, label, wrongValue){
  return `<span class="chip ${ok ? "ok" : "no"}"><span class="mark">${ok ? "✓" : "✗"}</span>${label}`
    + (!ok && wrongValue ? ` <span class="struck">${esc(wrongValue)}</span>` : "") + `</span>`;
}

// Final answer. Left half = preposition, right half = case.
function showAnswer(){
  phase = "answer";
  const x = session[index];
  const full = prepOK && caseOK !== false;
  if(full) score.full++;
  recordDaily(full);
  updateDifficulty(x, full);
  if(hasProgress()) DeutschProgress.record(PROGRESS_ID, x.id, full);

  // Step 2: the right half fades to the case result (left half keeps the preposition).
  if(caseOK !== null) $("feedback").classList.toggle("wrong-r", !caseOK);
  $("caseLine").textContent = "+ " + x.case;
  $("caseLine").removeAttribute("aria-hidden");
  $("caseQuestion").classList.add("off");
  $("caseLine").classList.remove("off");

  let chips = chip(prepOK, "Präposition", typed.trim());
  if(caseOK !== null) chips += chip(caseOK, "Kasus", chosenCase);
  $("chips").innerHTML = chips;
  $("example").textContent = x.example || "";
  $("exampleTr").textContent = getTranslation(x, "exampleTranslation");
  $("continue").textContent = index === session.length - 1 ? "Fertig" : "Weiter";

  $("prepFeedback").classList.add("hidden");
  $("finalFeedback").classList.remove("hidden");
  $("bar").style.width = ((index + 1) / session.length * 100) + "%";
}

function next(){
  if(phase !== "answer") return;
  if(index >= session.length - 1){ finish(); return; }
  index++; render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function weakLabel(key){
  const [id, part] = key.split("|");
  const x = DATA.find(e => e.id === id);
  if(!x) return null;
  return part === "prep" ? `${x.verb} → ${x.preposition}` : `${x.verb} ${x.preposition} → ${x.case}`;
}

function finish(){
  $("game").classList.add("hidden"); $("done").classList.remove("hidden");
  $("score").textContent = score.full + " / " + session.length;
  let parts = `<span class="done-part">Präposition <b>${score.prep} / ${session.length}</b></span>`;
  if(score.casTotal) parts += `<span class="done-part">Kasus <b>${score.cas} / ${score.casTotal}</b></span>`;
  $("parts").innerHTML = parts;

  const weak = Object.entries(currentStats())
    .filter(([, v]) => v.weak)
    .sort((a, b) => b[1].errorRate - a[1].errorRate)
    .map(([k]) => weakLabel(k)).filter(Boolean).slice(0, 3);
  if(weak.length){
    $("weak").innerHTML = "<b>Noch üben</b><br>" + weak.map(esc).join("<br>");
    $("weak").classList.remove("hidden");
  }else $("weak").classList.add("hidden");
  window.scrollTo({top:0, behavior:"auto"});
}

// ===== CASE BUTTONS =====
$("choices").style.setProperty("--case-count", CHOICE_CASES.length);
$("choices").innerHTML = CHOICE_CASES.map(c => `<button class="case-choice" data-case="${c}">${c}</button>`).join("");
$("choices").addEventListener("click", e => {
  const b = e.target.closest("button[data-case]");
  // Safety guard: ignore taps in the first moment after the buttons appear
  // (a tap on the keyboard's ✓ must never also pick a case).
  if(b && performance.now() - caseShownAt > 450) chooseCase(b.dataset.case);
});

// ===== INPUT =====
function typeKey(k){
  if(phase !== "type") return;
  if(k === "BACK"){ typed = typed.slice(0, -1); paintGap(); return; }
  if(k === "OK"){ submitPrep(); return; }
  if(k === "SPACE"){ if(typed.length && !typed.endsWith(" ")) typed += " "; paintGap(); return; }
  if(typed.length < 20){ typed += k; paintGap(); }
}
document.addEventListener("keydown", e => {
  if($("game").classList.contains("hidden") || e.metaKey || e.ctrlKey || e.altKey) return;
  if(phase === "answer"){
    if(e.key === "Enter"){ e.preventDefault(); next(); }
    return;
  }
  if(phase === "case"){
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= CHOICE_CASES.length){ chooseCase(CHOICE_CASES[n - 1]); return; }
    const byLetter = CHOICE_CASES.find(c => c[0].toLowerCase() === e.key.toLowerCase());
    if(byLetter) chooseCase(byLetter);
    return;
  }
  // Typing phase on a computer: the text field handles letters, Backspace and
  // the accent menu itself. If focus got lost, put it back before the key lands.
  if(!IS_TOUCH && e.target !== $("gapInput")) focusGap();
});
// Clicking anywhere on the page during typing returns focus to the gap.
document.addEventListener("mousedown", e => {
  if(phase !== "type" || IS_TOUCH || e.target.closest("button")) return;
  if(e.target !== $("gapInput")){ e.preventDefault(); focusGap(); }
});
document.addEventListener("deutsch-keyboard-input", e => typeKey(e.detail?.key || ""));

async function loadKeyboardComponent(){
  const mount = $("keyboardMount");
  const r = await fetch("../../components/deutsch-keyboard-v2.60.html");
  if(!r.ok) throw new Error("Keyboard component failed to load");
  const tpl = document.createElement("template");
  tpl.innerHTML = await r.text();
  const scripts = [];
  tpl.content.querySelectorAll("script").forEach(s => { scripts.push(s.textContent); s.remove(); });
  mount.appendChild(tpl.content);
  for(const code of scripts){ const s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); }
  window.deutschKeyboardReady = true;
  if(!$("game").classList.contains("hidden")) placeQuestion(true);
  if(phase === "type") $("keyboard").classList.add("show");
}

// ===== BUTTONS =====
document.querySelectorAll(".size").forEach(b => b.addEventListener("click", () => start(Number(b.dataset.n))));
$("check").addEventListener("click", submitPrep);
$("continue").addEventListener("click", next);
$("home").addEventListener("click", () => { $("done").classList.add("hidden"); $("start").classList.remove("hidden"); });
function goBackToHome(){
  try{
    if(window.parent && window.parent !== window){
      if(typeof window.parent.closeApp === "function"){ window.parent.closeApp(); return; }
      const parentDoc = window.parent.document;
      const shell = parentDoc.getElementById("appShell");
      const frame = parentDoc.getElementById("appFrame");
      if(shell && frame){
        shell.classList.remove("open");
        shell.setAttribute("aria-hidden","true");
        parentDoc.documentElement.classList.remove("app-open");
        frame.src = "about:blank";
        return;
      }
    }
  }catch(e){}
  window.parent.postMessage({type:"deutsch:home"}, "*");
}
$("homeBack").addEventListener("click", goBackToHome);

loadKeyboardComponent().catch(e => console.error(e));
</script>
</body>
</html>
