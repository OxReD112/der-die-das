<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Modalverben.</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Modalverben" />
    <link rel="stylesheet" href="../../components/deutsch-base-v1.css?v=7" />
    <link rel="stylesheet" href="../../components/deutsch-ui-v1.css?v=11" />
    <link rel="stylesheet" href="../../components/deutsch-fonts-v1.css?v=1" />
    <script src="../../components/deutsch-fonts-v1.js?v=1"></script>
    <link rel="stylesheet" href="modalverben.css?v=42" />
  </head>
  <body>
    <div id="formsModal" class="forms-modal ui-window" aria-hidden="true">
      <div class="forms-modal-card ui-window-card" role="dialog" aria-modal="true" aria-labelledby="formsModalTitle">
        <div class="forms-modal-head ui-window-head">
          <h2 class="ui-window-title" id="formsModalTitle">Modalverben · Formen</h2>
          <button class="forms-close ui-close" id="formsClose" type="button" aria-label="Schließen"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13"/></svg></button>
        </div>
        <div id="formsModalBody" class="ui-window-body"></div>
      </div>
    </div>
    <main class="app">
      <section id="start">
        <h1 class="title">Modalverben.</h1>
        <p class="subtitle">Wie viele Sätze?</p>
        <div class="choices">
          <button class="choice ui-size" data-size="10">10</button>
          <button class="choice ui-size" data-size="20">20</button>
          <button class="choice ui-size" data-size="30">30</button>
        </div>
        <button class="forms-table-btn ui-spick" type="button" data-forms-table="full">Spickzettel</button>
      </section>

      <section id="study" class="hidden">
        <div class="top"><span class="brand">Modalverben.</span><span id="count" class="ui-counter"></span></div>
        <div class="progress ui-progress"><i id="bar"></i></div>
        <section class="card">
          <div id="verb"></div>
          <div class="intention" id="intention"></div>
          <div class="sentence" id="sentence"></div>
          <div class="translation" id="translation"></div>
          <div class="answer-area" id="answer-area">
            <input
              id="answer"
              placeholder=" "
              aria-label="Fehlende Form"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="done"
            />
            <button class="ui-main" id="check">Prüfen</button>
          </div>
          <div class="result" id="result">
            <div class="state" id="state"></div>
            <div class="result-body">
              <div class="answer-feedback" id="answerFeedback" hidden></div>
              <!-- 03.11.2026 (Alena): the form is always shown — tense · person above the two verbs, the contrast
                   with the neighbouring form below; the meaning line (it mostly repeated the translation) and
                   „Mehr zur Form ›“ are gone -->
              <div class="form-kind" id="formKind"></div>
              <div class="form-line" id="formLine"></div>
              <div class="meaning-contrast" id="meaningContrast"></div>
            </div>
          </div>
          <button class="ui-quiet" id="next">Weiter</button>
        </section>
        <div id="keyboardMount"></div>
        <div class="in-session-forms">
          <button class="forms-table-btn ui-spick" type="button" id="roundTableBtn" data-forms-table="verb" disabled>
            Spickzettel
          </button>
        </div>
      </section>

      <section id="finish" class="hidden">
        <h2>Fertig.</h2>
        <div id="finalScore" class="final-score"></div>
        <p id="summary"></p>
        <div class="finish-actions">
          <button class="ui-quiet" id="playAgain">Noch eine Runde</button>
          <button class="ui-main" id="homeBack">Zur Startseite</button>
        </div>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>
      <div class="version-mark" aria-hidden="true">v36</div>
    </main>

    <script src="../../components/deutsch-translation-v1.js?v=2"></script>
    <script src="special_verbs.js?v=14"></script>
    <script src="answer-rules.js?v=2"></script>
    <script src="../../components/deutsch-progress-v1.js"></script>
    <script src="../../components/deutsch-end-v1.js?v=1"></script>
    <script src="../../components/deutsch-bottom-v1.js?v=2"></script>
    <script src="../../components/deutsch-window-v1.js?v=3"></script>
    <script src="modalverben.js?v=36"></script>
    <script src="../../components/deutsch-wide-v1.js?v=6"></script>
</body>
</html>
