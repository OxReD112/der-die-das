<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wortschatz</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="../components/deutsch-fonts-v1.css?v=1" />
    <script src="../components/deutsch-fonts-v1.js?v=1"></script>
    <link rel="stylesheet" href="../components/deutsch-ui-v1.css?v=15" />
    <link rel="stylesheet" href="wortschatz.css?v=46" />
    <link rel="stylesheet" href="collection-window.css?v=20" />
  </head>
  <body>
    <main class="app">
      <header>
        <div class="top">
          <span class="brand">Wortschatz.</span>
          <span id="counter"></span>
        </div>
        <div class="progress"><div id="bar"></div></div>
      </header>
      <section id="start" aria-labelledby="startTitle">
        <h1 class="title" id="startTitle">Wortschatz.</h1>
        <div class="startWords">
          <div class="startLabel">Deine Wörter</div>
          <button class="coll-line" id="collBtnStart" type="button"></button>
          <p class="collCount" id="collCountStart"></p>
          <p class="startNote" id="startNote"></p>
        </div>
        <div class="startActions">
          <button id="startBtn" type="button">Starten</button>
        </div>
      </section>
      <section id="choose" aria-labelledby="chooseTitle">
        <h1 class="title" id="chooseTitle">Wortschatz.</h1>
        <div class="startWords chooseSets">
          <div class="startLabel">Wortlisten</div>
          <div class="chooseSetList" id="chooseSets"></div>
        </div>
        <div class="startActions">
          <button class="chooseOwnBtn" id="chooseOwn" type="button">＋ Start with my own words</button>
        </div>
      </section>
      <section class="stage" id="study" style="display: none">
        <div id="question">
          <div class="topZone">
            <div class="sentence" id="sentence"></div>
            <div class="translation" id="translation"></div>
          </div>
          <div id="almostHint" aria-live="polite"></div>
          <input
            id="answerInput"
            class="inputbox"
            type="text"
            placeholder=" "
            aria-label="Fehlendes Wort"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            inputmode="none"
          />
          <div class="ghostRow">
            <button class="ghostEye" id="ghostEye" type="button" aria-label="Wort zeigen" title="Wort zeigen">
              <svg
                class="eyeClosed"
                viewBox="0 2 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.5 10.5s3.6 5 9.5 5 9.5-5 9.5-5" />
                <path d="M12 15.5v2.6M7.2 14.3l-1.4 2.2M16.8 14.3l1.4 2.2M3.9 12.3l-1.6 1.6M20.1 12.3l1.6 1.6" />
              </svg>
              <svg
                class="eyeOpen"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <button class="check" id="desktopCheck">Prüfen</button>
          <div id="keyboardMount"></div>
        </div>
        <div class="feedbackShell" id="feedbackShell">
          <div class="feedback" id="feedback">
            <div class="topZone answerTop" id="answerTop">
              <div class="answerSentence" id="answerSentence"></div>
              <div class="answerTranslation" id="answerTranslation"></div>
            </div>
            <div class="diffBlock" id="diffBlock">
              <div class="diffWord" id="typedDiff"></div>
              <div class="diffArrow"><img src="../components/icons/Arrow_Down.svg" alt="" aria-hidden="true" /></div>
              <div class="diffWord diffCorrect" id="correctDiff"></div>
            </div>
            <button class="speakTop" id="speakTop" aria-label="Satz anhören">
              <svg class="speakTopIcon" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.3,14.5h-8.3l1.2-2.2h5.8l1.3,2.2Z"/><rect x="2.4" y="2" width="19.2" height="12.5" rx="1.6" ry="1.6"/><path d="M7.9,5.9h8.2c.9,0,1.6.7,1.6,1.6h0c0,.9-.7,1.6-1.6,1.6H7.9c-.9,0-1.6-.7-1.6-1.6h0c0-.9.7-1.6,1.6-1.6Z"/><path d="M7.9,5.9h0c.9,0,1.6.7,1.6,1.6h0c0,.9-.7,1.6-1.6,1.6h0c-.9,0-1.6-.7-1.6-1.6h0c0-.9.7-1.6,1.6-1.6Z"/><path d="M16.1,5.9h0c.9,0,1.6.7,1.6,1.6h0c0,.9-.7,1.6-1.6,1.6h0c-.9,0-1.6-.7-1.6-1.6h0c0-.9.7-1.6,1.6-1.6Z"/></svg>
            </button>
            <div class="detail">
              <div class="answerTargetRow"><div class="base" id="base"></div></div>
              <div class="meaning" id="meaning"></div>
              <div class="auch" id="auch"></div>
              <div class="grammar" id="grammar"></div>
            </div>
          </div>
          <button class="editCard" id="editCard" type="button" aria-label="Karte bearbeiten" title="Karte bearbeiten">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 16.5 15.8 4.7a2.8 2.8 0 0 1 4 4L8 20.5 3 21l1-4.5Z" />
              <path d="m13.8 6.7 4 4" />
            </svg>
          </button>
          <button class="continue" id="continue">Weiter</button>
        </div>
      </section>
      <!-- 04.11 (Alena): on phones the cassette (centre) and ✎ (right) stand in Home's bottom row — wortschatz.js placeTools() -->
      <div class="wsTools" id="wsTools"></div>
      <section class="done" id="done">
        <div class="doneInner" id="doneInner">
          <div class="doneTop">
            <h1>
              Fertig
              <br />
              für heute.
            </h1>
            <p>Komm morgen wieder.</p>
            <div class="doneScore" id="doneScore"></div>
          </div>
          <div class="doneWords">
            <div class="startLabel">Deine Wörter</div>
            <button class="coll-line" id="collBtnDone" type="button"></button>
            <p class="collCount" id="collCountDone"></p>
            <div class="allAdded" id="allAdded">Alle Wörter sind schon dabei.</div>
          </div>
          <div class="finish-actions">
            <button class="addWords" id="addWords">5 neue Wörter lernen</button>
            <button class="home-back" id="homeBack">Zur Startseite</button>
          </div>
        </div>
      </section>
      <div class="coll-modal ui-window" id="collModal" aria-hidden="true">
        <div class="coll-card ui-window-card" id="collCard" role="dialog" aria-modal="true" aria-labelledby="collTitle"></div>
      </div>
      <div class="start-about" id="startAbout">
        <h2>
          <button class="aboutToggle" id="aboutToggle" type="button" aria-expanded="false" aria-controls="aboutText">
            Worum geht's? <span class="ui-chev ui-chev-fold" aria-hidden="true"></span>
          </button>
        </h2>
        <p class="about-de" id="aboutText"></p>
      </div>
      <div class="version-mark" aria-hidden="true">v2.144</div>
      <button class="ws-settings-btn" id="wsSettings" type="button" aria-label="Lerntempo" data-pace="standard"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path class="pace-standard" d="M17.13 9.45 C17.38 8.74 18.45 6.12 19.29 5.98 C20.13 5.85 22.29 7.02 22.29 7.02 C22.29 7.02 20.18 10.94 17.26 13.85 C16.68 14.43 18.68 16.64 18.93 16.92 C18.50 17.14 18.20 17.23 17.99 17.35 C17.87 17.11 17.15 15.77 16.74 15.00 C16.69 14.90 17.37 13.82 17.29 13.85 C17.10 13.93 16.61 14.34 16.43 14.42 C16.04 14.58 14.09 15.30 13.63 15.48 C13.30 15.61 12.95 15.70 12.19 15.78 C12.04 15.80 13.42 15.79 13.36 15.95 C13.17 16.51 12.72 17.98 12.66 18.15 C12.22 18.03 12.08 18.02 11.63 17.92 C11.85 17.43 12.59 15.67 12.29 15.75 C12.00 15.83 5.66 15.58 4.99 15.38 C4.32 15.19 3.45 16.91 3.33 17.25 C2.91 17.14 2.87 17.12 2.43 16.88 C2.69 16.34 4.23 15.05 4.09 14.95 C3.85 14.79 3.24 14.31 3.00 13.43 C2.95 13.26 3.06 9.89 7.16 7.95 C10.06 6.59 13.73 7.39 14.56 8.08 C15.38 8.77 14.36 11.06 12.66 12.18 C11.08 13.23 8.48 15.18 2.29 13.32"/><path class="pace-intensiv" d="M19.75 10.79 C19.67 10.28 18.13 4.32 18.58 4.45 C19.14 4.62 19.61 10.77 19.85 10.89 C20.18 11.04 22.48 12.66 22.25 13.55 C21.99 14.57 20.30 15.02 19.62 15.25 C17.71 15.91 19.35 14.91 20.01 16.19 C20.63 17.40 21.77 19.35 21.58 19.49 C21.33 19.68 18.55 14.03 12.98 13.29 C8.03 12.63 2.47 16.67 1.58 15.15 C1.52 15.05 3.97 15.80 5.52 12.72 C6.07 11.63 6.39 10.24 6.48 10.15 C6.78 9.86 4.34 9.22 5.35 8.52 C6.35 7.82 6.37 10.09 6.72 9.92 C7.06 9.75 9.71 8.73 11.58 9.09 C13.96 9.53 17.14 11.16 17.55 11.45 C17.91 11.68 18.18 11.08 18.18 11.09 C18.18 11.09 14.89 5.46 15.28 5.22 C15.63 5.00 18.22 11.09 18.22 11.09 C18.22 11.09 19.13 10.66 19.75 10.79Z"/></svg></button>
    </main>
    <script src="../components/deutsch-day-v1.js?v=1"></script>

    <script src="collection-window-model.js?v=4"></script>
    <script src="collection-window.js?v=20261120-tick-1"></script>
    <script src="../components/deutsch-bottom-v1.js?v=2"></script>
