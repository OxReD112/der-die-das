<style>
*{box-sizing:border-box}
:root{--bg:#17181a;--cream:#eee7dc;--mint:#5bc8a4;--coral:#ff7770;--line:rgba(255,255,255,.08)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{height:100vh;height:100dvh;overflow:hidden;padding:0}
.app{position:fixed;inset:0;width:min(100%,480px);height:100vh;height:100dvh;margin:0 auto;padding:24px;padding-top:max(24px,calc(env(safe-area-inset-top) + 12px));padding-bottom:max(24px,env(safe-area-inset-bottom));overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#777;font-size:13px;position:sticky;top:0;z-index:50;background:var(--bg);padding:4px 0 10px;margin-bottom:0}
.brand{font-family:Georgia,serif;font-size:20px;color:#a5a19a;letter-spacing:-.5px}.mode{text-transform:uppercase;letter-spacing:.15em;font-size:9px;color:#686967;white-space:nowrap}.top #count{text-align:right}
.progress{height:3px;background:#292a2c;border-radius:9px;overflow:hidden;margin-bottom:32px;position:sticky;top:36px;z-index:50}
.progress>i{display:block;height:100%;background:#777;border-radius:9px}
.card{position:relative;text-align:center;padding:30px 20px 26px;isolation:isolate}
.card:before{content:"";position:absolute;z-index:-1;inset:-100px -30px;background:radial-gradient(ellipse at 50% 53%,rgba(91,200,164,.09),transparent 63%);opacity:.35}
.verb{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(58px,17vw,84px);letter-spacing:-3px;line-height:1;margin-bottom:13px}
.translation{color:#737473;font-size:16px;margin-bottom:44px}
.answer{width:100%;height:66px;border:1px solid #343638;border-radius:18px;background:#1c1d1f;color:var(--cream);font-family:Georgia,serif;font-size:29px;text-align:center;outline:none;padding:0 18px}
.answer:focus{border-color:rgba(91,200,164,.55);box-shadow:0 0 0 3px rgba(91,200,164,.08)}
.answer::placeholder{color:#48494a}
.check,.next{margin:20px auto 0}
.finish-actions button{
  width:100%;
  height:56px;
  border:0;
  border-radius:17px;
  font:inherit;
  font-size:16px;
  font-weight:650;

}

  color:rgba(238,231,220,.42);
}
.home-back{

}
.finish-actions button:active{transform:scale(.99)}
.check{margin-top:14px;width:100%;height:56px;border:0;border-radius:17px;background:#ece6dc;color:#1b1c1e;font-size:16px;font-weight:650}
.check:active,.next:active,.choice:active,.again:active{transform:scale(.99)}
.result{display:none;position:relative;margin-top:28px;border-top:1px solid var(--line);padding:30px 26px 20px;text-align:left;isolation:isolate}
.result.show{display:block}
.result:before{content:"";position:absolute;z-index:2;top:-1px;left:50%;width:0;height:2px;background:var(--line);animation:spread .42s ease-out forwards}
.result.good:before{background:var(--mint);box-shadow:0 0 18px rgba(91,200,164,.7)}

@keyframes resultGlowGood{from{box-shadow:0 -24px 65px -32px rgba(91,200,164,0)}to{box-shadow:0 -24px 65px -32px rgba(91,200,164,.8)}}
@keyframes resultGlowBad{from{box-shadow:0 -24px 70px -30px rgba(255,119,112,0)}to{box-shadow:0 -24px 70px -30px rgba(255,119,112,.85)}}

<body>
<main class="app" id="appRoot">
 <section id="start" class="start">
  <h1 class="title">Verbformen.</h1>
  <p class="subtitle">How many verbs?</p>
  <div class="choices">
   <button class="choice" data-size="10">10</button>

   <button class="choice" data-size="30">30</button>
  </div>
  <button class="pattern-table-btn" data-pattern-table>Pattern · Table</button>
 </section>

 <section id="study" class="hidden">
  <div class="top"><span class="brand">Verbformen.</span><span class="mode mode-top">Partizip II</span><span id="count"></span></div>
  <div class="progress"><i id="bar"></i></div>
  <section class="card">
   <div class="mode-inline">Partizip II</div>
   <div class="verb" id="verb"></div>
   <div class="translation" id="translation"></div>
   <input id="answer" class="answer" placeholder="…" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
   <button class="check" id="check">Check</button>
   <div class="result" id="result">
    <div class="result-head"><div class="state" id="state"></div><div class="vowel-pattern" id="vowelPattern"></div></div>
    <div class="forms" id="forms"></div>

   </div>
   <button class="next" id="next">Continue</button>
  </section>

 </section>

 <section id="finish" class="finish hidden">

  </div>
 </section>
 <div id="patternModal" class="pattern-modal" aria-hidden="true">
  <div class="pattern-modal-card" role="dialog" aria-modal="true" aria-labelledby="patternModalTitle">
   <div class="pattern-modal-head">
    <h2 id="patternModalTitle">Partizip II · Pattern families</h2>
    <button class="pattern-close" id="patternClose" aria-label="Close">×</button>
   </div>
   <div id="patternModalBody"></div>
  </div>
 </div>
</main>
<div class="version-tag">v41-clean · conservative cleanup + pattern table fix</div>

<script src="verbs.js"></script>
<script>
const STORAGE_KEY="verbformenDifficultyV1";
let difficulty={};
try{difficulty=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(e){difficulty={}}

const DAILY_STATS_KEY="deutschDailyStatsV1";
function localDateKey(){
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function recordVerbformenAnswer(){
 let stats={};
 try{stats=JSON.parse(localStorage.getItem(DAILY_STATS_KEY)||"{}")}catch(e){stats={}}
 const today=localDateKey();
 if(stats.date!==today) stats={date:today};
 if(typeof stats.verbformen==="object"){
   stats.verbformen.answers=Number(stats.verbformen.answers||0)+1;
 }else{
   stats.verbformen=Number(stats.verbformen||0)+1;
 }
 localStorage.setItem(DAILY_STATS_KEY,JSON.stringify(stats));
}

let deck=[],index=0,sessionSize=10,checked=false,correctCount=0;

const $=id=>document.getElementById(id);
const isMobileKeyboard = window.matchMedia("(max-width: 699px)").matches;
if(isMobileKeyboard){
  $("answer").readOnly=true;
  $("answer").setAttribute("inputmode","none");
  $("answer").setAttribute("readonly","");
  $("check").style.display="none";
}
const key=v=>v.infinitive.toLowerCase();

function saveDifficulty(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(difficulty));
}

function weightFor(v){
 return Math.max(1,Number(difficulty[key(v)]||1));
}

/* Weighted sampling WITHOUT replacement:
   difficult verbs are more likely to enter a session,
   but no verb can occur twice in that session. */
function buildDeck(size){
 const ranked=VERBS.map(v=>{
   const weight=weightFor(v);
   const randomKey=-Math.log(Math.max(Math.random(),1e-12))/weight;
   return {v,randomKey};
 }).sort((a,b)=>a.randomKey-b.randomKey);

 return ranked.slice(0,Math.min(size,VERBS.length)).map(x=>x.v);
}

function startSession(size){
 sessionSize=Math.min(size,VERBS.length);
 deck=buildDeck(sessionSize);
 index=0;correctCount=0;
 $("start").classList.add("hidden");
 $("finish").classList.add("hidden");
 $("study").classList.remove("hidden");
 render();
}

function syncKeyboardAndFocus(){
  if(window.deutschKeyboardReady && isMobileKeyboard && !checked){
    $("keyboard").classList.add("show");
  }
  if(!isMobileKeyboard){
    setTimeout(()=>{
      try{$("answer").focus({preventScroll:true})}catch(e){$("answer").focus()}
    },80);
  }
}

function render(){
 const v=deck[index];checked=false;
 $("verb").textContent=v.infinitive;
 $("translation").textContent=v.translation;
 $("answer").value="";
 $("result").className="result";
 $("vowelPattern").textContent="";
 $("next").className="next";
 $("check").style.display=isMobileKeyboard?"none":"";
 $("count").textContent=(index+1)+" / "+deck.length;
 $("bar").style.width=((index+1)/deck.length*100)+"%";
 $("answer").disabled=false;
 syncKeyboardAndFocus();
}

function updateDifficulty(v,correct){
 const k=key(v);
 let d=weightFor(v);
 if(correct){
   d=Math.max(1,d-0.5);
 }else{
   d=Math.min(6,d+1.5);
 }
 difficulty[k]=Number(d.toFixed(2));
 saveDifficulty();
}

function partizipPattern(pattern){
 const parts=String(pattern||"").split(/\s*-\s*/);
 if(parts.length>=3) return parts[0]+" → "+parts[2];
 return String(pattern||"");
}

function shouldShowPreterite(v){
 return v.infinitive==="sein" || v.infinitive==="haben" || v.modal===true;
}

function checkAnswer(){
 if(checked){next();return}
 const v=deck[index];
 const a=$("answer").value.trim().toLowerCase();
 if(!a)return;

 checked=true;
  recordVerbformenAnswer();
 const ok=a===v.participle.toLowerCase();
 if(ok)correctCount++;
 updateDifficulty(v,ok);

 $("result").className="result show "+(ok?"good":"bad");
 if(window.deutschKeyboardReady) $("keyboard").classList.remove("show");
 $("state").textContent=ok?"Correct":"Not quite";
 $("vowelPattern").textContent=partizipPattern(v.pattern);
 $("forms").textContent=shouldShowPreterite(v)
   ? v.infinitive+" → "+v.preterite+" → "+v.participle
   : v.infinitive+" → "+v.participle;
 $("meta").innerHTML="Perfekt: <b>"+v.auxiliary+" "+v.participle+"</b>";
 $("example").textContent=v.example;
 $("answer").disabled=true;
 $("answer").blur();
 $("check").style.display="none";
 $("next").className="next show";
}

function next(){
 if(index+1>=deck.length){finishSession();return}
 index++;
 render();
}

function finishSession(){
 $("study").classList.add("hidden");
 $("finish").classList.remove("hidden");
 $("finalScore").textContent=correctCount+" / "+deck.length;
 $("summary").textContent="Difficult verbs will have a better chance of returning in a future session.";
}

document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>startSession(Number(b.dataset.size))));
$("check").onclick=checkAnswer;
$("next").onclick=next;
$("again").onclick=()=>{
 $("finish").classList.add("hidden");
 $("start").classList.remove("hidden");
};
  function goBackToHome(){
  try{
    if(window.parent && window.parent !== window){
      if(typeof window.parent.closeApp === 'function'){
        window.parent.closeApp();
        return;
      }
      const parentDoc=window.parent.document;
      const shell=parentDoc.getElementById('appShell');
      const frame=parentDoc.getElementById('appFrame');
      if(shell && frame){
        shell.classList.remove('open');
        shell.setAttribute('aria-hidden','true');
        parentDoc.documentElement.classList.remove('app-open');
        frame.src='about:blank';
        return;
      }
    }
  }catch(e){}
  window.parent.postMessage({type:'deutsch:home'}, '*');
}
$("homeBack").onclick=goBackToHome;

document.addEventListener("keydown", e => {
 if(e.key === "Enter"){
   e.preventDefault();
   if(checked){next();return}
   if(document.activeElement === $("answer")) checkAnswer();
 }
 if(e.key === "Backspace" && window.innerWidth < 700){
   e.preventDefault();
   $("answer").value=$("answer").value.slice(0,-1);
 }
});

document.addEventListener("deutsch-keyboard-input", e => {
 const k=e.detail?.key||"";
 if($("study").classList.contains("hidden") || checked) return;
 if(k==="BACK"){
   $("answer").value=$("answer").value.slice(0,-1);
   return;
 }
 if(k==="OK"){
   checkAnswer();
   return;
 }
 if(k==="SPACE"){
   if($("answer").value.length && !$("answer").value.endsWith(" ")) $("answer").value+=" ";
   return;
 }
 if(k) $("answer").value+=k;
});

const patternReference=`<p class="pattern-intro">Infinitiv → Partizip II · possible vowel changes in this set</p><div class="pattern-grid">
<div class="pattern-cell"><div class="pattern-source">a</div><div class="pattern-options"><span class="arrow">→</span><span>a</span></div></div>

function openPatternTable(){
  $("patternModalBody").innerHTML=patternReference;
  const modal=$("patternModal");
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
}
function closePatternTable(){
  const modal=$("patternModal");
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
}
document.querySelectorAll("[data-pattern-table]").forEach(b=>b.addEventListener("click",openPatternTable));
$("patternClose").onclick=closePatternTable;
$("patternModal").onclick=e=>{if(e.target===$("patternModal"))closePatternTable()};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("patternModal").classList.contains("open")) closePatternTable();
});

async function loadKeyboardComponent(){
 const mount=$("keyboardMount");
 if(!mount) return false;
 const r=await fetch("../components/deutsch-keyboard-v2.60.html");
 if(!r.ok) throw new Error("Keyboard component failed to load");
 const text=await r.text();
 const tpl=document.createElement("template");
 tpl.innerHTML=text;
 const scripts=[];
 tpl.content.querySelectorAll("script").forEach(sc=>{scripts.push(sc.textContent);sc.remove()});
 mount.appendChild(tpl.content);
 for(const code of scripts){
   const sc=document.createElement("script");
   sc.textContent=code;
   document.body.appendChild(sc);
 }
 const kb=$("keyboard");
 window.deutschKeyboardReady=true;
 if(isMobileKeyboard && !$("study").classList.contains("hidden") && !checked) kb.classList.add("show");
 return true;
}

loadKeyboardComponent().catch(e=>console.error(e));
