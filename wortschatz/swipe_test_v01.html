.base{font-size:25px;margin-bottom:10px}.meaning{font-size:20px;color:#8d9996}.grammar{margin-top:14px;font-size:14px;color:#737a78}

.version{text-align:center;color:#4f4f53;font-size:10px;margin-top:18px}
@media(max-width:699px){.app{padding-left:16px;padding-right:16px}.stage{padding-top:22px}.feedbackShell{margin-top:0}.feedback{padding:38px 16px 20px}.feedback.revealed{padding:38px 16px 20px}.feedback .topZone{width:100%}.topZone{width:min(620px,100%)}.answerTop{text-align:center}.answerTop .answerSentence{display:inline}.sentence,.answerSentence{font-size:28px}.speakTop{width:1.25em}.topZone .sentence,.topZone .answerSentence{min-height:2.56em}.translation{font-size:17px;margin-top:28px}.answerTranslation{font-size:17px}.inputbox{height:60px;margin-top:28px}.resultSlot{min-height:60px;margin-top:28px}.check{display:none}.targetForm{margin-top:0}.diffBlock{margin-top:0;padding-bottom:0;font-size:28px}.answerTargetRow{margin-top:0}.speak{margin:0;width:42px;height:42px}.detail{padding-top:12px}.grammar{margin-top:26px}#keyboardMount{margin-top:18px;width:100%;min-height:0}#keyboardMount #keyboard{width:100%}.feedbackShell.revealed #keyboardMount{display:none}.feedbackShell:not(.revealed) .continue{display:none}}

@media(min-width:700px){
  .feedback{
    border:0;

<body><main class="app">
<header><div class="top"><span class="brand">Wortschatz.</span><span id="counter"></span></div><div class="progress"><div id="bar"></div></div></header>
<section class="stage" id="study">
 <div class="feedbackShell show" id="feedbackShell">
  <div class="feedback" id="feedback">
   <div id="question">
    <div class="topZone">
     <div class="sentence" id="sentence"></div>
     <div class="translation" id="translation"></div>
    </div>
    <input id="answerInput" class="inputbox cardInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="none">
    <div class="resultSlot" id="resultSlot">
     <div class="targetForm" id="targetForm"></div>
     <div class="diffBlock" id="diffBlock"><div class="diffWord" id="typedDiff"></div><div class="diffArrow"><img src="../components/icons/Arrow_Down.svg" alt="" aria-hidden="true"></div><div class="diffWord diffCorrect" id="correctDiff"></div></div>
    </div>
    <button class="check cardCheck" id="desktopCheck">Check</button>
   </div>
   <div class="feedbackReveal">
   <button class="speakTop" id="speakTop" aria-label="Hear sentence"><img class="speakTopIcon" src="../components/icons/Audio.svg" alt="" aria-hidden="true"></button>
   <div class="detail">
    <div class="answerTargetRow"><div class="base" id="base"></div></div>
    <div class="meaning" id="meaning"></div>
    <div class="grammar" id="grammar"></div>
   </div>
   </div>
  </div>
  <div id="keyboardMount"></div>
  <button class="continue" id="continue">Continue</button>
 </div>
</section>
<section class="done" id="done"><div><h1>Done for today.</h1><p>Come back tomorrow.</p><div class="doneScore" id="doneScore"></div><button class="addWords" id="addWords">+ Add 5 new words</button><div class="allAdded" id="allAdded">All words are already in your deck.</div></div></section>
<div class="version">v2.62 · persistent card + swipe · desktop minimal · fix 13</div>
</main>
<script src="words.js"></script>
<script>
// App-side keyboard bridge: the reusable component only emits intent.
document.addEventListener("deutsch-keyboard-input",e=>{
 const k=e.detail?.key||"",input=document.getElementById("answerInput");
 if(!input)return;
 if(k==="BACK"){input.value=input.value.slice(0,-1);return}
 if(k==="OK"){check();return}
 if(k==="SPACE"){if(input.value.length&&!input.value.endsWith(" "))input.value+=" ";return}
 if(k)input.value+=k;
});
async function loadKeyboardComponent(){
 const mount=document.getElementById("keyboardMount");
 if(!mount)return false;
 const r=await fetch("../components/deutsch-keyboard-v2.60.html");
 if(!r.ok)throw new Error("Keyboard component failed to load");
 const text=await r.text();
 const tpl=document.createElement("template");
 tpl.innerHTML=text;
 const scripts=[];
 tpl.content.querySelectorAll("script").forEach(s=>{scripts.push(s.textContent);s.remove()});
 mount.appendChild(tpl.content);
 for(const code of scripts){const s=document.createElement("script");s.textContent=code;document.body.appendChild(s);}
 const kb=document.getElementById("keyboard");
 window.deutschKeyboardReady=true;
 if(innerWidth<700)kb.classList.add("show");
 return true;
}
</script>

<script>
const $=id=>document.getElementById(id), STORE="wortsternSRSv03", HOME_STATS="deutschHomeStatsV1";

function publishWortschatzStatus(done=false){
  try{
    const today=day();
    const allDue=activeCards().filter(c=>rec(c).due<=today);
    const status={
      date:today,
      done:!!done || allDue.length===0,
      remaining:allDue.length,
      updatedAt:Date.now()
    };
    const home=JSON.parse(localStorage.getItem(HOME_STATS)||"{}");
    home.wortschatz=status;
    localStorage.setItem(HOME_STATS,JSON.stringify(home));
  }catch(e){}
}
// Simple SRS: first success -> tomorrow, then +8, +20, +45, +90 days.
// A mistake resets the card: it stays in today's session until answered correctly, then returns tomorrow.
const steps=[1,8,20,45,90];
const INITIAL_WORDS=10, ADD_BATCH=5;
let state={cards:{},activeIds:[]};
try{const saved=JSON.parse(localStorage.getItem(STORE)||"null");if(saved&&saved.cards&&Array.isArray(saved.activeIds))state=saved}catch(e){}
const day=()=>{let d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)}
const add=n=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function ensureDeck(){
 if(!state.activeIds.length){state.activeIds=WORDS.slice(0,INITIAL_WORDS).map(c=>c.id);save()}
}
function rec(c){
 if(!state.cards[c.id])state.cards[c.id]={level:0,due:day()};
 return state.cards[c.id];
}
let queue=[],idx=0,current=null,sessionTotal=0,completed=0,failedToday=new Set(),closedToday=new Set();
function normalize(s){return s.trim().toLocaleLowerCase("de-DE").replace(/\s*,\s*/g," ").replace(/\s+/g," ")}
function targetParts(c){return (c.target||"").split(" / ").map(x=>x.trim()).filter(Boolean)}
function targets(c){
 const parts=targetParts(c);
 // With several blanks, the slash separates the pieces of ONE separable verb,
 // not alternative answers. The learner types both pieces in one field.
 if((c.blank.match(/_____/g)||[]).length>1)return [parts.join(" ")];
 return parts;
}
function activeCards(){const ids=new Set(state.activeIds);return WORDS.filter(c=>ids.has(c.id))}
function build(cards=null){
 ensureDeck();
 queue=(cards||activeCards().filter(c=>rec(c).due<=day())).sort(()=>Math.random()-.5);
 idx=0;sessionTotal=queue.length;completed=0;failedToday=new Set();closedToday=new Set();
 publishWortschatzStatus(queue.length===0);
 render();
}
function blankHTML(c){return c.blank.replace(/_____/g,"<span class='blank' aria-label='missing word'></span>")}
function revealHTML(c){
 let escaped=c.revealed.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const ts=targetParts(c); for(const t of ts){let e=t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");escaped=escaped.replace(new RegExp(e),"<span class='target'>"+t+"</span>")}
 return escaped;
}
function render(){
 if(idx>=queue.length){showDone();return}
 current=queue[idx];$("counter").textContent=`${completed} / ${sessionTotal} today`;$("bar").style.width=`${sessionTotal?completed/sessionTotal*100:100}%`;
 $("sentence").innerHTML=blankHTML(current);$("translation").textContent=current.ru;$("answerInput").value="";
 $("resultSlot").style.display="none";$("targetForm").style.display="none";$("diffBlock").style.display="none";$("typedDiff").innerHTML="";$("correctDiff").innerHTML="";
 $("answerInput").disabled=false;
 $("answerInput").removeAttribute("aria-disabled");
 $("question").classList.remove("hidden");$("feedback").className="feedback";$("feedbackShell").className="feedbackShell";$("feedbackShell").style.transform="";$("feedbackShell").style.opacity="";if(window.deutschKeyboardReady&&innerWidth<700)$("keyboard").classList.add("show");
 if(innerWidth>=700)setTimeout(()=>$("answerInput").focus(),30);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function diffHTML(typed,correct){
 const a=[...typed],b=[...correct],m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m;i>=0;i--)for(let j=n;j>=0;j--){if(i===m)dp[i][j]=n-j;else if(j===n)dp[i][j]=m-i;else if(a[i]===b[j])dp[i][j]=dp[i+1][j+1];else dp[i][j]=1+Math.min(dp[i+1][j+1],dp[i+1][j],dp[i][j+1])}
 let i=0,j=0,top=[],bottom=[];
 while(i<m||j<n){
  if(i<m&&j<n&&a[i]===b[j]){top.push(`<span class="diffSame">${esc(a[i])}</span>`);bottom.push(`<span class="diffSame">${esc(b[j])}</span>`);i++;j++;continue}
  const sub=i<m&&j<n?dp[i+1][j+1]:1e9,del=i<m?dp[i+1][j]:1e9,ins=j<n?dp[i][j+1]:1e9;
  if(sub<=del&&sub<=ins){top.push(`<span class="diffWrong">${esc(a[i])}</span>`);bottom.push(`<span class="diffMissing">${esc(b[j])}</span>`);i++;j++}
  else if(del<=ins){top.push(`<span class="diffWrong">${esc(a[i])}</span>`);i++}
  else{bottom.push(`<span class="diffMissing">${esc(b[j])}</span>`);j++}
 }
 return [top.join(""),bottom.join("")];
}
function syncGlowToDivider(){
 const card=$("feedback"), line=$("feedback")?.querySelector(".detail");
 if(!card||!line) return;
 const cr=card.getBoundingClientRect(), lr=line.getBoundingClientRect();
 if(!cr.height) return;
 const y=((lr.top-cr.top)/cr.height)*100;
 card.style.setProperty("--glow-y",`${Math.max(5,Math.min(95,y))}%`);
}
function animateGlowWithReveal(duration=420){
 const start=performance.now();
 function frame(now){
   syncGlowToDivider();
   if(now-start<duration) requestAnimationFrame(frame);
   else syncGlowToDivider();
 }
 requestAnimationFrame(frame);
}
window.addEventListener("resize",()=>{ if($("feedback")?.classList.contains("revealed")) syncGlowToDivider(); });

function check(){
 let typed=normalize($("answerInput").value);if(!typed)return;
 const opts=targets(current), matched=opts.find(t=>normalize(t)===typed);
 let ok=!!matched;
 // For an error, compare against the closest accepted answer so the highlighted difference is useful.
 let correct=opts[0]||"";
 if(!ok&&opts.length>1){
   const distance=(x,y)=>{const a=[...normalize(x)],b=[...normalize(y)],d=Array.from({length:a.length+1},(_,i)=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
   correct=[...opts].sort((x,y)=>distance(typed,x)-distance(typed,y))[0];
 } else if(ok) correct=matched;
 $("keyboard").classList.remove("show");
 // First show the finished card in its collapsed state. This gives the glow
 // the exact starting position of the divider before the reveal animation begins.
 $("feedbackShell").className="feedbackShell show";
 $("feedback").className="feedback show "+(ok?"good":"bad");
 // Keep the original question area fixed and fill its blank in-place.
 $("sentence").innerHTML=revealHTML(current);
 $("answerInput").disabled=true;
 $("answerInput").setAttribute("aria-disabled","true");
 let displayCorrect=normalize(correct);
 if(current&&/^(der|die|das)\s/i.test(String(current.base||""))){
   displayCorrect=displayCorrect.charAt(0).toLocaleUpperCase("de-DE")+displayCorrect.slice(1);
 }
 $("targetForm").textContent=displayCorrect;
 $("resultSlot").style.display="flex";
 // Anchor the gradient to the divider before opening, then track the divider
 // frame-by-frame while the lower half expands.
 syncGlowToDivider();
 requestAnimationFrame(()=>{
   $("feedbackShell").classList.add("revealed");
   $("feedback").classList.add("revealed");
   animateGlowWithReveal(420);
 });
 if(ok){
   $("targetForm").style.display="inline-block";
   $("diffBlock").style.display="none";
   $("typedDiff").innerHTML="";$("correctDiff").innerHTML="";
 }else{
   $("targetForm").style.display="none";
   const [top,bottom]=diffHTML(typed,normalize(correct));
   $("typedDiff").innerHTML=top;$("correctDiff").innerHTML=bottom;
   $("diffBlock").style.display="block";
 }
 $("base").textContent=current.base;$("meaning").textContent=current.translation;$("grammar").textContent=current.grammar||"";
 const r=rec(current);
 if(ok){
   if(failedToday.has(current.id)){r.level=0;r.due=add(1)}
   else{r.level=Math.min(r.level+1,steps.length);r.due=add(steps[Math.min(r.level-1,steps.length-1)])}
   if(!closedToday.has(current.id)){closedToday.add(current.id);completed++}
 } else {
   failedToday.add(current.id);
   r.level=0;r.due=day();
   // Reinsert once at the end. It remains one of today's unique cards, so the total never grows.
   if(!queue.slice(idx+1).some(c=>c.id===current.id))queue.push(current);
 }
 save();
}

// Mobile reveal navigation: soft Tinder-like drag left for the persistent card.
(()=>{
 const shell=$("feedback");
 let startX=0,startY=0,lastX=0,startT=0,tracking=false,horizontal=false,finishing=false;

 const clean=()=>{
   tracking=false; horizontal=false;
   shell.classList.remove("swiping","snapback","swipeout");
   shell.style.transform=""; shell.style.opacity="";
 };

 const snapBack=()=>{
   tracking=false; horizontal=false;
   shell.classList.remove("swiping","swipeout");
   shell.classList.add("snapback");
   shell.style.transform=""; shell.style.opacity="";
   setTimeout(()=>shell.classList.remove("snapback"),190);
 };

 const goNext=()=>{
   if(finishing)return;
   finishing=true; tracking=false;
   shell.classList.remove("swiping","snapback");
   shell.classList.add("swipeout");
   shell.style.transform="translateX(-115vw) rotate(-8deg) scale(.92)";
   shell.style.opacity="0";
   setTimeout(()=>{clean();finishing=false;next()},190);
 };

 shell.addEventListener("touchstart",e=>{
   if(innerWidth>=700||!$("feedback").classList.contains("show")||finishing||e.touches.length!==1)return;
   if(e.target.closest("button,a,input,textarea,select"))return;
   const t=e.touches[0];
   startX=lastX=t.clientX; startY=t.clientY; startT=performance.now();
   tracking=true; horizontal=false;
 },{passive:true});

 shell.addEventListener("touchmove",e=>{
   if(!tracking||e.touches.length!==1)return;
   const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;
   lastX=t.clientX;
   if(!horizontal){
     if(Math.hypot(dx,dy)<12)return;
     if(dx>=0){tracking=false;return}
     if(Math.abs(dy)>Math.abs(dx)*1.25){tracking=false;return}
     horizontal=true;
   }
   e.preventDefault();
   const left=Math.min(0,dx);
   shell.classList.add("swiping");
   const shrink=Math.max(.93,1-Math.abs(left)/1800);
   shell.style.transform=`translateX(${left}px) rotate(${left/48}deg) scale(${shrink})`;
   shell.style.opacity=String(Math.max(.55,1-Math.abs(left)/520));
 },{passive:false});

 shell.addEventListener("touchend",()=>{
   if(!tracking)return;
   const dx=lastX-startX,elapsed=Math.max(1,performance.now()-startT),speed=-dx/elapsed;
   if(horizontal&&(dx<=-78||(dx<=-42&&speed>.55)))goNext(); else snapBack();
 },{passive:true});
 shell.addEventListener("touchcancel",snapBack,{passive:true});
})();
