<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pronomen" />
    <title>Pronomen</title>
    <link rel="stylesheet" href="../components/deutsch-base-v1.css?v=6" />
    <link rel="stylesheet" href="../components/deutsch-ui-v1.css?v=10" />
    <link rel="stylesheet" href="../components/deutsch-fonts-v1.css?v=1" />
    <script src="../components/deutsch-fonts-v1.js?v=1"></script>
    <link rel="stylesheet" href="pronomen.css?v=27" />
  </head>
  <body>
    <main class="app">
      <section id="start" class="screen">
        <div class="brand">Pronomen</div>
        <h1>Wie viele Übungen?</h1>
        <p class="muted">Personal- und Possessivpronomen gemischt.</p>
        <div class="options">
          <button class="size ui-size" data-n="10">10</button>
          <button class="size ui-size" data-n="20">20</button>
          <button class="size ui-size" data-n="30">30</button>
        </div>
        <div class="table-buttons">
          <button class="table-btn ui-spick" data-table="reference">Spickzettel</button>
        </div>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>

      <section id="game" class="screen hidden">
        <div class="top">
          <div>
            <div class="top-title">Pronomen</div>
            <div class="progress ui-progress"><i id="bar"></i></div>
          </div>
          <div class="counter ui-counter" id="counter">1 / 10</div>
        </div>

        <div class="exercise">
          <div class="prompt">
            <div class="context" id="context"></div>
            <div class="sentence" id="sentence"></div>
            <div class="translation" id="translation"></div>
          </div>
          <div class="answerbox" id="answerbox"></div>
          <button class="check ui-main" id="check">Prüfen</button>
          <div id="feedback" class="feedback hidden">
            <div class="given" id="given"></div>
            <div class="correct-text" id="correctText"></div>
            <div class="case-note" id="caseNote" hidden></div>
            <div class="skill" id="skill"></div>
            <button class="continue ui-quiet" id="continue">Weiter</button>
          </div>
          <div id="keyboardMount"></div>
          <div class="table-buttons in-session-tables">
            <button class="table-btn ui-spick" type="button" id="roundTableBtn" data-table="round" disabled>Spickzettel</button>
          </div>
        </div>
      </section>

      <section id="done" class="screen hidden">
        <div class="brand brand-done">Pronomen</div>
        <h1>Fertig.</h1>
        <div class="done-score" id="score">0 / 10</div>
        <div class="done-note" id="doneNote">Gut gemacht – Runde geschafft!</div>
        <div class="end-list hidden" id="weak"></div>
        <div class="done-actions">
          <button class="ui-quiet" id="playAgain">Noch eine Runde</button>
          <button class="ui-main" id="homeBack">Zur Startseite</button>
        </div>
      </section>

      <div id="modal" class="modal ui-window" aria-hidden="true">
        <div class="modal-card ui-window-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-head ui-window-head">
            <h2 class="ui-window-title" id="modalTitle"></h2>
            <button class="close ui-close" id="close" type="button" aria-label="Schließen"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13"/></svg></button>
          </div>
          <div id="modalBody" class="ui-window-body"></div>
        </div>
      </div>
      <div class="version-mark" aria-hidden="true">v7.47</div>
    </main>
    <script src="../components/deutsch-day-v1.js?v=1"></script>
    <script src="../components/deutsch-translation-v1.js?v=2"></script>
    <script src="sentences.js?v=2"></script>
    <script src="../components/deutsch-progress-v1.js"></script>
    <script src="../components/deutsch-end-v1.js?v=1"></script>
    <script src="../components/deutsch-bottom-v1.js?v=2"></script>
    <script src="../components/deutsch-window-v1.js?v=3"></script>
    <script src="pronomen.js?v=25"></script>
    <script src="../components/deutsch-wide-v1.js?v=5"></script>
</body>
</html>
