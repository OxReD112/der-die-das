<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("deutschThemeV1") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verben + Präp." />
    <title>Verben mit Präpositionen</title>
    <link rel="stylesheet" href="../../components/deutsch-base-v1.css?v=5" />
    <link rel="stylesheet" href="../../components/deutsch-ui-v1.css?v=1" />
    <link rel="stylesheet" href="../../components/deutsch-fonts-v1.css?v=1" />
    <script src="../../components/deutsch-fonts-v1.js?v=1"></script>
    <link rel="stylesheet" href="verben_mit_praepositionen.css?v=25" />
  </head>
  <body>
    <main class="app">
      <section id="start">
        <h1 class="start-title">Verben mit Präpositionen</h1>
        <div class="start-sub">Wie viele Übungen?</div>
        <p class="start-hint">Schreib die Präposition, dann wähle den Kasus.</p>
        <div class="session-options">
          <button class="session-option ui-size" data-size="10">10</button>
          <button class="session-option ui-size" data-size="20">20</button>
          <button class="session-option ui-size" data-size="30">30</button>
        </div>
        <button class="pattern-table-btn ui-spick" type="button" data-tips="start">Spickzettel</button>
      </section>

      <section id="game" class="hidden">
        <div class="top">
          <div>
            <div class="top-title">Verben mit Präpositionen</div>
            <div class="progress ui-progress"><i id="bar"></i></div>
          </div>
          <div class="counter ui-counter" id="counter">1 / 10</div>
        </div>

        <div class="exercise">
          <div class="qzone">
            <div class="anchor">
              <div class="prompt" id="prompt">
                <div class="meaning" id="meaning"></div>
                <div class="sentence" id="sentence">
                  <span id="verb"></span> <span class="gap typing" id="gap"></span>
                </div>
                <!-- One slot under the verb: „Welcher Kasus?“ during the case step, then „+ Kasus“ after the
                     answer. Its height is reserved from the start, so the line below never moves. -->
                <div class="above-slot">
                  <div class="case-line off" id="caseLine" aria-hidden="true">&nbsp;</div>
                  <div class="case-question off" id="caseQuestion">Welcher Kasus?</div>
                </div>
              </div>
              <button class="ui-main" id="check">Prüfen</button>

              <div id="feedback" class="feedback hidden">
                <div class="glow l"></div>
                <div class="glow r"></div>
                <div class="divider"><i class="sl"></i><i class="sr"></i><i class="line"></i></div>
                <div id="prepFeedback">
                  <div class="given" id="given"></div>
                  <div class="case-step hidden" id="caseStep">
                    <div class="choices" id="choices"></div>
                  </div>
                </div>
                <div id="finalFeedback" class="hidden">
                  <div class="chips" id="chips"></div>
                  <div class="case-rule" id="caseRule" hidden></div>
                  <div class="also-line" id="alsoLine" hidden></div>
                  <div class="example" id="example"></div>
                  <div class="example-tr" id="exampleTr"></div>
                  <button class="ui-quiet" id="continue">Weiter</button>
                </div>
              </div>
            </div>
          </div>
          <div class="kbzone" id="kbZone"><div id="keyboardMount"></div></div>
        </div>
        <div class="in-session-pattern">
          <button class="pattern-table-btn ui-spick" type="button" id="roundTipsBtn" data-tips="round" disabled>Spickzettel</button>
        </div>
      </section>

      <section id="done" class="hidden">
        <h1 class="done-title">Fertig.</h1>
        <div class="done-score" id="score">0 / 10</div>
        <div class="done-score-label">komplett richtig</div>
        <div class="done-parts" id="parts"></div>
        <div class="done-note" id="doneNote"></div>
        <div class="end-list hidden" id="weak"></div>
        <div class="done-actions">
          <button class="ui-quiet" id="playAgain">Noch eine Runde</button>
          <button class="ui-main" id="homeBack">Zur Startseite</button>
        </div>
      </section>

      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>
      <div id="tipsModal" class="pattern-modal" aria-hidden="true">
        <div class="pattern-modal-card" role="dialog" aria-modal="true" aria-labelledby="tipsModalTitle">
          <div class="pattern-modal-head">
            <h2 id="tipsModalTitle">Präpositionen · Spickzettel</h2>
            <button class="pattern-close ui-close" id="tipsClose" type="button" aria-label="Schließen"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13"/></svg></button>
          </div>
          <div id="tipsModalBody"></div>
        </div>
      </div>
      <div class="version-mark" aria-hidden="true">v3.17</div>
    </main>

    <script src="../../components/deutsch-translation-v1.js?v=2"></script>
    <script src="../../components/deutsch-day-v1.js?v=1"></script>
    <script src="verbs.js?v=6"></script>
    <script src="../../components/deutsch-progress-v1.js"></script>
    <script src="../../components/deutsch-end-v1.js?v=1"></script>
    <script src="verben_mit_praepositionen.js?v=16"></script>
    <script src="../../components/deutsch-wide-v1.js?v=4"></script>
</body>
</html>
