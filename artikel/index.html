<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Der.Die.Das." />
    <title>Artikel</title>
    <link rel="stylesheet" href="artikel.css?v=1" />
  </head>
  <body>
    <main class="app">
      <section id="sessionScreen">
        <div class="game-title">Der.Die.Das.</div>
        <h1>Wie viele Wörter?</h1>
        <p>Endungen, Gruppen und Ausnahmen.</p>
        <div class="session-options">
          <button class="session-option" data-size="10">10</button>
          <button class="session-option" data-size="20">20</button>
          <button class="session-option" data-size="30">30</button>
        </div>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>

      <div id="game" class="hidden">
        <section class="top">
          <div>
            <div class="top-title">Der.Die.Das.</div>
            <div class="progress"><i id="bar"></i></div>
          </div>
          <div class="counter" id="counter">1 / 10</div>
        </section>
        <section class="card" id="card">
          <div class="eyebrow">Wähle den richtigen Artikel.</div>
          <div class="word" id="word"></div>
          <div class="translation" id="translation"></div>
        </section>
        <section class="choices" id="choices">
          <button class="choice der" data-a="der">der</button>
          <button class="choice die" data-a="die">die</button>
          <button class="choice das" data-a="das">das</button>
        </section>
        <section class="feedback" id="feedback">
          <h2 id="feedbackTitle"></h2>
          <p id="choiceLine"></p>
          <div class="answer-card">
            <div class="answer-label">Das Wort</div>
            <div class="answer-word"><span id="answerArticle"></span> <span id="answerWord"></span></div>
            <div class="answer-translation" id="answerTranslation"></div>
          </div>
          <div class="rule-card">
            <div class="rule-label" id="ruleLabel"></div>
            <div class="rule-title" id="ruleTitle"></div>
            <div class="rule-examples" id="ruleExamples"></div>
            <div class="rule-reliability" id="ruleReliability"></div>
          </div>
          <button id="continue">Weiter</button>
        </section>
      </div>

      <section class="hidden" id="endScreen">
        <div class="game-title">Der.Die.Das.</div>
        <h1>Fertig.</h1>
        <div class="end-score" id="endCorrect">0 / 0</div>
        <p id="endSummary">Runde geschafft.</p>
        <div class="finish-actions">
          <button id="playAgain">Noch eine Runde</button>
          <button id="homeBack">Zur Startseite</button>
        </div>
      </section>
      <div class="version-mark">v27</div>
    </main>
    <script src="../components/deutsch-day-v1.js?v=1"></script>
    <script src="../components/deutsch-translation-v1.js?v=2"></script>
    <script src="words.js?v=3"></script>
    <script src="../components/deutsch-progress-v1.js"></script>
    <script src="artikel.js?v=1"></script>
  </body>
</html>
