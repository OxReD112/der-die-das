<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pronomen">
<title>Pronomen</title>
<style>
:root{--bg:#1c1c1e;--text:#f5f5f7;--muted:#929297;--mint:#4fd7b3;--red:#ff6b73;--line:rgba(255,255,255,.10);--key:#303033}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{display:flex;justify-content:center}.app{width:min(760px,100%);padding:calc(env(safe-area-inset-top) + 18px) 18px 42px}
.screen{min-height:690px;padding:20px 14px;background:transparent}.hidden{display:none!important}.brand{font-size:clamp(56px,12vw,94px);font-weight:700;letter-spacing:-.065em;color:rgba(255,255,255,.11);margin:30px 0 70px}
.center{text-align:center}.muted{color:var(--muted)}h1{font-size:34px;letter-spacing:-.03em;margin:0 0 10px}p{line-height:1.5}
.options{display:flex;justify-content:center;gap:10px;margin:28px 0}.btn,.size{border:1px solid var(--line);background:#303033;color:var(--text);border-radius:17px;padding:15px 18px;font-size:17px;font-weight:650;cursor:pointer}.start-table-btn{font-size:14px;font-weight:400;padding:11px 14px;color:#aaa;background:transparent}.size{font-size:22px;min-width:82px}.secondary{background:transparent;color:#c7c7cc}.table-buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0;position:relative;padding-bottom:17px}.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08);border-radius:99px}.top-title{font-size:18px;font-weight:700}.counter{color:var(--muted);font-size:14px}.progress{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:99px;overflow:hidden;z-index:1}.progress i{display:block;height:100%;background:var(--mint);width:0}
.exercise{display:flex;flex-direction:column;min-height:600px}.prompt{text-align:center;margin:68px auto 0;max-width:680px}.context{color:var(--muted);font-size:16px;margin-bottom:17px}.sentence{font-size:clamp(30px,7vw,45px);line-height:1.18;font-weight:600;letter-spacing:-.03em}.translation{font-size:16px;color:var(--muted);margin-top:17px}
.answerbox{margin:34px auto 0;width:min(600px,100%);border:1px solid var(--line);border-radius:18px;background:#202022;min-height:58px;padding:15px 17px;font-size:24px;display:flex;align-items:center;justify-content:center}.placeholder{color:#666}
.keyboard{margin-top:auto;padding-top:20px}.row{display:flex;justify-content:center;gap:3px;margin-bottom:5px}.key{height:44px;width:calc((100% - 27px)/10);flex:0 0 calc((100% - 27px)/10);border:1px solid var(--line);border-radius:10px;background:var(--key);color:#eee;font-size:20px}.third{justify-content:flex-start;padding-left:calc((100% - 27px)/20)}.third .back{margin-left:auto}.special{justify-content:flex-start}.special .key{color:#b8ddd2}.ok{margin-left:auto!important;flex:0 0 calc(3 * ((100% - 27px)/10) + 6px)!important;width:calc(3 * ((100% - 27px)/10) + 6px)!important;color:#171719!important;background:#eee8df!important;font-size:16px;font-weight:700}
.feedback{--state:var(--mint);position:relative;margin:42px 0 0;padding:32px 0 0;text-align:center;border-top:1px solid rgba(255,255,255,.11);isolation:isolate}.feedback.wrong{--state:var(--red)}
.feedback:after{content:"";position:absolute;z-index:-2;left:0;right:0;top:-180px;height:360px;pointer-events:none;opacity:.9;background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--state) 22%,transparent) 0%,color-mix(in srgb,var(--state) 10%,transparent) 32%,transparent 70%)}
.feedback:before{content:"";position:absolute;z-index:-1;top:-1px;left:50%;width:0;height:2px;background:var(--state);box-shadow:0 0 18px color-mix(in srgb,var(--state) 70%,transparent);animation:spread .42s ease-out forwards}
@keyframes spread{to{left:0;width:100%}}
.given{font-size:30px;font-weight:650}.correctText{font-size:30px;font-weight:650;margin-top:5px}.bad{color:var(--red)}.good{color:var(--mint)}.skill{margin-top:24px;color:var(--muted);font-size:14px}.continue{width:min(600px,100%);margin-top:25px;border:0;border-radius:15px;padding:15px;background:#eee8df;color:#171719;font-size:17px;font-weight:700}
.in-session-tables{margin-top:auto;padding-top:30px;justify-content:center;opacity:.22}.in-session-tables .btn{font-size:11px;font-weight:400;padding:7px 10px;border-color:rgba(255,255,255,.06);background:transparent;color:#aaa}
.done-score{font-size:58px;font-weight:700;letter-spacing:-.05em;margin:18px 0 6px}.done-note{color:var(--muted);margin-bottom:28px}.weak{margin:22px auto;max-width:420px;padding:16px;border:1px solid var(--line);border-radius:17px;color:#c8c8cc}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-card{width:min(680px,100%);max-height:86vh;overflow:auto;background:#252527;border:1px solid var(--line);border-radius:24px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;color:white;font-size:28px}.tbl{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}.tbl th,.tbl td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}.tbl th{color:var(--muted);font-weight:500}.tbl td.hot{background:color-mix(in srgb,var(--red) 15%,transparent);color:#ffd2d5;font-weight:650;border-radius:7px}.focus-note{margin:12px 0 0;color:var(--muted);font-size:12px}.version{position:fixed;right:10px;bottom:8px;color:rgba(255,255,255,.18);font-size:11px}
@media(min-width:700px){.keyboard{display:none}.answerbox{cursor:text}}
.third{padding-left:10px}
.third .back{margin-left:auto;flex:0 0 calc(2.5 * calc((100% - 27px)/10) + 4.5px);width:calc(2.5 * calc((100% - 27px)/10) + 4.5px)}
</style>
</head>
<body><main class="app">
<section id="start" class="screen center">
<div class="brand">Pronomen</div><h1>How many exercises?</h1>
<p class="muted">Personal and possessive pronouns are mixed together.</p>
<div class="options"><button class="size" data-n="10">10</button><button class="size" data-n="30">30</button><button class="size" data-n="50">50</button></div>
<div class="table-buttons"><button class="btn secondary start-table-btn" data-table="personal">Personalpronomen · Table</button><button class="btn secondary start-table-btn" data-table="possessive">Possessiv · Table</button></div>
</section>

<section id="game" class="screen hidden">
<div class="top"><div><div class="top-title">Pronomen</div><div class="progress"><i id="bar"></i></div></div><div class="counter" id="counter">1 / 10</div></div>

<div class="exercise">
<div class="prompt"><div class="context" id="context"></div><div class="sentence" id="sentence"></div><div class="translation" id="translation"></div></div>
<div class="answerbox" id="answerbox"><span class="placeholder">Type the missing form</span></div>
<div id="feedback" class="feedback hidden"><div class="given" id="given"></div><div class="correctText" id="correctText"></div><div class="skill" id="skill"></div><button class="continue" id="continue">Continue</button></div>
<div class="keyboard" id="keyboard"></div>
<div class="table-buttons in-session-tables"><button class="btn secondary" data-table="personal">Personal table</button><button class="btn secondary" data-table="possessive">Possessiv table</button></div>
</div></section>

<section id="done" class="screen center hidden">
<div class="brand" style="margin-bottom:45px">Pronomen</div><h1>Done for now.</h1><div class="done-score" id="score">0 / 10</div>
<div class="done-note">Session complete. You can come back later without turning it into a marathon.</div>
<div class="weak hidden" id="weak"></div>
<button class="btn" id="home" style="margin-top:20px">Back to start</button>
</section>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="close">×</button></div><div id="modalBody"></div></div></div>
<div class="version">v3</div>
</main>
<script src="pronouns.js"></script>
<script>
const $=x=>document.getElementById(x), data=window.PRONOUN_EXERCISES||[];
const STORE='pronomenWeaknessV1'; let weak={}; try{weak=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){}
let deck=[],i=0,n=10,answer='',correct=0,sessionWeak={};
const norm=s=>s.trim().toLocaleLowerCase('de-DE').replace(/[.,!?;:]/g,'');
function save(){try{localStorage.setItem(STORE,JSON.stringify(weak))}catch(e){}}
function weightedDeck(count){return data.map(x=>({x,k:-Math.log(Math.max(Math.random(),1e-9))/(1+(weak[x.skill]||0))})).sort((a,b)=>a.k-b.k).slice(0,Math.min(count,data.length)).map(o=>o.x)}
function start(count){n=count;deck=weightedDeck(count);i=0;answer='';correct=0;sessionWeak={};$('start').classList.add('hidden');$('done').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){let x=deck[i];answer='';$('context').textContent=x.context;$('sentence').textContent=x.sentence;$('translation').textContent=x.translation;$('answerbox').innerHTML='<span class="placeholder">Type the missing form</span>';$('feedback').className='feedback hidden';$('keyboard').style.display='';$('counter').textContent=`${i+1} / ${deck.length}`;$('bar').style.width=`${(i/deck.length)*100}%`}
function paintAnswer(){ $('answerbox').textContent=answer||'' }
function submit(){if(!answer.trim())return;let x=deck[i],ok=norm(answer)===norm(x.answer);if(ok){correct++;weak[x.skill]=Math.max(0,(weak[x.skill]||0)-.25)}else{weak[x.skill]=(weak[x.skill]||0)+1;sessionWeak[x.skill]=(sessionWeak[x.skill]||0)+1}save();$('feedback').className='feedback '+(ok?'correct':'wrong');$('given').innerHTML=ok?`<span class="good">${answer}</span>`:`<span class="bad">${answer}</span>`;$('correctText').innerHTML=ok?'':`<span class="good">→ ${x.answer}</span>`;$('skill').textContent=x.skill+(x.type==='possessive'&&x.gender?' · '+x.gender:'');$('keyboard').style.display='none'}
function next(){i++;if(i>=deck.length){finish();return}render()}
function finish(){$('game').classList.add('hidden');$('done').classList.remove('hidden');$('score').textContent=`${correct} / ${deck.length}`;let arr=Object.entries(sessionWeak).sort((a,b)=>b[1]-a[1]).slice(0,3);if(arr.length){$('weak').classList.remove('hidden');$('weak').innerHTML='<b>Needs more practice</b><br>'+arr.map(x=>x[0]).join('<br>')}else $('weak').classList.add('hidden')}
document.querySelectorAll('.size').forEach(b=>b.onclick=()=>start(+b.dataset.n));$('continue').onclick=next;$('home').onclick=()=>{$('done').classList.add('hidden');$('start').classList.remove('hidden')}
document.addEventListener('keydown',e=>{if($('game').classList.contains('hidden'))return;if(!$('feedback').classList.contains('hidden')){if(e.key==='Enter')next();return}if(e.key==='Enter'){submit();return}if(e.key==='Backspace'){answer=answer.slice(0,-1);paintAnswer();return}if(e.key.length===1){answer+=e.key;paintAnswer()}})
const rows=['QWERTYUIOP','ASDFGHJKL'];let kb='';rows.forEach(r=>{kb+='<div class="row">'+[...r].map(c=>`<button class="key" data-k="${c.toLowerCase()}">${c}</button>`).join('')+'</div>'});kb+='<div class="row third">'+[...'ZXCVBNM'].map(c=>`<button class="key" data-k="${c.toLowerCase()}">${c}</button>`).join('')+'<button class="key back" data-k="⌫">⌫</button></div>';kb+='<div class="row special">'+['ä','ö','ü','ß'].map(c=>`<button class="key" data-k="${c}">${c}</button>`).join('')+'<button class="key ok" data-k="OK">OK</button></div>';$('keyboard').innerHTML=kb;document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==='⌫')answer=answer.slice(0,-1);else if(k==='OK'){submit();return}else answer+=k;paintAnswer()});$('answerbox').onclick=submit;
const personal=`<table class="tbl"><tr><th></th><th>Nom.</th><th>Akk.</th><th>Dat.</th><th>Gen.</th></tr><tr><td>я</td><td data-focus="Personal · Nominativ · ich">ich</td><td data-focus="Personal · Akkusativ · ich">mich</td><td data-focus="Personal · Dativ · ich">mir</td><td data-focus="Personal · Genitiv · ich">meiner</td></tr><tr><td>ты</td><td data-focus="Personal · Nominativ · du">du</td><td data-focus="Personal · Akkusativ · du">dich</td><td data-focus="Personal · Dativ · du">dir</td><td data-focus="Personal · Genitiv · du">deiner</td></tr><tr><td>он</td><td data-focus="Personal · Nominativ · er">er</td><td data-focus="Personal · Akkusativ · er">ihn</td><td data-focus="Personal · Dativ · er">ihm</td><td data-focus="Personal · Genitiv · er">seiner</td></tr><tr><td>она</td><td data-focus="Personal · Nominativ · sie">sie</td><td data-focus="Personal · Akkusativ · sie">sie</td><td data-focus="Personal · Dativ · sie">ihr</td><td data-focus="Personal · Genitiv · sie">ihrer</td></tr><tr><td>оно</td><td data-focus="Personal · Nominativ · es">es</td><td data-focus="Personal · Akkusativ · es">es</td><td data-focus="Personal · Dativ · es">ihm</td><td data-focus="Personal · Genitiv · es">seiner</td></tr><tr><td>мы</td><td data-focus="Personal · Nominativ · wir">wir</td><td data-focus="Personal · Akkusativ · wir">uns</td><td data-focus="Personal · Dativ · wir">uns</td><td data-focus="Personal · Genitiv · wir">unser</td></tr><tr><td>вы</td><td data-focus="Personal · Nominativ · ihr">ihr</td><td data-focus="Personal · Akkusativ · ihr">euch</td><td data-focus="Personal · Dativ · ihr">euch</td><td data-focus="Personal · Genitiv · ihr">euer</td></tr><tr><td>они</td><td data-focus="Personal · Nominativ · sie(pl.)">sie</td><td data-focus="Personal · Akkusativ · sie(pl.)">sie</td><td data-focus="Personal · Dativ · sie(pl.)">ihnen</td><td data-focus="Personal · Genitiv · sie(pl.)">ihrer</td></tr></table><p class="muted">Genitive personal pronouns exist, but are much less common in everyday German.</p>`;
const possessive=`<table class="tbl"><tr><th>Person</th><th>Base</th></tr><tr><td>ich</td><td data-owner="ich">mein-</td></tr><tr><td>du</td><td data-owner="du">dein-</td></tr><tr><td>er / es</td><td data-owner="er">sein-</td></tr><tr><td>sie</td><td data-owner="sie">ihr-</td></tr><tr><td>wir</td><td data-owner="wir">unser-</td></tr><tr><td>ihr</td><td data-owner="ihr">euer-</td></tr><tr><td>sie / Sie</td><td data-owner="sie(pl.)">ihr- / Ihr-</td></tr></table><table class="tbl"><tr><th>Case</th><th>Mask.</th><th>Fem.</th><th>Neutr.</th><th>Plural</th></tr><tr><td>Nom.</td><td data-ending="Nominativ|Maskulin">—</td><td data-ending="Nominativ|Feminin">-e</td><td data-ending="Nominativ|Neutrum">—</td><td data-ending="Nominativ|Plural">-e</td></tr><tr><td>Akk.</td><td data-ending="Akkusativ|Maskulin">-en</td><td data-ending="Akkusativ|Feminin">-e</td><td data-ending="Akkusativ|Neutrum">—</td><td data-ending="Akkusativ|Plural">-e</td></tr><tr><td>Dat.</td><td data-ending="Dativ|Maskulin">-em</td><td data-ending="Dativ|Feminin">-er</td><td data-ending="Dativ|Neutrum">-em</td><td data-ending="Dativ|Plural">-en</td></tr><tr><td>Gen.</td><td data-ending="Genitiv|Maskulin">-es</td><td data-ending="Genitiv|Feminin">-er</td><td data-ending="Genitiv|Neutrum">-es</td><td data-ending="Genitiv|Plural">-er</td></tr></table><p class="muted">Combine the base with the ending: sein Auto · seinen Bruder · seiner Schwester · seines Bruders.</p>`;
function markWeakTable(type){
  const hard=Object.entries(weak).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!hard.length)return;
  if(type==='personal'){
    document.querySelectorAll('#modalBody [data-focus]').forEach(td=>{if(hard.some(([k])=>k.startsWith(td.dataset.focus)))td.classList.add('hot')});
  }else{
    document.querySelectorAll('#modalBody [data-owner]').forEach(td=>{if(hard.some(([k])=>k.startsWith('Possessiv')&&k.includes('· '+td.dataset.owner+' →')))td.classList.add('hot')});
    document.querySelectorAll('#modalBody [data-ending]').forEach(td=>{const [cas,gen]=td.dataset.ending.split('|');if(hard.some(([k])=>k.startsWith('Possessiv')&&k.includes('· '+cas)&&k.includes('· '+gen)))td.classList.add('hot')});
  }
  if(document.querySelector('#modalBody .hot'))$('modalBody').insertAdjacentHTML('beforeend','<div class="focus-note">Highlighted forms are the ones your saved practice statistics currently find most difficult.</div>');
}
document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{const type=b.dataset.table;$('modalTitle').textContent=type==='personal'?'Personalpronomen':'Possessiv';$('modalBody').innerHTML=type==='personal'?personal:possessive;markWeakTable(type);$('modal').classList.remove('hidden')});$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')}
</script></body></html>
