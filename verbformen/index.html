<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>
  (function(){
    if(localStorage.getItem("deutschThemeV1")==="light"){
      document.documentElement.setAttribute("data-theme","light");
    }
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1d">
  <title>Verbformen.</title>
  <style>
    *{box-sizing:border-box}

    :root{
      --bg:#1b1b1d;
      --cream:#f2f0ed;
      --muted:#8f8f94;
      --card:rgba(255,255,255,.018);
      --line:rgba(255,255,255,.08);
      --heading:var(--cream);
      --chevron:var(--muted);
      --choice-active-bg:rgba(255,255,255,.028);
      --choice-active-border:rgba(255,255,255,.12);
      --subtitle:var(--muted);
      --version-text:#55565a;
    }

    [data-theme="light"]{
      --bg:#f6f4f1;
      --cream:#242426;
      --muted:#727278;
      --card:rgba(0,0,0,.03);
      --line:rgba(0,0,0,.10);
      --heading:var(--cream);
      --chevron:var(--muted);
      --choice-active-bg:rgba(0,0,0,.045);
      --choice-active-border:rgba(0,0,0,.14);
      --subtitle:var(--muted);
      --version-text:rgba(43,42,39,.45);
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--cream);
      font-family:Georgia,"Times New Roman",serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    body{
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    .page{
      position:fixed;
      inset:0;
      width:min(100%,480px);
      height:100vh;
      height:100dvh;
      margin:0 auto;
      padding:
        max(24px,calc(env(safe-area-inset-top) + 12px))
        24px
        max(24px,env(safe-area-inset-bottom));
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }

    header{
      text-align:center;
      padding:36px 20px 0;
      margin-bottom:0;
    }

    h1{
      margin:0;
      color:var(--heading);
      font-family:Georgia,"Times New Roman",serif;
      font-size:40px;
      font-weight:400;
      line-height:1;
      letter-spacing:-1px;
    }

    .intro{
      margin:48px 0 14px;
      color:var(--muted);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
      font-size:14px;
      line-height:1.4;
    }

    .choices{
      display:grid;
      gap:16px;
      margin-top:0;
    }

    .choice{
      appearance:none;
      -webkit-appearance:none;
      position:relative;
      width:100%;
      min-height:96px;
      padding:20px 22px;
      border:1px solid var(--line);
      border-radius:21px;
      background:var(--card);
      color:inherit;
      font:inherit;
      text-align:left;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      overflow:hidden;
      transition:background .16s ease,border-color .16s ease,transform .16s ease;
    }

    .choice::after{
      content:"›";
      position:absolute;
      right:18px;
      top:50%;
      transform:translateY(-52%);
      color:var(--chevron);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
      font-size:28px;
      font-weight:300;
    }

    .choice:active{
      transform:scale(.992);
      background:var(--choice-active-bg);
      border-color:var(--choice-active-border);
    }

    .choice-title{
      color:var(--cream);
      font-family:Georgia,"Times New Roman",serif;
      font-size:20px;
      font-weight:400;
      line-height:1.15;
      letter-spacing:-.25px;
    }

    .choice-subtitle{
      margin-top:6px;
      color:var(--subtitle);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
      font-size:13px;
      line-height:1.4;
    }

    .version{
      position:fixed;
      left:0;
      right:0;
      bottom:calc(env(safe-area-inset-bottom) + 10px);
      color:var(--version-text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
      font-size:10px;
      line-height:1;
      letter-spacing:.35px;
      text-align:center;
      pointer-events:none;
    }

    @media(max-width:430px){
      .page{
        padding-left:18px;
        padding-right:18px;
      }

      header{
        padding:36px 20px 0;
        margin-bottom:0;
      }

      h1{font-size:37px}

      .intro{
        margin:42px 0 12px;
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
      }

      .choice{
        min-height:92px;
        padding:19px 20px;
        border-radius:20px;
      }

      .choice-title{font-size:19px}
      .choice-subtitle{font-size:12px; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
    }

    @media(prefers-reduced-motion:reduce){
      .choice{transition:none}
    }
  
    /* ===== CHAPTER PICKER · shared design (Design Police 2026-09-25) =====
       Same palette and button logic as the exercise start screens:
       cards are a filled surface, lighter than the background, lifted by a soft shadow, no outline. */
    :root{
      --pick-card-bg:#2a2a2d;
      --pick-card-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 14px rgba(0,0,0,.14);
      --pick-version:rgba(255,255,255,.24);
    }
    [data-theme="light"]{
      --pick-card-bg:#fff;
      --pick-card-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 14px rgba(0,0,0,.08);
      --pick-version:rgba(36,36,38,.34);
    }
    .intro{font-size:16px}
    .choice{border:0;background:var(--pick-card-bg);box-shadow:var(--pick-card-shadow);transition:transform .12s ease,filter .12s ease}
    .choice:active{transform:scale(.97);filter:brightness(.94);background:var(--pick-card-bg);border-color:transparent}
    .version{bottom:calc(env(safe-area-inset-bottom) + 28px);font:400 11px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:.04em;color:var(--pick-version)}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Verbformen.</h1>
      <p class="intro">Was möchtest du üben?</p>
    </header>

    <section class="choices" aria-label="Übungen">
      <button class="choice" type="button" data-target="partizipII/?v=8">
        <div class="choice-title">Partizip II</div>
        <div class="choice-subtitle">Unregelmäßige Formen</div>
      </button>

      <button class="choice" type="button" data-target="modalverben/?v=9">
        <div class="choice-title">Modalverben + werden</div>
        <div class="choice-subtitle">Formen im Kontext</div>
      </button>
    </section>
  </main>

  <div class="version">v3</div>

  <script>
    document.querySelectorAll("[data-target]").forEach(button=>{
      button.addEventListener("click",()=>{
        window.location.href=button.dataset.target;
      });
    });
  </script>
</body>
</html>
