<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wortschatz</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="wortschatz.css?v=18" />
    <link rel="stylesheet" href="collection-window.css?v=9" />
  </head>
  <body>
    <main class="app">
      <header>
        <div class="top">
          <span class="brand">Wortschatz.</span>
          <span id="counter"></span>
        </div>
        <div class="progress"><div id="bar"></div></div>
      </header>
      <section id="start" aria-labelledby="startTitle">
        <h1 class="title" id="startTitle">Wortschatz.</h1>
        <div class="startWords">
          <div class="startLabel">Deine Wörter</div>
          <button class="coll-line" id="collBtnStart" type="button"></button>
          <p class="collCount" id="collCountStart"></p>
          <p class="startNote" id="startNote"></p>
        </div>
        <div class="startActions">
          <button id="startBtn" type="button">Starten</button>
        </div>
      </section>
      <section id="choose" aria-labelledby="chooseTitle">
        <h1 class="title" id="chooseTitle">Wortschatz.</h1>
        <p class="chooseQuestion">Where do you want to start?</p>
        <div class="startWords chooseSets">
          <div class="startLabel">Quick start</div>
          <p class="chooseHint">Pick the words you want to learn</p>
          <div class="chooseSetList" id="chooseSets"></div>
        </div>
        <div class="startActions">
          <button class="chooseOwnBtn" id="chooseOwn" type="button">＋ Start with my own words</button>
          <p class="chooseOwnHint">Search the Wörterbuch, type or import</p>
        </div>
      </section>
      <section class="stage" id="study" style="display: none">
        <div id="question">
          <div class="topZone">
            <div class="sentence" id="sentence"></div>
            <div class="translation" id="translation"></div>
          </div>
          <div id="almostHint" aria-live="polite"></div>
          <input
            id="answerInput"
            class="inputbox"
            type="text"
            placeholder=" "
            aria-label="Fehlendes Wort"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            inputmode="none"
          />
          <div class="ghostRow">
            <button class="ghostEye" id="ghostEye" type="button" aria-label="Wort zeigen" title="Wort zeigen">
              <svg
                class="eyeClosed"
                viewBox="0 2 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.5 10.5s3.6 5 9.5 5 9.5-5 9.5-5" />
                <path d="M12 15.5v2.6M7.2 14.3l-1.4 2.2M16.8 14.3l1.4 2.2M3.9 12.3l-1.6 1.6M20.1 12.3l1.6 1.6" />
              </svg>
              <svg
                class="eyeOpen"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <button class="check" id="desktopCheck">Prüfen</button>
          <div id="keyboardMount"></div>
        </div>
        <div class="feedbackShell" id="feedbackShell">
          <div class="feedback" id="feedback">
            <div class="topZone answerTop" id="answerTop">
              <div class="answerSentence" id="answerSentence"></div>
              <div class="answerTranslation" id="answerTranslation"></div>
            </div>
            <div class="targetForm" id="targetForm"></div>
            <div class="diffBlock" id="diffBlock">
              <div class="diffWord" id="typedDiff"></div>
              <div class="diffArrow"><img src="../components/icons/Arrow_Down.svg" alt="" aria-hidden="true" /></div>
              <div class="diffWord diffCorrect" id="correctDiff"></div>
            </div>
            <button class="speakTop" id="speakTop" aria-label="Satz anhören">
              <img class="speakTopIcon" src="../components/icons/Audio.svg" alt="" aria-hidden="true" />
            </button>
            <div class="detail">
              <div class="answerTargetRow"><div class="base" id="base"></div></div>
              <div class="meaning" id="meaning"></div>
              <div class="auch" id="auch"></div>
              <div class="grammar" id="grammar"></div>
            </div>
          </div>
          <button class="editCard" id="editCard" type="button" aria-label="Karte bearbeiten" title="Karte bearbeiten">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z" />
              <path d="M14 6l4 4" />
            </svg>
          </button>
          <button class="continue" id="continue">Weiter</button>
        </div>
      </section>
      <section class="done" id="done">
        <div class="doneInner" id="doneInner">
          <div class="doneTop">
            <h1>
              Fertig
              <br />
              für heute.
            </h1>
            <p>Komm morgen wieder.</p>
            <div class="doneScore" id="doneScore"></div>
          </div>
          <div class="doneWords">
            <div class="startLabel">Deine Wörter</div>
            <button class="coll-line" id="collBtnDone" type="button"></button>
            <p class="collCount" id="collCountDone"></p>
            <div class="allAdded" id="allAdded">Alle Wörter sind schon dabei.</div>
          </div>
          <div class="finish-actions">
            <button class="addWords" id="addWords">5 neue Wörter lernen</button>
            <button class="home-back" id="homeBack">Zur Startseite</button>
          </div>
        </div>
      </section>
      <div class="coll-modal" id="collModal" aria-hidden="true">
        <div class="coll-card" id="collCard" role="dialog" aria-modal="true" aria-labelledby="collTitle"></div>
      </div>
      <div class="start-about" id="startAbout">
        <h2>
          <button class="aboutToggle" id="aboutToggle" type="button" aria-expanded="false" aria-controls="aboutText">
            Worum geht's?
          </button>
        </h2>
        <p class="about-de" id="aboutText"></p>
      </div>
      <div class="version-mark" aria-hidden="true">v2.118</div>
