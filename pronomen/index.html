<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pronomen" />
    <title>Pronomen</title>
    <link rel="stylesheet" href="pronomen.css?v=1" />
  </head>
  <body>
    <main class="app">
      <section id="start" class="screen">
        <div class="brand">Pronomen</div>
        <h1>Wie viele Übungen?</h1>
        <p class="muted">Personal- und Possessivpronomen gemischt.</p>
        <div class="options">
          <button class="size" data-n="10">10</button>
          <button class="size" data-n="20">20</button>
          <button class="size" data-n="30">30</button>
        </div>
        <div class="table-buttons">
          <button class="table-btn" data-table="reference">Pronomen · Tabelle</button>
        </div>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>

      <section id="game" class="screen hidden">
        <div class="top">
          <div>
            <div class="top-title">Pronomen</div>
            <div class="progress"><i id="bar"></i></div>
          </div>
          <div class="counter" id="counter">1 / 10</div>
        </div>

        <div class="exercise">
          <div class="prompt">
            <div class="context" id="context"></div>
            <div class="sentence" id="sentence"></div>
            <div class="translation" id="translation"></div>
          </div>
          <div class="answerbox" id="answerbox"></div>
          <button class="check" id="check">Prüfen</button>
          <div id="feedback" class="feedback hidden">
            <div class="given" id="given"></div>
            <div class="correct-text" id="correctText"></div>
            <div class="skill" id="skill"></div>
            <button class="continue" id="continue">Weiter</button>
          </div>
          <div id="keyboardMount"></div>
          <div class="table-buttons in-session-tables">
            <button class="table-btn" data-table="reference">Pronomen · Tabelle</button>
          </div>
        </div>
      </section>

      <section id="done" class="screen hidden">
        <div class="brand brand-done">Pronomen</div>
        <h1>Fertig.</h1>
        <div class="done-score" id="score">0 / 10</div>
        <div class="done-note">Gut gemacht – Runde geschafft!</div>
        <div class="weak hidden" id="weak"></div>
        <div class="done-actions">
          <button id="playAgain">Noch eine Runde</button>
          <button id="homeBack">Zur Startseite</button>
        </div>
      </section>

      <div id="modal" class="modal hidden">
        <div class="modal-card">
          <div class="modal-head">
            <h2 id="modalTitle"></h2>
            <button class="close" id="close">×</button>
          </div>
          <div id="modalBody"></div>
        </div>
      </div>
      <div class="version-mark">v7.39</div>
    </main>
    <script src="../components/deutsch-day-v1.js?v=1"></script>
    <script src="../components/deutsch-translation-v1.js?v=2"></script>
    <script src="sentences.js?v=1"></script>
    <script src="../components/deutsch-progress-v1.js"></script>
    <script src="pronomen.js?v=1"></script>
  </body>
</html>
