<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anki</title>

  <link rel="apple-touch-icon" href="anki-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anki">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #191a1c;
      color: #f5f0e8;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top))
               max(24px, env(safe-area-inset-right))
               max(28px, env(safe-area-inset-bottom))
               max(24px, env(safe-area-inset-left));
      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(65, 205, 174, .15) 0%,
        rgba(65, 205, 174, .07) 34%,
        rgba(65, 205, 174, 0) 72%);
      pointer-events: none;
      transform: translateY(80px);
    }

    .wrap {
      position: relative;
      width: min(100%, 430px);
      text-align: center;
    }

    .mark {
      position: relative;
      width: 152px;
      height: 118px;
      margin: 0 auto 38px;
    }

    .card {
      position: absolute;
      width: 118px;
      height: 92px;
      border-radius: 21px;
      background: linear-gradient(145deg, #222529, #151719);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 18px 38px rgba(0,0,0,.35);
    }

    .card.back {
      left: 27px;
      top: 20px;
      transform: rotate(8deg);
      box-shadow:
        0 0 22px rgba(255, 132, 110, .12),
        0 18px 38px rgba(0,0,0,.35);
    }

    .card.front {
      left: 6px;
      top: 4px;
      transform: rotate(-7deg);
      display: grid;
      place-items: center;
      box-shadow:
        -8px 8px 26px rgba(66, 211, 184, .18),
        8px -5px 24px rgba(255, 132, 110, .12),
        0 18px 38px rgba(0,0,0,.38);
    }

    .wordmark {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: 400;
      letter-spacing: -3px;
      color: #f4e8da;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 10vw, 48px);
      line-height: 1;
      letter-spacing: -1.5px;
      font-weight: 650;
    }

    p {
      margin: 0 auto 36px;
      max-width: 310px;
      color: rgba(245, 240, 232, .56);
      font-size: 17px;
      line-height: 1.45;
    }

    .start {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      border: 1px solid rgba(116, 231, 207, .30);
      border-radius: 20px;
      padding: 18px 24px;
      background: linear-gradient(135deg,
        rgba(74, 208, 180, .92),
        rgba(82, 190, 169, .84));
      color: #10201d;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      display: block;
      box-shadow:
        0 12px 35px rgba(42, 190, 160, .13),
        inset 0 1px 0 rgba(255,255,255,.25);
      -webkit-tap-highlight-color: transparent;
    }

    .start:active {
      transform: scale(.985);
    }

    .hint {
      margin-top: 17px;
      font-size: 13px;
      color: rgba(245, 240, 232, .28);
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <main class="wrap">
    <div class="mark" aria-hidden="true">
      <div class="card back"></div>
      <div class="card front">
        <span class="wordmark">Ww</span>
      </div>
    </div>

    <h1>Ready to study?</h1>
    <p>Your German cards are waiting.</p>

    <a class="start" href="https://ankiuser.net/study">
      Start studying
    </a>

    <div class="hint">AnkiWeb</div>
  </main>
</body>
</html>
