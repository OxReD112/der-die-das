<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Partizip II.</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verbformen" />
    <link rel="stylesheet" href="../../components/deutsch-base-v1.css?v=6" />
    <link rel="stylesheet" href="../../components/deutsch-ui-v1.css?v=8" />
    <link rel="stylesheet" href="../../components/deutsch-fonts-v1.css?v=1" />
    <script src="../../components/deutsch-fonts-v1.js?v=1"></script>
    <link rel="stylesheet" href="partizipII.css?v=37" />
  </head>
  <body>
    <main class="app">
      <section id="start">
        <h1 class="title">Partizip II.</h1>
        <p class="subtitle">Wie viele Verben?</p>
        <div class="choices">
          <button class="choice ui-size" data-size="10">10</button>
          <button class="choice ui-size" data-size="20">20</button>
          <button class="choice ui-size" data-size="30">30</button>
        </div>
        <button class="pattern-table-btn ui-spick" data-pattern-table>Spickzettel</button>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>

      <section id="study" class="hidden">
        <div class="top"><span class="brand">Partizip II.</span><span id="count" class="ui-counter"></span></div>
        <div class="progress ui-progress"><i id="bar"></i></div>
        <section class="card">
          <div id="verb"></div>
          <div class="translation" id="translation"></div>
          <input
            id="answer"
            placeholder=" "
            aria-label="Fehlende Form"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="done"
          />
          <button class="ui-main" id="check">Prüfen</button>
          <div class="result" id="result">
            <div class="result-head">
              <div class="state" id="state"></div>
              <div class="vowel-pattern" id="vowelPattern"></div>
            </div>
            <div class="result-body">
              <div class="forms" id="forms"></div>
              <div class="meta" id="meta"></div>
              <button class="result-more" id="resultMore" type="button">Mehr zur Form <span aria-hidden="true" class="ui-chev"></span></button>
              <div class="result-more-part">
                <div class="example" id="example"></div>
                <div class="hint hidden" id="hint"></div>
              </div>
            </div>
          </div>
          <button class="ui-quiet" id="next">Weiter</button>
        </section>
        <div id="keyboardMount"></div>
        <div class="in-session-pattern">
          <button class="pattern-table-btn ui-spick" type="button" id="roundTableBtn" data-pattern-table="round" disabled>
            Spickzettel
          </button>
        </div>
      </section>

      <section id="finish" class="hidden">
        <h2>Fertig.</h2>
        <div id="finalScore" class="final-score"></div>
        <p id="summary"></p>
        <div class="finish-actions">
          <button class="ui-quiet" id="playAgain">Noch eine Runde</button>
          <button class="ui-main" id="homeBack">Zur Startseite</button>
        </div>
      </section>

      <div id="patternModal" class="pattern-modal ui-window" aria-hidden="true">
        <div class="pattern-modal-card ui-window-card" role="dialog" aria-modal="true" aria-labelledby="patternModalTitle">
          <div class="pattern-modal-head ui-window-head">
            <h2 class="ui-window-title" id="patternModalTitle">Partizip II · Spickzettel</h2>
            <button class="pattern-close ui-close" id="patternClose" type="button" aria-label="Schließen"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13"/></svg></button>
          </div>
          <div class="pattern-tabs" id="patternTabs" role="tablist"></div>
          <div id="patternModalBody" class="ui-window-body"></div>
        </div>
      </div>
      <div class="version-mark" aria-hidden="true">v69</div>
    </main>

    <script src="../../components/deutsch-translation-v1.js?v=2"></script>
    <script src="verbs.js?v=10"></script>
    <script src="../../components/deutsch-progress-v1.js"></script>
    <script src="../../components/deutsch-end-v1.js?v=1"></script>
    <script src="../../components/deutsch-bottom-v1.js?v=2"></script>
    <script src="../../components/deutsch-window-v1.js?v=3"></script>
    <script src="partizipII.js?v=32"></script>
    <script src="../../components/deutsch-wide-v1.js?v=5"></script>
</body>
</html>
