<meta charset="utf-8">
<script>
(function(){
  if(localStorage.getItem("deutschThemeV1")==="light"){
    document.documentElement.setAttribute("data-theme","light");
  }
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  /* ===== PALETTE ===== */
  --green:#5bc8a4;
  --red:#ff7770;

  --gray-100:#f2f0ed;
  --gray-300:#c8c7c4;
  --gray-500:#8f8f94;
  --gray-700:rgba(255,255,255,.10);

  /* ===== SURFACES ===== */
  --bg:#1b1b1d;
  --surface:#222225;

  /* ===== SEMANTIC COLORS ===== */
  --text:var(--gray-100);
  --muted:var(--gray-500);
  --brand:#aaa69f;
  --accent:var(--green);
  --error:var(--red);

  --line:rgba(91,200,164,.45);
  --progress-track:#292a2c;
  --progress-fill:#777;
  --blank-line:rgba(243,241,237,.72);

  /* ===== CONTROLS ===== */
  --button-bg:#eee8df;
  --button-text:#18181a;

  /* ===== DETAIL TEXT ===== */
  --divider:var(--gray-700);
  --base-text:var(--gray-300);
  --meaning-text:#8f8f94;
  --grammar-text:#8f8f94;
  --continue-text:#9b9b9f;
  --continue-hover:#d5d5d7;

  /* ===== ANSWER DIFFERENCES ===== */
  --diff-word-bg:rgba(255,255,255,.025);
  --diff-same:var(--green);
  --diff-wrong:var(--error);
  --diff-error-bg:rgba(255,119,112,.10);
  --diff-missing:var(--error);
  --diff-arrow:#e8d9d9;
  --diff-correct:#f2f0ed;

  /* ===== OTHER COMPONENTS ===== */
  --done-score:var(--text);
  --add-words-bg:#242426;
  --add-words-text:var(--text);
  --version:#4f4f53;

  /* ===== FEEDBACK EFFECTS ===== */
  --good-glow:radial-gradient(ellipse,rgba(91,200,164,.24) 0%,rgba(91,200,164,.12) 28%,rgba(91,200,164,.04) 52%,transparent 74%);
  --bad-glow:radial-gradient(ellipse,rgba(255,119,112,.34) 0%,rgba(255,119,112,.17) 30%,rgba(255,119,112,.055) 55%,transparent 76%);
  --good-line-shadow:0 0 14px rgba(91,200,164,.3);
  --bad-line-shadow:0 0 14px rgba(255,119,112,.34);
}


[data-theme="light"]{
  /* ===== PALETTE ===== */
  --green:#3fa68a;
  --red:#e95e66;

  --gray-100:#242426;
  --gray-300:#727278;
  --gray-500:#727278;
  --gray-700:rgba(0,0,0,.10);

  /* ===== SURFACES ===== */
  --bg:#f6f4f1;
  --surface:var(--bg);

  /* ===== SEMANTIC COLORS ===== */
  --text:var(--gray-100);
  --muted:var(--gray-500);
  --brand:#6b6863;
  --accent:var(--green);
  --error:var(--red);

  --line:rgba(63,166,138,.42);
  --progress-track:#dedee1;
  --progress-fill:#8d8d92;
  --blank-line:rgba(36,36,38,.38);

  /* ===== CONTROLS ===== */
  --button-bg:#303033;
  --button-text:#f7f5f2;

  /* ===== DETAIL TEXT ===== */
  --divider:var(--gray-700);
  --base-text:#55565b;
  --meaning-text:#55565b;
  --grammar-text:#727278;
  --continue-text:#77777c;
  --continue-hover:#77777c;

  /* ===== ANSWER DIFFERENCES ===== */
  --diff-word-bg:rgba(36,36,38,.035);
  --diff-same:var(--green);
  --diff-wrong:var(--error);
  --diff-error-bg:rgba(233,94,102,.10);
  --diff-missing:var(--error);
  --diff-arrow:#77777c;
  --diff-correct:#55565b;

  /* ===== OTHER COMPONENTS ===== */
  --done-score:var(--text);
  --add-words-bg:#ffffff;
  --add-words-text:var(--text);
  --version:#9a9a9f;

  /* ===== FEEDBACK EFFECTS ===== */
  --good-glow:radial-gradient(ellipse at center,
    rgba(63,166,138,.16) 0%,
    rgba(63,166,138,.08) 28%,
    rgba(63,166,138,.025) 52%,
    transparent 74%);
  --bad-glow:radial-gradient(ellipse at center,
    rgba(233,94,102,.19) 0%,
    rgba(233,94,102,.09) 30%,
    rgba(233,94,102,.025) 55%,
    transparent 76%);
  --good-line-shadow:0 0 14px rgba(63,166,138,.22);
  --bad-line-shadow:0 0 14px rgba(233,94,102,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;touch-action:manipulation}
button{font:inherit}
.app{width:min(760px,100%);margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
#question{width:min(560px,100%)}
#question.hidden{display:none}
.top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:12px}
.brand{font:26px Georgia,serif;color:var(--brand)}
.progress{height:3px;background:var(--progress-track);border-radius:8px;overflow:hidden}
.progress div{height:100%;background:var(--progress-fill);transition:width .2s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:clamp(38px,8vh,80px);text-align:center}
.topZone{width:min(620px,100%)}
.sentence{font-size:clamp(28px,7vw,42px);line-height:1.28;letter-spacing:-.025em;max-width:620px}
.blank{display:inline-block;width:1.87em;height:.82em;border-bottom:2px solid var(--blank-line);vertical-align:baseline;margin:0 .08em}
.translation{margin-top:28px;color:var(--muted);font-size:clamp(16px,4.2vw,22px)}
.inputbox{margin-top:34px;width:min(620px,100%);height:64px;border:1.5px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;outline:none;background:var(--surface);color:var(--text);text-align:center;caret-color:var(--accent)}
.inputbox:focus{border-color:var(--accent)}
.check{margin-top:14px;width:min(620px,100%);border:0;border-radius:16px;padding:16px;background:var(--button-bg);color:var(--button-text);font-weight:750;font-size:17px}
.feedback{display:none;width:min(690px,100%);position:relative;isolation:isolate;padding:0 0 24px;overflow:visible}
.feedback.show{display:block}
.feedbackShell{display:none;width:min(690px,100%);flex-direction:column;align-items:center}
.feedbackShell.show{display:flex}
.feedbackShell .feedback{width:100%}.feedback .topZone{margin-left:auto;margin-right:auto}
.continue{
  margin-top:18px;
  width:auto;
  border:0;
  border-radius:15px;
  padding:10px 18px;
  background:var(--button-bg);
  color:var(--button-text);
  font-weight:700;
  font-size:17px;
  cursor:pointer;
  transition:transform .16s ease;
}
.continue:hover{
  transform:scale(1.12);
  color:var(--button-text);
}
.continue:active{transform:scale(1.05)}
@media(max-width:699px){.feedbackShell{touch-action:manipulation;will-change:transform,opacity}}
@keyframes glowIn{from{opacity:0}to{opacity:1}}
@keyframes audioPop{0%{transform:scale(1) rotate(0deg)}18%{transform:scale(1.07) rotate(-4deg);animation-timing-function:cubic-bezier(.22,.8,.28,1)}42%{transform:scale(1.11) rotate(3.5deg);animation-timing-function:cubic-bezier(.2,.9,.25,1)}62%{transform:scale(1.04) rotate(-1.8deg);animation-timing-function:cubic-bezier(.3,.7,.3,1)}80%{transform:scale(1.015) rotate(.8deg);animation-timing-function:cubic-bezier(.3,.7,.3,1)}100%{transform:scale(1) rotate(0deg)}}.answerTop{cursor:pointer}.answerTop .answerSentence{display:inline}.answerTop .answerTranslation{display:block}.speakTop{display:block;font-size:clamp(28px,7vw,42px);width:1em;height:auto;margin:16px auto 18px;padding:0;border:0;background:transparent;line-height:0;cursor:pointer;animation:audioPop .72s cubic-bezier(.22,.8,.28,1) 1.55s both}.speakTopIcon{display:block;width:100%;height:auto}.speakTop:active{transform:scale(.94)}.answerSentence{font-size:clamp(28px,7vw,42px);line-height:1.28;letter-spacing:-.025em;max-width:620px;margin:0 auto}.answerSentence .target{font-weight:600}.feedback.good .answerSentence .target{color:var(--accent)}.feedback.bad .answerSentence .target{color:var(--text)}
.answerTranslation{margin-top:18px;color:var(--muted);font-size:clamp(17px,4.2vw,22px)}
.targetForm{display:inline-block;margin-top:22px;color:var(--accent);font:36px Georgia,serif;background:color-mix(in srgb,var(--accent) 6%,transparent);padding:1px 5px}.feedback.bad .targetForm{display:none}
.diffBlock{display:none;margin-top:26px;padding-bottom:0;font:32px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;line-height:1.25}.feedback.bad .diffBlock{display:block}.diffWord{display:inline-block;padding:2px 5px;background:var(--diff-word-bg)}.diffSame{color:var(--diff-same)}.diffWrong{color:var(--diff-wrong);background:var(--diff-error-bg)}.diffMissing{color:var(--diff-missing);background:var(--diff-error-bg)}.diffArrow img{display:block;width:1em;height:1em;object-fit:contain;margin:0 auto}.diffArrow{margin:1px 0;color:var(--diff-arrow);font:24px/1 sans-serif}.diffCorrect{color:var(--diff-correct)}.diffCorrect .diffSame{color:var(--diff-same)}
.answerTargetRow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:0}.answerTargetRow .base{margin:0}
.detail{position:relative;border-top:1px solid var(--divider);padding-top:24px;color:var(--base-text);text-align:center;isolation:isolate}.detail::before{content:"";position:absolute;left:50%;top:-1px;width:0;height:1px;transform:translateX(-50%);background:var(--accent);box-shadow:var(--good-line-shadow);z-index:2}.feedback.bad .detail::before{background:var(--error);box-shadow:var(--bad-line-shadow)}.feedback.show .detail::before{animation:lineGrow .62s cubic-bezier(.2,.8,.2,1) forwards}.detail::after{content:"";position:absolute;z-index:-1;left:50%;top:0;width:min(760px,100vw);height:360px;transform:translate(-50%,-50%);pointer-events:none;opacity:0}.feedback.good .detail::after{background:var(--good-glow);animation:glowIn .65s ease forwards}.feedback.bad .detail::after{background:var(--bad-glow);animation:glowIn .65s ease forwards}@keyframes lineGrow{to{width:100%}}
.base{font-size:25px;margin-bottom:10px}.meaning{font-size:20px;color:var(--meaning-text)}.grammar{margin-top:14px;font-size:14px;color:var(--grammar-text)}


.done{display:none;flex:1;align-items:center;justify-content:center;text-align:center}.done.show{display:flex}.done h1{font:46px Georgia,serif;margin:0 0 15px}.done p{color:var(--muted);font-size:18px;margin:0}.doneScore{margin-top:18px;color:var(--done-score);font-size:17px}.addWords{margin:30px auto 0;width:min(360px,82vw);border:1px solid var(--divider);border-radius:16px;padding:15px 18px;background:var(--add-words-bg);color:var(--add-words-text);font-weight:700;font-size:16px}.allAdded{display:none;margin-top:25px;color:var(--muted);font-size:15px}
.version{text-align:center;color:var(--version);font-size:10px;margin-top:18px}
@media(max-width:699px){.app{padding-left:16px;padding-right:16px}.stage{padding-top:34px}#question{display:flex;flex-direction:column;align-items:center;width:100%}#question .topZone{order:1}.feedback .topZone{width:100%}#question .inputbox{order:3}#question .check{order:4}#question #keyboardMount{order:5;width:100%}.topZone{width:min(620px,100%)}.feedbackShell{margin-top:0}.feedback{padding-top:0}.answerTop{text-align:center}.answerTop .answerSentence{display:inline}.sentence,.answerSentence{font-size:28px}.speakTop{width:1.25em}.topZone .sentence,.topZone .answerSentence{min-height:2.56em}.translation{font-size:16px;margin-top:28px}.answerTranslation{font-size:17px}.inputbox{height:60px;margin-top:28px}.check{display:none}.targetForm{margin-top:22px}.diffBlock{margin-top:22px;padding-bottom:0;font-size:28px}.answerTargetRow{margin-top:0}.detail{padding-top:12px}.grammar{margin-top:26px}}

/* ===== SUMMARY SCREEN · shared buttons across all exercises (Design Police 2026-09-25) =====
   "Noch eine Runde" (quiet, outlined) + "Zur Startseite" (main). Style taken from Ortspräpositionen. */
:root{
  --end-again-bg:transparent;
  --end-again-text:rgba(242,240,237,.55);
  --end-again-line:rgba(255,255,255,.10);
  --end-main-bg:#ece6dc;   /* cream: same as the Prüfen/Weiter buttons */
  --end-main-text:#1b1b1d;
}
[data-theme="light"]{
  --end-again-bg:transparent;
  --end-again-text:rgba(36,36,38,.55);
  --end-again-line:rgba(0,0,0,.10);
  --end-main-bg:#242426;
  --end-main-text:#f6f4f1;
}
#done .finish-actions{width:min(100%,360px);margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:10px}
#done #addWords,#done #homeBack{width:100%;height:56px;margin:0;padding:0;border:0;border-radius:17px;font:650 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transform:none;transition:transform .12s ease,filter .12s ease}
#done #addWords{background:var(--end-again-bg);color:var(--end-again-text);border:1px solid var(--end-again-line)}
#done #homeBack{background:var(--end-main-bg);color:var(--end-main-text)}
#done #addWords:active,#done #homeBack:active{transform:scale(.97);filter:brightness(.94)}
#done .finish-actions{margin-top:30px}
:root{--start-version:rgba(255,255,255,.24)}
[data-theme="light"]{--start-version:rgba(36,36,38,.34)}
.version-mark{position:fixed;left:0;right:0;top:auto;bottom:calc(env(safe-area-inset-bottom) + 28px);margin:0;padding:0;
  text-align:center;font:400 11px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:.04em;color:var(--start-version);pointer-events:none;z-index:5}

/* ===== TOP BAR · shared design across all exercises (Design Police 2026-09-25) =====
   Title and counter in the palette grey, 3px progress line: hairline track + grey fill.
   Green stays reserved for "correct". */
:root{--bar-track:rgba(255,255,255,.10)}
[data-theme="light"]{--bar-track:rgba(0,0,0,.10)}
header .brand{color:var(--muted)}
header .progress{background:var(--bar-track)}
header .progress div{background:var(--muted)}

/* Question text sizes (Design Police): sentences 28px on phones */
@media(max-width:699px){#sentence,#answerSentence{font-size:28px}}

/* ===== TYPING FIELD · shared by Wortschatz, Pronomen, Modalverben, Partizip II (Design Police 2026-09-25) =====
   Pronomen look: surface slightly lighter than the background + shared 10% outline, 58px, 18px corners,
   typed text 24px in the group's font. Never green (green = correct).
   Empty field: a blinking cursor in the middle is the only hint ("type here"). */
:root{--field-bg:rgba(255,255,255,.03);--field-line:rgba(255,255,255,.10)}
[data-theme="light"]{--field-bg:#fff;--field-line:rgba(0,0,0,.10)}
@keyframes fieldCaretBg{0%,49%{background-size:2px 28px}50%,100%{background-size:0 0}}
@keyframes fieldCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
#answerInput{height:58px;min-height:58px;border:1px solid var(--field-line);border-radius:18px;background-color:var(--field-bg);
  box-shadow:none;outline:none;padding:0 17px;font:400 24px -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;color:var(--text)}
#answerInput:focus{border-color:var(--field-line);box-shadow:none}
#answerInput:placeholder-shown{caret-color:transparent;background-image:linear-gradient(var(--text),var(--text));background-repeat:no-repeat;
  background-position:center;background-size:2px 28px;animation:fieldCaretBg 1.1s steps(1) infinite}
@media(prefers-reduced-motion:reduce){#answerInput:placeholder-shown{animation:none}}

/* ===== WEITER · the quiet button, shared by all exercises (Design Police 2026-09-25) =====
   Blueprint: Partizip II. It doesn't urge you on; you read the answer first.
   Same surface + outline as the typing field; full text colour; as wide as the answer area. */
:root{--quiet-bg:rgba(255,255,255,.03);--quiet-line:rgba(255,255,255,.10)}
[data-theme="light"]{--quiet-bg:#fff;--quiet-line:rgba(0,0,0,.10)}
#continue{height:56px;border:1px solid var(--quiet-line);border-radius:17px;background:var(--quiet-bg);color:var(--text);
  font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;box-shadow:none;cursor:pointer;transition:transform .12s ease,filter .12s ease;width:100%;padding:0;}
#continue:hover{background:var(--quiet-bg);box-shadow:none;transform:none}
#continue:active{transform:scale(.97);filter:brightness(.94)}

/* Wortschatz: "Weiter" half as wide, centred (its answer area is very wide) */
#continue{width:50%;margin-left:auto;margin-right:auto;display:block}

/* Version number only on the start screen and the summary screen ("Fertig für heute"), not during the exercise (Design Police 2026-09-25; start screen 2026-09-26) */
body:not(:has(#done.show)):not(:has(#start.show)) .version-mark{display:none}

/* ===== PRÜFEN (desktop) · the one strong button in the game: main-button colours from the palette,
   same shape as "Zur Startseite" (Design Police 2026-09-25) ===== */
#desktopCheck{height:56px;border:0;border-radius:17px;background:var(--end-main-bg);color:var(--end-main-text);
  font:650 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;box-shadow:none;cursor:pointer;transition:transform .12s ease,filter .12s ease}
#desktopCheck:hover{background:var(--end-main-bg);transform:none;box-shadow:none}
#desktopCheck:active{transform:scale(.97);filter:brightness(.94)}

/* ===== TYPO TOLERANCE (2026-09-25) · only for words at level 2+ =====
   A close answer: the typing field gets a subtle red frame + a short side-to-side shake; the text stays.
   "Nur Tippfehler": quiet text button under Weiter on the wrong-answer screen. */
@keyframes fieldNudge{0%,100%{transform:translateX(0)}18%{transform:translateX(-6px)}38%{transform:translateX(5px)}58%{transform:translateX(-3px)}78%{transform:translateX(2px)}}
#answerInput.almost,#answerInput.almost:focus{border-color:color-mix(in srgb,var(--error) 60%,transparent)}
#answerInput.nudge{animation:fieldNudge .34s ease-out}
@media(prefers-reduced-motion:reduce){#answerInput.nudge{animation:none}}
/* "Nur Tippfehler" = checkbox + label (no frame, so it doesn't compete with Weiter). Secondary text colour;
   the tick uses the same grey (green stays reserved for "correct"). Tap area bigger than it looks. */
#typoBtn{display:none;position:relative;align-items:center;gap:10px;margin:8px auto 0;padding:12px 16px;border:0;background:none;
  color:var(--base-text);font:400 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;cursor:pointer;
  transition:transform .12s ease,filter .12s ease}
.feedbackShell.canTypo #typoBtn{display:inline-flex}
#typoBtn::before{content:"";flex:0 0 18px;width:18px;height:18px;box-sizing:border-box;border:1.5px solid var(--base-text);border-radius:5px;opacity:.7}
#typoBtn.done::before{opacity:1;background:var(--base-text)}
#typoBtn.done::after{content:"";position:absolute;left:23px;top:50%;width:4px;height:9px;margin-top:-6px;
  border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
#typoBtn:active{transform:scale(.97);filter:brightness(.94)}
#typoBtn:disabled{cursor:default;transform:none;filter:none}
/* Hint line above the typing field: always reserved (nothing jumps), red text fades in with the frame.
   16px = size of the grey hint/translation lines. Translation moved up 8px to make room. */
#translation{margin-top:20px}
#almostHint{height:22px;margin:14px 0 -20px;font:500 16px/22px -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  color:var(--error);opacity:0;transition:opacity .15s ease}
#almostHint.show{opacity:1}
@media(max-width:699px){#question #almostHint{order:2;width:100%}}
@media(prefers-reduced-motion:reduce){#almostHint{transition:none}}

/* ===== START SCREEN · Wortschatz (2026-09-26, v2.85) =====
   Same family as Partizip II (Georgia title + grey subline), shared start-screen colours and press effect.
   No 10/20/30: the review schedule decides what is due, so the screen shows today's count + one main button.
   Shown only when cards are due; with nothing due Wortschatz opens on "Fertig für heute" as before. */
:root{--start-line:rgba(255,255,255,.10);--start-table-text:#c8c7c4}
[data-theme="light"]{--start-line:rgba(0,0,0,.10);--start-table-text:#55565b}
#start{display:none;flex-direction:column;align-items:center;text-align:center;padding-top:36px}
#start.show{display:flex}
#start .title{font:400 clamp(48px,13vw,72px)/1.05 Georgia,serif;letter-spacing:-2px;color:var(--text);margin:0 0 12px}
#start .subtitle{color:var(--muted);font-size:16px;margin:0 0 28px}
#start #startBtn{width:312px;max-width:100%;height:56px;margin:0;padding:0;border:0;border-radius:17px;background:var(--end-main-bg);color:var(--end-main-text);
  font:650 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transform:none;transition:transform .12s ease,filter .12s ease}
#start #startBtn:active{transform:scale(.97);filter:brightness(.94)}
/* The top bar (title, counter, progress line) belongs to the session, not to the start screen */
body:has(#start.show) header{display:none}

/* ===== START SCREEN · description "Worum geht's?" (same as the other exercises) ===== */
.start-about{display:none;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);margin:0 auto;padding:0;width:312px;max-width:calc(100% - 36px);text-align:center;

/* ===== COLLECTION · button + window (2026-09-26, v2.87) — Documentation/WORTSCHATZ_COLLECTIONS.md step 3 =====
   Button = the start-screen table pill. Window = the table-window rule (blur 8px + 34% / 20% darkening,
   card colour, 10% outline, 24px corners, fade + zoom-in, × top right, tap outside / Esc closes).
   Confirm buttons = the „Are you sure?“ rule: the safe choice is the contrast button, the risky one the quiet button. */
:root{--overlay-scrim:rgba(0,0,0,.34);--overlay-card:#2a2a2d;--overlay-line:rgba(255,255,255,.10);--sec-text:#c8c7c4}
[data-theme="light"]{--overlay-scrim:rgba(0,0,0,.20);--overlay-card:#fff;--overlay-line:rgba(0,0,0,.10);--sec-text:#55565b}
.coll-btn{margin:28px auto 0;max-width:312px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--start-line);background:transparent;color:var(--start-table-text);
  border-radius:17px;font:400 14px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;padding:11px 14px;cursor:pointer;
  transition:transform .12s ease,filter .12s ease}
.coll-btn:active{transform:scale(.97);filter:brightness(.94)}
#done .coll-btn{display:inline-block;margin-top:28px}
.coll-modal{position:fixed;inset:0;top:calc(-1 * env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;padding:18px;
  padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;background:rgba(0,0,0,0);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .18s ease,background-color .18s ease,visibility 0s linear .18s;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
.coll-modal.open{opacity:1;visibility:visible;background:var(--overlay-scrim);transition:opacity .18s ease,background-color .18s ease,visibility 0s}
.coll-card{width:min(520px,100%);max-height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden;background:var(--overlay-card);border:1px solid var(--overlay-line);
  border-radius:24px;padding:6px 22px 14px;text-align:left;color:var(--text);opacity:0;transform:scale(.92);filter:blur(8px);transition:opacity .2s ease,transform .2s ease,filter .2s ease}
.coll-modal.open .coll-card{opacity:1;transform:scale(1);filter:blur(0)}
@media(prefers-reduced-motion:reduce){.coll-modal,.coll-card{transition:none!important}}
.coll-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;min-height:52px}
.coll-title{margin:0;font-size:20px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coll-close{flex:0 0 auto;border:0;background:transparent;color:var(--text);font:400 28px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;padding:8px;margin-right:-8px;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.coll-close:active,.coll-link:active,.coll-row:active{transform:scale(.97);filter:brightness(.94)}
.coll-meta{flex:0 0 auto;margin:0 0 14px;font-size:14px;color:var(--muted)}
.coll-link{border:0;background:none;padding:0;margin:0;color:var(--sec-text);font:inherit;text-decoration:underline;text-decoration-color:var(--overlay-line);text-underline-offset:3px;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.coll-name-input{width:100%;box-sizing:border-box;height:44px;margin:4px 0 0;padding:0 14px;border:1px solid var(--overlay-line);border-radius:14px;background:transparent;color:var(--text);

/* ===== COLLECTION · word form (add / edit one word) (2026-09-26, v2.88) — WORTSCHATZ_COLLECTIONS.md step 4 =====
   Fields = typing-field look (10% outline, 14px corners), 16px text (no iPhone zoom). Word chips: tap = hide this word;
   a chosen chip uses the main-button colours (green stays reserved for "correct"). Error line in the palette red. */
.coll-scroll{flex:1 1 auto;min-height:0;overflow:auto;margin:0 -22px;padding:0 22px 4px;-webkit-overflow-scrolling:touch}

.coll-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 4px;font-size:16px;color:var(--sec-text);cursor:pointer}

.coll-switch input:checked::after{transform:translateX(20px)}

.coll-word.is-btn:active{transform:scale(.99);filter:brightness(.94)}
.coll-form-buttons{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding-top:12px}
.coll-form-buttons .coll-link{align-self:center;padding:10px 12px}
/* ✎ on the answer screen (own words only, 2026-09-26, v2.89): quiet corner button in the details area,
   palette grey at low strength so it doesn't compete with the answer. 44px tap area. */
.editCard{display:none;position:absolute;right:-10px;top:4px;width:44px;height:44px;padding:0;border:0;background:none;color:var(--muted);opacity:.6;
  align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:transform .12s ease,opacity .12s ease}

/* Import (step 5, v2.90): paste box + the format block for the AI */
textarea.coll-paste{min-height:150px;font:400 13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.coll-pre{margin:0;padding:12px 14px;border:1px solid var(--overlay-line);border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;
  font:400 12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sec-text);-webkit-user-select:text;user-select:text}
.coll-text .coll-link{font-size:inherit}
/* New words running out (step 6, v2.92): grey line on the start screen, same grey as the subline */
#start .startNote{margin:-20px 0 28px;font-size:14px;color:var(--muted)}
#start .startNote:empty{display:none}
/* ===== START SCREEN · new order (2026-09-26, v2.93): Wortschatz. → DEINE WÖRTER → Starter-Set · 217 Wörter › →
   Heute: 12 Karten (+ Noch … neue Wörter) → ＋ Use your own words (Starter-Set only) → Starten.
   The collection is a plain text line with › (not a pill, so it isn't mistaken for a table button).
   „Use your own words“ = filled card button like the 10/20/30 buttons; Starten stays the cream main button. */
:root{--start-btn-bg:#2a2a2d;--start-btn-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 14px rgba(0,0,0,.14)}
[data-theme="light"]{--start-btn-bg:#fff;--start-btn-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 14px rgba(0,0,0,.08)}
#start .title{margin-bottom:0}
#start .startLabel{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
#start .coll-line{display:inline-flex;align-items:center;gap:0;max-width:100%;margin:0 0 6px;padding:6px 10px;border:0;border-radius:12px;background:none;color:var(--text);
  font:500 17px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;cursor:pointer;transition:transform .12s ease,filter .12s ease}
#start .coll-line:active{transform:scale(.97);filter:brightness(.94)}
#start .coll-line-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#start .coll-line-count{color:var(--muted);font-weight:400;white-space:pre;flex:0 0 auto}
/* Balance (v2.96): title on top, Starten low (just above „Worum geht's?“), the DEINE WÖRTER block centred between them.
   #start gets its height from JS (layoutStart): from its top down to 36px above the description. */
#start .title{margin-bottom:0}
#start{box-sizing:border-box}
#start .startWords{margin:auto 0;padding:28px 0;display:flex;flex-direction:column;align-items:center}
#start .startWords .subtitle{margin-bottom:0}
#start .startWords .startNote{margin:6px 0 0}
#start .startActions{display:flex;flex-direction:column;align-items:center;width:100%}
#start .coll-line-chev{color:var(--muted);font-size:22px;line-height:1;margin-left:8px;flex:0 0 auto;transform:translateY(-1px)}
#start .subtitle{margin:0 0 28px}
#start .ownWordsBtn{width:312px;max-width:100%;height:52px;margin:0 0 12px;padding:0;border:0;border-radius:16px;background:var(--start-btn-bg);box-shadow:var(--start-btn-shadow);color:var(--text);
  font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;cursor:pointer;transition:transform .12s ease,filter .12s ease}
#start .ownWordsBtn:active{transform:scale(.97);filter:brightness(.94)}
/* Starter-Set window: the word list unfolds below „Show All Words in the Set“ */
.coll-list-below{margin-top:6px;border-bottom:0}
/* Own collection window (v2.95): ＋ Add Word on top, list in the middle, Export · Delete as quiet links at the bottom */
.coll-top{padding-top:2px}
.coll-top .coll-link{align-self:center;padding:10px 12px}
.coll-bottom{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:10px;padding:12px 0 4px;margin:0 -22px;border-top:1px solid var(--overlay-line);font-size:15px}
.coll-bottom .coll-link{padding:6px 4px}
.coll-dot{color:var(--muted)}
.coll-word.is-btn:last-child{border-bottom:0}
</style>
</head>
<body><main class="app">

<script>
// App-side keyboard bridge: the reusable component only emits intent.
document.addEventListener("deutsch-keyboard-input",e=>{
 const k=e.detail?.key||"",input=document.getElementById("answerInput");
 if(!input)return;
 if(k==="BACK"){input.value=input.value.slice(0,-1);return}
 if(k==="OK"){check();return}
 if(k==="SPACE"){if(input.value.length&&!input.value.endsWith(" "))input.value+=" ";return}
 if(k)input.value+=k;
});
function isTouchDevice(){
  return navigator.maxTouchPoints > 0 || window.matchMedia("(pointer: coarse)").matches;
}

document.getElementById("desktopCheck").style.display = isTouchDevice() ? "none" : ""; // $ is defined only in a later script

async function loadKeyboardComponent(){
 const mount=document.getElementById("keyboardMount");
 if(!mount)return false;
 const r=await fetch("../components/deutsch-keyboard-v2.60.html");
 if(!r.ok)throw new Error("Keyboard component failed to load");
 const text=await r.text();
 const tpl=document.createElement("template");
 tpl.innerHTML=text;
 const scripts=[];
 tpl.content.querySelectorAll("script").forEach(s=>{scripts.push(s.textContent);s.remove()});
 mount.appendChild(tpl.content);
 for(const code of scripts){const s=document.createElement("script");s.textContent=code;document.body.appendChild(s);}
 const kb=document.getElementById("keyboard");
 window.deutschKeyboardReady=true;
  kb.classList.add("show"); // component itself stays hidden unless it detected a touch device
 return true;
}
</script>

<script>
const $=id=>document.getElementById(id), STORE="wortsternSRSv03", HOME_STATS="deutschHomeStatsV1";
/* Own word collection (collection.js, 2026-09-26): if the user has one, it replaces the built-in set.
   Everything below (deck, due count, notifications, progress) works on WORDS, so nothing else changes. */
if(window.WortschatzCollection&&WortschatzCollection.isOwn())window.WORDS=WortschatzCollection.cards();

function publishWortschatzStatus(done=false){
  try{
    const today=day();
    /* The due-word rule lives in components/deutsch-wortschatz-due-v1.js (shared with Home).
       If that file didn't load, fall back to counting here the same way. */
    let remaining;
    if(window.DeutschWortschatzDue){
      remaining=DeutschWortschatzDue.count(state,new Set(WORDS.map(c=>c.id))).remaining;
    }else{
      remaining=activeCards().filter(c=>rec(c).due<=today).length;
    }
    const status={
      date:today,
      done:!!done || remaining===0,
      remaining,
      updatedAt:Date.now()
    };
    const home=JSON.parse(localStorage.getItem(HOME_STATS)||"{}");
    home.wortschatz=status;
    localStorage.setItem(HOME_STATS,JSON.stringify(home));
  }catch(e){}
}
// Simple SRS: first success -> tomorrow, then +8, +20, +45, +90 days.
// A mistake resets the card: it stays in today's session until answered correctly, then returns tomorrow.
// Level 6 = FULLY LEARNED: the word also passed the 90-day review (6 correct reviews in a row).
// After level 5 the interval stays 90 days; reaching level 6 only marks the word as learned.
const steps=[1,8,20,45,90];
const LEARNED_LEVEL=steps.length+1;
const INITIAL_WORDS=10, ADD_BATCH=5;
let state={cards:{},activeIds:[]};
try{const saved=JSON.parse(localStorage.getItem(STORE)||"null");if(saved&&saved.cards&&Array.isArray(saved.activeIds))state=saved}catch(e){}
const day=()=>{let d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)}
const add=n=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function save(){localStorage.setItem(STORE,JSON.stringify(state));publishWortschatzProgress()}
// Progress summary for Home (Documentation/PROGRESS_TRACKER.md, section 7):
// total = words in words.js · started = words in the active set · learned = level 6.
function publishWortschatzProgress(){
 try{
   const ids=new Set(WORDS.map(c=>c.id));
   const started=state.activeIds.filter(id=>ids.has(id)).length;
   const learned=state.activeIds.filter(id=>ids.has(id)&&(state.cards[id]?.level||0)>=LEARNED_LEVEL).length;
   let data=null;
   try{data=JSON.parse(localStorage.getItem("deutschProgressV1")||"null")}catch(e){}
   if(!data||typeof data!=="object"||!data.exercises||typeof data.exercises!=="object")data={format:1,exercises:{}};
   const d=new Date();
   const today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
   data.exercises.wortschatz={summary:{kind:"words",total:ids.size,started,learned,sicher:learned,items:ids.size,itemsSicher:learned,updated:today,recent:[]}};
   localStorage.setItem("deutschProgressV1",JSON.stringify(data));
 }catch(e){}
}
function ensureDeck(){
 if(!state.activeIds.length){state.activeIds=WORDS.slice(0,INITIAL_WORDS).map(c=>c.id);save()}
}
function rec(c){
 if(!state.cards[c.id])state.cards[c.id]={level:0,due:day()};
 return state.cards[c.id];
}
let hintsUsed=0,typoUndo=null;
let queue=[],idx=0,current=null,sessionTotal=0,completed=0,failedToday=new Set(),closedToday=new Set();
function normalize(s){return s.trim().toLocaleLowerCase("de-DE").replace(/\s*,\s*/g," ").replace(/\s+/g," ")}
// ===== TYPO TOLERANCE (2026-09-25, see Documentation/DECISIONS.md) =====
// Only for words at level 2+. Levels 0-1 stay strict (exact answer only).
// A close answer never counts as right. It gets a hint (red frame + shake, text stays) and up to 2 more tries.
// After that it is wrong; the "Nur Tippfehler" button keeps the level and brings the word back tomorrow.
const TOLERANT_FROM_LEVEL=2, MAX_HINTS=2;
// Hint texts: short, informal, kind. One picked at random.
const HINT_FIRST=["Sooo nah dran!","Ups, fast! Nochmal?","Die Buchstaben machen Quatsch.","Knapp! Du hast es gleich."];
const HINT_LAST=["Ein Blick noch. Keine Panik.","Einmal noch, ganz in Ruhe."];
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
// Damerau (OSA) distance: missing / extra / wrong letter or two neighbouring letters swapped = 1 slip.
function osa(x,y){
 const a=[...x],b=[...y],d=Array.from({length:a.length+1},(_,i)=>Array(b.length+1).fill(0));
 for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
  const c=a[i-1]===b[j-1]?0:1;
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
 }
 return d[a.length][b.length];
}
// Common learner slips, flattened (sounds the same / known trap). Used ONLY to decide whether to give the hint:
// sch-ch-sh-sc, ß-ss-s, double-single consonant, ck-k, tz-z-ts, silent h, i-ie, v-f-w, ä-e, äu-eu, umlaut dots,
// d-t / b-p / g-k at the end of a word, chs-ks-x, qu-kw, ph-f, th-t, dt-t.
function loose(s){
 return s.replace(/ß/g,"ss").replace(/äu/g,"eu").replace(/ä/g,"e").replace(/ö/g,"o").replace(/ü/g,"u")
  .replace(/chs/g,"ks").replace(/x/g,"ks").replace(/sch/g,"S").replace(/sh|sc|ch/g,"S")
  .replace(/qu/g,"kw").replace(/ph/g,"f").replace(/th/g,"t").replace(/dt/g,"t")
  .replace(/ck/g,"k").replace(/tz|ts/g,"z").replace(/ie/g,"i")
  .replace(/([aeiouy])h(?![aeiouy])/g,"$1").replace(/[vw]/g,"f")
  .replace(/d\b/g,"t").replace(/b\b/g,"p").replace(/g\b/g,"k")
  .replace(/([bcdfgklmnprstz])\1+/g,"$1");
}
const letterCount=s=>s.replace(/\s/g,"").length;
// Slips allowed for the hint: 1-3 letters none (exact only), 4-6 letters 1, 7-10 letters 2, 11+ letters 3.
function slipAllowance(n){return n<=3?0:n<=6?1:n<=10?2:3}
// Another word from the list typed exactly = a mix-up, not a typo -> no hint.
let listAnswers=null;
function isOtherListWord(y,target){
 if(!listAnswers)listAnswers=new Set(WORDS.flatMap(c=>targets(c)).map(normalize));
 return y!==normalize(target)&&listAnswers.has(y);
}
function isClose(typed,target){
 const t=normalize(target),y=typed,n=letterCount(t),allow=slipAllowance(n);
 if(!allow||y===t)return false;
 if(loose(y)[0]!==loose(t)[0])return false;   // the first letter must be right (sch/sh, v/f, ä/e count as the same)
 if(isOtherListWord(y,target))return false;
 // scrambled order: exactly the right letters, 5+ letters
 const sorted=s=>[...s.replace(/\s/g,"")].sort().join("");
 if(n>=5&&sorted(y)===sorted(t))return true;
 const d=Math.min(osa(y,t),osa(loose(y),loose(t)));
 if(letterCount(y)<Math.ceil(n/2)||n-d<Math.ceil(n/2))return false; // at least half the letters right
 if(d<=allow)return true;
 // wrong ending: same beginning, only the last few letters differ
 let p=0;while(p<y.length&&p<t.length&&y[p]===t[p])p++;
 return p>=4&&y.length-p<=3&&t.length-p<=3;
}
function targetParts(c){return (c.target||"").split(" / ").map(x=>x.trim()).filter(Boolean)}
function targets(c){
 const parts=targetParts(c);
 // With several blanks, the slash separates the pieces of ONE separable verb,
 // not alternative answers. The learner types both pieces in one field.
 if((c.blank.match(/_____/g)||[]).length>1)return [parts.join(" ")];
 return parts;
}
function activeCards(){const ids=new Set(state.activeIds);return WORDS.filter(c=>ids.has(c.id))}
const NOTIFICATION_SERVER="https://german-learning-notifications.d45zgw2cgh.workers.dev";
const NOTIFICATION_USER_KEY="deutschNotificationUserIdV1";
const NOTIFICATION_DEVICE_KEY="deutschNotificationDeviceIdV1";

function getNotificationUserId(){
  let id=localStorage.getItem(NOTIFICATION_USER_KEY);
  if(!id){
    try{id=crypto.randomUUID?crypto.randomUUID():"user-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
    catch(e){id="user-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
    localStorage.setItem(NOTIFICATION_USER_KEY,id);
  }
  return id;
}

function getNotificationDeviceId(){
  let id=localStorage.getItem(NOTIFICATION_DEVICE_KEY);
  if(!id){
    try{id=crypto.randomUUID?crypto.randomUUID():"device-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
    catch(e){id="device-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
    localStorage.setItem(NOTIFICATION_DEVICE_KEY,id);
  }
  return id;
}

async function syncNotificationPool(pool){
  try{
    const response=await fetch(NOTIFICATION_SERVER+"/pool",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        userId:getNotificationUserId(),
        deviceId:getNotificationDeviceId(),
        date:pool.date,
        notifications:pool.notifications.map(item=>({
          id:item.id,
          de:item.sentence,
          ru:item.translation
        }))
      })
    });
    if(!response.ok)throw new Error("pool-"+response.status);
    console.log("[German Learning] Notification pool synced:",pool.date);
    return true;
  }catch(e){
    console.warn("[German Learning] Could not sync notification pool:",e);
    return false;
  }
}

async function publishNotificationDone(){
  const event={date:day(),done:true,completedAt:Date.now()};
  try{
    localStorage.setItem("deutschNotificationDoneV1",JSON.stringify(event));
    const response=await fetch(NOTIFICATION_SERVER+"/done",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        userId:getNotificationUserId(),
        deviceId:getNotificationDeviceId(),
        date:event.date
      })
    });
    if(!response.ok)throw new Error("done-"+response.status);
    console.log("[German Learning] DONE synced:",event);
  }catch(e){
    console.warn("[German Learning] Could not sync DONE event:",e);
  }
  return event;
}

function prepareTomorrowNotifications(limit=4){
  const tomorrow=add(1);
  const candidates=activeCards().filter(c=>rec(c).due===tomorrow);
  const shuffled=[...candidates].sort(()=>Math.random()-.5);
  const notifications=shuffled.slice(0,Math.min(4,limit)).map(c=>({
    id:c.id,
    sentence:c.revealed||c.sentence||"",
    translation:getTranslation(c,"sentenceTranslation")
  }));
  const pool={date:tomorrow,notifications,createdAt:Date.now()};
  try{
    localStorage.setItem("deutschNotificationPoolV1",JSON.stringify(pool));
    console.log("[German Learning] Tomorrow notification pool:",pool);
  }catch(e){
    console.warn("[German Learning] Could not save notification pool:",e);
  }
  syncNotificationPool(pool);
  return pool;
}
function build(cards=null){
 ensureDeck();
 queue=(cards||activeCards().filter(c=>rec(c).due<=day())).sort(()=>Math.random()-.5);
 idx=0;sessionTotal=queue.length;completed=0;failedToday=new Set();closedToday=new Set();
 publishWortschatzStatus(queue.length===0);
 publishWortschatzProgress();
 render();
}
function blankHTML(c){return c.blank.replace(/_____/g,"<span class='blank' aria-label='missing word'></span>")}
function revealHTML(c){
 let escaped=c.revealed.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const ts=targetParts(c); for(const t of ts){let e=t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");escaped=escaped.replace(new RegExp(e),"<span class='target'>"+t+"</span>")}
 return escaped;
}
function render(){
 if(idx>=queue.length){showDone();return}
 current=queue[idx];$("counter").textContent=`${completed} / ${sessionTotal} heute`;$("bar").style.width=`${sessionTotal?completed/sessionTotal*100:100}%`;
 $("sentence").innerHTML=blankHTML(current);$("translation").textContent=getTranslation(current,"sentenceTranslation");$("answerInput").value="";
 hintsUsed=0;typoUndo=null;$("answerInput").classList.remove("almost","nudge");$("almostHint").classList.remove("show");$("almostHint").textContent="";
 $("typoBtn").textContent="Nur Tippfehler";$("typoBtn").disabled=false;$("typoBtn").classList.remove("done");
 $("question").classList.remove("hidden");$("feedback").className="feedback";$("feedbackShell").className="feedbackShell";$("feedbackShell").style.transform="";$("feedbackShell").style.opacity="";
  if(window.deutschKeyboardReady){$("keyboard").classList.add("show");}
 if(innerWidth>=700)setTimeout(()=>$("answerInput").focus(),30);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function diffHTML(typed,correct){
 const a=[...typed],b=[...correct],m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m;i>=0;i--)for(let j=n;j>=0;j--){if(i===m)dp[i][j]=n-j;else if(j===n)dp[i][j]=m-i;else if(a[i]===b[j])dp[i][j]=dp[i+1][j+1];else dp[i][j]=1+Math.min(dp[i+1][j+1],dp[i+1][j],dp[i][j+1])}
 let i=0,j=0,top=[],bottom=[];
 while(i<m||j<n){
  if(i<m&&j<n&&a[i]===b[j]){top.push(`<span class="diffSame">${esc(a[i])}</span>`);bottom.push(`<span class="diffSame">${esc(b[j])}</span>`);i++;j++;continue}
  const sub=i<m&&j<n?dp[i+1][j+1]:1e9,del=i<m?dp[i+1][j]:1e9,ins=j<n?dp[i][j+1]:1e9;
  if(sub<=del&&sub<=ins){top.push(`<span class="diffWrong">${esc(a[i])}</span>`);bottom.push(`<span class="diffMissing">${esc(b[j])}</span>`);i++;j++}
  else if(del<=ins){top.push(`<span class="diffWrong">${esc(a[i])}</span>`);i++}
  else{bottom.push(`<span class="diffMissing">${esc(b[j])}</span>`);j++}
 }
 return [top.join(""),bottom.join("")];
}
function check(){
 let typed=normalize($("answerInput").value);if(!typed)return;
 const opts=targets(current), matched=opts.find(t=>normalize(t)===typed);
 let ok=!!matched;
 const r=rec(current);
 const tolerant=(r.level||0)>=TOLERANT_FROM_LEVEL&&!failedToday.has(current.id);
 if(!ok&&tolerant&&hintsUsed<MAX_HINTS&&opts.some(t=>isClose(typed,t))){
   hintsUsed++;
   $("almostHint").textContent=pickOne(hintsUsed>=MAX_HINTS?HINT_LAST:HINT_FIRST);$("almostHint").classList.add("show");
   const f=$("answerInput");f.classList.add("almost");f.classList.remove("nudge");void f.offsetWidth;f.classList.add("nudge");
   return;
 }
 // For an error, compare against the closest accepted answer so the highlighted difference is useful.
 let correct=opts[0]||"";
 if(!ok&&opts.length>1){
   const distance=(x,y)=>{const a=[...normalize(x)],b=[...normalize(y)],d=Array.from({length:a.length+1},(_,i)=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
   correct=[...opts].sort((x,y)=>distance(typed,x)-distance(typed,y))[0];
 } else if(ok) correct=matched;
 $("question").classList.add("hidden");$("keyboard").classList.remove("show");$("feedbackShell").className="feedbackShell show";$("feedback").className="feedback show "+(ok?"good":"bad");$("answerSentence").innerHTML=revealHTML(current);
 $("answerTranslation").textContent=getTranslation(current,"sentenceTranslation");
 let displayCorrect=normalize(correct);
 if(current&&/^(der|die|das)\\s/i.test(String(current.base||""))){
   displayCorrect=displayCorrect.charAt(0).toLocaleUpperCase("de-DE")+displayCorrect.slice(1);
 }
 $("targetForm").textContent=displayCorrect;
 $("targetForm").style.display=ok?"inline-block":"none";
 if(!ok){const [top,bottom]=diffHTML(typed,normalize(correct));$("typedDiff").innerHTML=top;$("correctDiff").innerHTML=bottom}else{$("typedDiff").innerHTML="";$("correctDiff").innerHTML=""}
 $("base").textContent=current.base;$("meaning").textContent=getTranslation(current,"translation");$("grammar").textContent=getTranslation(current,"grammar");
 if(ok){
   if(failedToday.has(current.id)){r.level=0;r.due=add(1)}
   else{r.level=Math.min(r.level+1,LEARNED_LEVEL);r.due=add(steps[Math.min(r.level-1,steps.length-1)])}
   if(!closedToday.has(current.id)){closedToday.add(current.id);completed++}
 } else {
   typoUndo=tolerant?{id:current.id,level:r.level}:null;
   if(typoUndo)$("feedbackShell").classList.add("canTypo");
   failedToday.add(current.id);
   r.level=0;r.due=day();
   // Reinsert once at the end. It remains one of today's unique cards, so the total never grows.
   if(!queue.slice(idx+1).some(c=>c.id===current.id))queue.push(current);
 }
 save();
 publishWortschatzStatus();
 updateEditButton();
}
/* ✎ on the answer screen (own words only): edit the card you're looking at. The session keeps running —
   the corrected text shows at once; WORDS and the queue hold the same card objects, so a card that
   comes back later in this round is already corrected. Progress is not touched. */
function updateEditButton(){
 const b=$("editCard");if(!b)return;
 b.classList.toggle("own",!!(current&&window.WortschatzCollectionWindow&&String(current.id).charAt(0)==="u"));
}
function applyEditedCard(fresh){
 if(!current||!fresh||fresh.id!==current.id)return;
 Object.assign(current,fresh);
 $("answerSentence").innerHTML=revealHTML(current);
 $("answerTranslation").textContent=getTranslation(current,"sentenceTranslation");
 $("base").textContent=current.base;$("meaning").textContent=getTranslation(current,"translation");$("grammar").textContent=getTranslation(current,"grammar");
 if($("targetForm").style.display!=="none")$("targetForm").textContent=normalize(targets(current).join(" "));
}
if($("editCard"))$("editCard").onclick=e=>{e.stopPropagation();if(current)WortschatzCollectionWindow.editInSession(current,applyEditedCard)};
function showDone(){
 publishWortschatzStatus(true);
 if(sessionTotal>0){
   publishNotificationDone();
   prepareTomorrowNotifications();
 }
 $("study").style.display="none";$("done").className="done show";$("counter").textContent=`${sessionTotal} / ${sessionTotal} heute`;$("bar").style.width="100%";
 $("doneScore").textContent=sessionTotal?`${sessionTotal} / ${sessionTotal} geschafft`:"Gerade ist nichts fällig.";
 /* New words (step 6, 2026-09-26): the button says how many it really adds (+ 3 neue Wörter / + 1 neues Wort);
    with 6–10 left, a grey line „Noch 8 neue Wörter“ (start screen: 1–10); with none left, an own collection gets
    „+ Neue Wörter“ (opens the collection window to add or import), the built-in set keeps „Alle Wörter sind schon dabei.“ */
 const remaining=newWordsLeft();
 const own=!!(window.WortschatzCollection&&WortschatzCollection.isOwn()&&window.WortschatzCollectionWindow);
 const btn=$("addWords"),note=$("allAdded");
 if(remaining){
   btn.textContent=remaining>=ADD_BATCH?"+ "+ADD_BATCH+" neue Wörter":"+ "+newWordsLabel(remaining);
   btn.style.display="block";
   // the line only adds something when the button says „+ 5“ (with fewer than 5 the button already says the number)
   const showNote=remaining>ADD_BATCH&&remaining<=10;
   note.textContent=showNote?"Noch "+newWordsLabel(remaining)+".":"";note.style.display=showNote?"block":"none";
 }else if(own){
   btn.textContent="+ Neue Wörter";btn.style.display="block";
   note.textContent="Alle Wörter sind schon dabei.";note.style.display="block";
 }else{
   btn.style.display="none";note.textContent="Alle Wörter sind schon dabei.";note.style.display="block";
 }
}
function newWordsLeft(){const ids=new Set(state.activeIds);return WORDS.filter(c=>!ids.has(c.id)).length}
function newWordsLabel(n){return n===1?"1 neues Wort":n+" neue Wörter"}
function addFive(){
 const fresh=WORDS.filter(c=>!state.activeIds.includes(c.id)).slice(0,ADD_BATCH);if(!fresh.length)return;
 fresh.forEach(c=>{state.activeIds.push(c.id);state.cards[c.id]={level:0,due:day()}});save();publishWortschatzStatus(false);
 $("done").className="done";$("study").style.display="flex";build(fresh);
}
function next(){idx++;render()}
// "Nur Tippfehler": undo the reset. The word keeps its level and comes back TOMORROW as a check
// (not after its level's interval). Tomorrow correct -> it moves up normally.
function markTypo(){
 if(!typoUndo||!current||typoUndo.id!==current.id)return;
 const r=rec(current);r.level=typoUndo.level;r.due=add(1);
 failedToday.delete(current.id);
 const j=queue.findIndex((c,k)=>k>idx&&c.id===current.id);if(j>-1)queue.splice(j,1);
 if(!closedToday.has(current.id)){closedToday.add(current.id);completed++}
 typoUndo=null;save();publishWortschatzStatus();
 $("typoBtn").textContent="Kommt morgen wieder";$("typoBtn").disabled=true;$("typoBtn").classList.add("done");
}
$("typoBtn").onclick=markTypo;
$("addWords").onclick=()=>{if(newWordsLeft())addFive();else if(window.WortschatzCollectionWindow)WortschatzCollectionWindow.open()};
$("desktopCheck").onclick=check;$("continue").onclick=next;
document.addEventListener("keydown",e=>{
 if(e.key!=="Enter"||innerWidth<700)return;
 if(!$("feedback").classList.contains("show"))return;
 e.preventDefault();next();
});
$("answerInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();check()}});
function speakCurrent(){
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(current.revealed);
 u.lang="de-DE";u.rate=.88;
 speechSynthesis.speak(u);
}
$("feedback").addEventListener("click",e=>{
  if(e.target.closest("#answerTop,#speakTop"))speakCurrent();
});
/* START SCREEN (2026-09-26): the session no longer starts on load.
   Cards due -> start screen with today's count; Starten -> the same build() as before.
   Nothing due -> straight to "Fertig für heute", exactly as before.
   The keyboard loads in the background; render() shows it once it's ready. */
const START_ABOUT={text:{
  en:"Helps you remember words in real sentences. Each word comes back just before you'd forget it - and less and less often over time.",
  ru:"Помогает запоминать слова в живых предложениях. Каждое слово возвращается как раз перед тем, как забудется, - и со временем всё реже."}};
$("aboutText").textContent=getTranslation(START_ABOUT,"text");
function dueCount(){return activeCards().filter(c=>rec(c).due<=day()).length}
function cardsLabel(n){return n===1?"1 Karte":n+" Karten"}
function showStart(){
 ensureDeck();
 const n=dueCount();
 publishWortschatzStatus(n===0);
 publishWortschatzProgress();
 if(!n){build();return}                       // nothing due -> "Fertig für heute" as before
 $("startCount").textContent="Heute: "+cardsLabel(n);
 const left=newWordsLeft();$("startNote").textContent=left&&left<=10?"Noch "+newWordsLabel(left):"";

/* Start screen height (v2.96): fill the space down to the „Worum geht's?“ description, so Starten sits low
   and the DEINE WÖRTER block is centred between the title and the buttons (flex + margin:auto). */
function layoutStart(){
 const st=$("start"),about=$("startAbout");if(!st||!st.classList.contains("show"))return;
 st.style.minHeight="";
 const top=st.getBoundingClientRect().top,aboutTop=about?about.getBoundingClientRect().top:innerHeight;
 st.style.minHeight=Math.max(0,Math.round(aboutTop-top-36))+"px";

addEventListener("resize",layoutStart);

 build();
}
$("startBtn").onclick=startSession;
showStart();
// Desktop: Enter on the start screen = Starten
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&$("start").classList.contains("show")){e.preventDefault();startSession()}});
loadKeyboardComponent().catch(e=>console.error(e));

function goBackToHome(){
  try{
    if(window.parent && window.parent!==window){
      if(typeof window.parent.closeApp==="function"){window.parent.closeApp();return;}
      const parentDoc=window.parent.document;
      const shell=parentDoc.getElementById("appShell");
      const frame=parentDoc.getElementById("appFrame");
      if(shell && frame){
        shell.classList.remove("open");shell.setAttribute("aria-hidden","true");
        parentDoc.documentElement.classList.remove("app-open");frame.src="about:blank";return;
      }
    }
  }catch(e){}
  window.parent.postMessage({type:"deutsch:home"},"*");
}
document.getElementById("homeBack").onclick=goBackToHome;
