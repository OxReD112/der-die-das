<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Partizip II.</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verbformen" />
    <link rel="stylesheet" href="partizipII.css?v=3" />
  </head>
  <body>
    <main class="app">
      <section id="start">
        <h1 class="title">Partizip II.</h1>
        <p class="subtitle">Wie viele Verben?</p>
        <div class="choices">
          <button class="choice" data-size="10">10</button>
          <button class="choice" data-size="20">20</button>
          <button class="choice" data-size="30">30</button>
        </div>
        <button class="pattern-table-btn" data-pattern-table>Vokalwechsel · Tabelle</button>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>

      <section id="study" class="hidden">
        <div class="top"><span class="brand">Partizip II.</span><span id="count"></span></div>
        <div class="progress"><i id="bar"></i></div>
        <section class="card">
          <div id="verb"></div>
          <div class="translation" id="translation"></div>
          <input
            id="answer"
            placeholder=" "
            aria-label="Fehlende Form"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="done"
          />
          <button id="check">Prüfen</button>
          <div class="result" id="result">
            <div class="result-head">
              <div class="state" id="state"></div>
              <div class="vowel-pattern" id="vowelPattern"></div>
            </div>
            <div class="forms" id="forms"></div>
            <div class="meta" id="meta"></div>
            <div class="example" id="example"></div>
          </div>
          <button id="next">Weiter</button>
        </section>
        <div id="keyboardMount"></div>
        <div class="in-session-pattern">
          <button class="pattern-table-btn" data-pattern-table>Vokalwechsel · Tabelle</button>
        </div>
      </section>

      <section id="finish" class="hidden">
        <h2>Fertig.</h2>
        <div id="finalScore" class="final-score"></div>
        <p id="summary"></p>
        <div class="finish-actions">
          <button id="playAgain">Noch eine Runde</button>
          <button id="homeBack">Zur Startseite</button>
        </div>
      </section>

      <div id="patternModal" class="pattern-modal" aria-hidden="true">
        <div class="pattern-modal-card" role="dialog" aria-modal="true" aria-labelledby="patternModalTitle">
          <div class="pattern-modal-head">
            <h2 id="patternModalTitle">Partizip II · Vokalwechsel</h2>
            <button class="pattern-close" id="patternClose" aria-label="Schließen">×</button>
          </div>
          <div id="patternModalBody"></div>
        </div>
      </div>
      <div class="version-mark">v57</div>
    </main>

    <script src="../../components/deutsch-translation-v1.js?v=2"></script>
    <script src="verbs.js?v=5"></script>
    <script src="../../components/deutsch-progress-v1.js"></script>
    <script src="partizipII.js?v=2"></script>
  </body>
</html>
