<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stimmen-Check · Deutsch.</title>
<style>
/* 11.11 (Alena): TEMPORARY check page — which German voices this browser shows to web pages, which one the app
   picks (the same rule as components/deutsch-voice-v1.js / v2.js), and how each sounds. Not linked from the app. */
@font-face { font-family: "Inter"; src: url("../fonts/inter.woff") format("woff"); font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #1c1c1e; --surface: #2a2a2d; --line: rgba(255,255,255,.1);
  --text: #f0efec; --muted: #c8c7c4; --faint: rgba(255,255,255,.5); --mint: #5bc8a4;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
body {
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.card { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.summary { font-size: 15px; }
.summary b { color: var(--mint); font-weight: 600; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.voice { flex: 1; min-width: 0; }
.name { font-weight: 500; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.chosen .name { color: var(--mint); }
.tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: color-mix(in srgb, var(--mint) 20%, transparent); color: var(--mint); vertical-align: 1px; }
button { font: 500 14px var(--font); color: var(--text); background: transparent; border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.play { flex: none; width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
.play svg { width: 16px; height: 16px; fill: currentColor; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.03);
  color: var(--text); font: 16px/1.4 var(--font); padding: 10px; resize: vertical; }
pre { margin: 0; font-size: 11px; color: var(--faint); white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Stimmen-Check</h1>
    <p class="sub">Какие немецкие голоса этот браузер показывает сайтам и какой из них выбирает приложение.</p>
  </header>

  <section class="card">
    <span class="label">Итог</span>
    <div class="summary" id="summary">Загружаю список голосов…</div>
  </section>

  <section class="card">
    <label class="label" for="sample">Фраза для прослушивания</label>
    <textarea id="sample">Es war einmal eine alte Geiß, die hatte sieben junge Geißlein.</textarea>
  </section>

  <section class="card">
    <span class="label">Немецкие голоса</span>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <span class="label">Для Claude</span>
    <p class="note">Кнопка копирует весь список голосов (и других языков) — вставьте его в чат.</p>
    <div class="row"><button id="copy" type="button">Скопировать список</button><button id="reload" type="button">Обновить</button></div>
    <pre id="raw" hidden></pre>
  </section>
</main>
<script>
(() => {
  const synth = "speechSynthesis" in window ? speechSynthesis : null;
  const $ = id => document.getElementById(id);
  // Same rule as components/deutsch-voice-v1.js / v2.js.
  function score(v) {
    const id = `${v.voiceURI || ""} ${v.name || ""}`;
    let s = 0;
    if (/premium/i.test(id)) s += 40;
    else if (/enhanced|erweitert|verbessert|улучш/i.test(id)) s += 30;
    if (/eloquence/i.test(v.voiceURI || "")) s -= 50;
    if (/^de[-_]DE$/i.test(v.lang || "")) s += 4;
    if (v.localService) s += 2;
    return s;
  }
  const quality = v => {
    const id = `${v.voiceURI || ""} ${v.name || ""}`;
    if (/premium/i.test(id)) return "Premium";
    if (/enhanced|erweitert|verbessert|улучш/i.test(id)) return "Enhanced";
    if (/eloquence/i.test(v.voiceURI || "")) return "Eloquence (шуточный)";
    if (/compact/i.test(v.voiceURI || "")) return "Compact (базовый)";
    return "обычный";
  };
  function speak(v) {
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance($("sample").value.trim() || "Guten Tag.");
    u.voice = v; u.lang = v.lang; u.rate = 0.88;
    synth.speak(u);
  }
  function render() {
    const all = synth ? synth.getVoices() : [];
    const de = all.filter(v => /^de([-_]|$)/i.test(v.lang || ""));
    let best = null, bestScore = -Infinity;
    for (const v of de) { const s = score(v); if (s > bestScore) { bestScore = s; best = v; } }
    const list = $("list");
    list.replaceChildren();
    for (const v of de) {
      const li = document.createElement("li");
      if (v === best) li.className = "chosen";
      const box = document.createElement("div"); box.className = "voice";
      const name = document.createElement("div"); name.className = "name"; name.textContent = v.name;
      if (v === best) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "выбран"; name.append(t); }
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = `${quality(v)} · ${v.lang} · ${v.localService ? "на устройстве" : "онлайн"} · ${v.voiceURI}`;
      box.append(name, meta);
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "play";
      btn.setAttribute("aria-label", `Прослушать ${v.name}`);
      btn.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
      btn.addEventListener("click", () => speak(v));
      li.append(box, btn);
      list.append(li);
    }
    const better = de.filter(v => /premium|enhanced|erweitert|verbessert|улучш/i.test(`${v.voiceURI} ${v.name}`)).length;
    $("summary").innerHTML = !synth ? "Этот браузер не умеет синтез речи."
      : !all.length ? "Браузер пока не отдал список голосов. Нажмите «Обновить» через пару секунд."
      : !de.length ? `Немецких голосов нет (всего голосов: ${all.length}).`
      : `Немецких голосов: <b>${de.length}</b>, из них улучшенных (Enhanced / Premium): <b>${better}</b>.<br>Приложение выбирает: <b>${best.name}</b> (${quality(best)}).`;
    const lines = [navigator.userAgent, `всего голосов: ${all.length}`, "", ...all.map(v =>
      `${/^de([-_]|$)/i.test(v.lang || "") ? (v === best ? "★ " : "• ") : "  "}${v.name} | ${v.lang} | ${v.localService ? "local" : "online"} | ${v.voiceURI}`)];
    $("raw").textContent = lines.join("\n");
  }
  $("copy").addEventListener("click", async () => {
    const text = $("raw").textContent;
    try { await navigator.clipboard.writeText(text); $("copy").textContent = "Скопировано"; }
    catch (e) { $("raw").hidden = false; const r = document.createRange(); r.selectNodeContents($("raw")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copy").textContent = "Выделено — скопируйте"; }
    setTimeout(() => { $("copy").textContent = "Скопировать список"; }, 2500);
  });
  $("reload").addEventListener("click", render);
  if (synth) synth.addEventListener?.("voiceschanged", render);
  render();
  [300, 1000, 3000].forEach(ms => setTimeout(render, ms));
})();
</script>
</body>
</html>
