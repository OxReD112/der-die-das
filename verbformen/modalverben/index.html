<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (localStorage.getItem("deutschThemeV1") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Modalverben.</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Modalverben" />
    <link rel="stylesheet" href="modalverben.css?v=10" />
  </head>
  <body>
    <div id="formsModal" class="forms-modal" aria-hidden="true">
      <div class="forms-modal-card" role="dialog" aria-modal="true" aria-labelledby="formsModalTitle">
        <div class="forms-modal-head">
          <h2 id="formsModalTitle">Modalverben · Formen</h2>
          <button class="forms-close" id="formsClose" type="button" aria-label="Schließen">×</button>
        </div>
        <div id="formsModalBody"></div>
      </div>
    </div>
    <main class="app">
      <section id="start">
        <h1 class="title">Modalverben.</h1>
        <p class="subtitle">Wie viele Sätze?</p>
        <div class="choices">
          <button class="choice" data-size="10">10</button>
          <button class="choice" data-size="20">20</button>
          <button class="choice" data-size="30">30</button>
        </div>
        <button class="forms-table-btn" type="button" data-forms-table="full">Formen · Tabelle</button>
      </section>

      <section id="study" class="hidden">
        <div class="top"><span class="brand">Modalverben.</span><span id="count"></span></div>
        <div class="progress"><i id="bar"></i></div>
        <section class="card">
          <div id="verb"></div>
          <div class="sentence" id="sentence"></div>
          <div class="translation" id="translation"></div>
          <div class="answer-area" id="answer-area">
            <input
              id="answer"
              placeholder=" "
              aria-label="Fehlende Form"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="done"
            />
            <button id="check">Prüfen</button>
          </div>
          <div class="result" id="result">
            <div class="state" id="state"></div>
            <div class="form-line" id="formLine"></div>
            <div class="form-kind" id="formKind"></div>
            <div class="explanation" id="explanation"></div>
          </div>
          <button id="next">Weiter</button>
        </section>
        <div id="keyboardMount"></div>
        <div class="in-session-forms">
          <button class="forms-table-btn" type="button" id="roundTableBtn" data-forms-table="verb" disabled>
            Formen · Tabelle
          </button>
        </div>
      </section>

      <section id="finish" class="hidden">
        <h2>Fertig.</h2>
        <div id="finalScore" class="final-score"></div>
        <p id="summary"></p>
        <div class="finish-actions">
          <button id="playAgain">Noch eine Runde</button>
          <button id="homeBack">Zur Startseite</button>
        </div>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>
      <div class="version-mark" aria-hidden="true">v22</div>
    </main>

    <script src="../../components/deutsch-translation-v1.js?v=2"></script>
    <script src="special_verbs.js?v=6"></script>
    <script src="../../components/deutsch-progress-v1.js"></script>
    <script src="modalverben.js?v=10"></script>
    <script src="../../components/deutsch-wide-v1.js?v=2"></script>
</body>
</html>
