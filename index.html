<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1d">
  <title>Deutsch</title>
  <style>
    :root{--bg:#1b1b1d;--text:#f2f0ed;--muted:#8f8f94;--line:#303034;--mint:#55d7b5}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 28px) max(24px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 32px) max(24px,env(safe-area-inset-left))}
    .page{width:min(100%,720px);margin:0 auto}
    header{margin-bottom:52px}
    h1{margin:0;font-size:32px;line-height:1;letter-spacing:-.7px;font-weight:750}
    .rule{height:4px;width:100%;margin-top:18px;background:var(--line);border-radius:99px;overflow:hidden}
    .rule:before{content:"";display:block;width:18%;height:100%;background:var(--mint);border-radius:99px}
    .intro{margin:0 0 26px;color:var(--muted);font-size:15px;line-height:1.4}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 20px}
    .module{display:block;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
    .icon-wrap{width:100%;aspect-ratio:1;border-radius:25%;overflow:hidden;background:#202023;box-shadow:0 15px 38px rgba(0,0,0,.18);transition:transform .12s ease,opacity .12s ease}
    .module:active .icon-wrap{transform:scale(.975);opacity:.88}
    .icon-wrap img{display:block;width:100%;height:100%;object-fit:cover}
    .name{margin-top:11px;font-size:17px;line-height:1.2;font-weight:650;text-align:center;letter-spacing:-.15px}
    .status{min-height:16px;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.2;text-align:center}
    @media(min-width:650px){body{padding-top:48px}header{margin-bottom:62px}.grid{gap:34px 28px}.name{font-size:18px}}
    @media(max-width:360px){body{padding-left:20px;padding-right:20px}.grid{gap:22px 16px}.name{font-size:16px}}
  
/* Home v2 */
header{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 22px);
  left:max(24px, env(safe-area-inset-left));
  right:max(24px, env(safe-area-inset-right));
  z-index:20;
  margin:0;
  padding:0;
  background:var(--bg);
}
.rule{display:none!important}

.page{
  padding-top:76px;
}

.grid{
  grid-template-columns:repeat(2, minmax(0, 150px));
  justify-content:center;
  gap:28px 28px;
}

.icon-wrap{
  width:100%;
  max-width:150px;
  margin:0 auto;
}

@media(max-width:430px){
  .grid{
    grid-template-columns:repeat(2, minmax(0, 118px));
    gap:26px 24px;
  }
  .icon-wrap{max-width:118px}
}

@media(max-width:360px){
  .grid{
    grid-template-columns:repeat(2, minmax(0, 108px));
    gap:24px 20px;
  }
  .icon-wrap{max-width:108px}
}


/* Home v2.2 — desktop alignment + 3-column modules */
header{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 22px);
  left:50%;
  right:auto;
  width:min(calc(100% - 48px),720px);
  transform:translateX(-50%);
  z-index:20;
  margin:0;
  padding:0;
  background:var(--bg);
}

.intro{
  text-align:center;
}

.grid{
  grid-template-columns:repeat(3, minmax(0, 118px));
  justify-content:center;
  gap:28px 26px;
}

.icon-wrap{
  width:100%;
  max-width:118px;
  margin:0 auto;
}

@media(max-width:430px){
  header{
    width:calc(100% - 48px);
  }
  .grid{
    grid-template-columns:repeat(3, minmax(0, 92px));
    gap:24px 16px;
  }
  .icon-wrap{max-width:92px}
  .name{font-size:15px}
}

@media(max-width:350px){
  .grid{
    grid-template-columns:repeat(3, minmax(0, 82px));
    gap:22px 12px;
  }
  .icon-wrap{max-width:82px}
  .name{font-size:14px}
}


/* Home v2.3 — embedded exercise shell */
.module{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  padding:0;
  margin:0;
  background:none;
  font:inherit;
  cursor:pointer;
}

.app-open,
.app-open body{
  overflow:hidden;
  height:100%;
}

.app-shell{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  background:#1b1b1d;
}

.app-shell.open{
  display:block;
}

.app-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#1b1b1d;
}

.home-back{
  position:absolute;
  z-index:1001;
  top:calc(env(safe-area-inset-top) + 8px);
  left:max(10px, env(safe-area-inset-left));
  width:42px;
  height:42px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(27,27,29,.78);
  color:#f2f0ed;
  font:300 38px/36px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  text-align:center;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  cursor:pointer;
}


/* Home v2.4 */
header h1{
  text-align:center;
}

.home-version{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 10px);
  z-index:10;
  text-align:center;
  color:#55555a;
  font-size:11px;
  line-height:1;
  letter-spacing:.35px;
  pointer-events:none;
}


/* Home v2.5 — subtle floating Home control */
.home-back{
  top:auto!important;
  right:auto!important;
  bottom:calc(env(safe-area-inset-bottom) + 12px)!important;
  left:max(12px, env(safe-area-inset-left))!important;
  width:44px!important;
  height:44px!important;
  padding:0!important;
  border:1px solid rgba(255,255,255,.07)!important;
  border-radius:50%!important;
  background:rgba(27,27,29,.58)!important;
  color:rgba(242,240,237,.52)!important;
  font:400 22px/42px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif!important;
  text-align:center!important;
  -webkit-backdrop-filter:blur(10px)!important;
  backdrop-filter:blur(10px)!important;
  box-shadow:none!important;
}

/* On wider screens, align it with the left edge of the embedded app area
   rather than the browser window edge. */
@media(min-width:529px){
  .home-back{
    left:calc(50% - 240px + 12px)!important;
  }
}


/* Home v2.6 — wider home glyph */
.home-back{
  font-stretch:expanded;
}
.home-back::first-letter{
  /* fallback handled by transform on the button's text rendering */
}
.home-back{
  text-indent:0;
}

.home-glyph{
  display:inline-block;
  transform:scaleX(1.28);
  transform-origin:center;
}


/* Home v2.7 — daily dashboard */
.today{
  width:min(100%, 520px);
  margin:42px auto 0;
  padding-top:24px;
  border-top:1px solid rgba(255,255,255,.08);
}
.today-title{
  margin:0 0 15px;
  font-size:14px;
  font-weight:600;
  color:#d8d6d2;
}
.today-row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:6px 0;
  color:#8f8f94;
  font-size:13px;
  line-height:1.35;
}
.today-row strong{
  color:#d8d6d2;
  font-weight:500;
}
.today-total{
  margin-top:15px;
  color:#6f6f74;
  font-size:12px;
  text-align:center;
}


/* Home v3.0 — vertical dashboard */
.intro{
  text-align:center;
  margin-bottom:28px;
}

.grid.module-list{
  display:flex!important;
  flex-direction:column;
  width:min(100%, 420px);
  margin:0 auto;
  gap:12px!important;
}

.module-list .module{
  width:100%;
  display:grid!important;
  grid-template-columns:72px 1fr;
  align-items:center;
  gap:18px;
  text-align:left;
  padding:5px 0;
}

.module-list .icon-wrap{
  width:72px!important;
  max-width:72px!important;
  height:72px;
  margin:0!important;
  border-radius:20px;
}

.module-list .module-copy{
  min-width:0;
}

.module-list .name{
  margin:0;
  text-align:left;
  font-size:18px;
  line-height:1.15;
  font-weight:650;
}

.module-list .status{
  min-height:0;
  margin-top:5px;
  text-align:left;
  color:var(--muted);
  font-size:13px;
  line-height:1.2;
}

.daily-score{
  width:min(100%, 420px);
  margin:34px auto 0;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.08);
  text-align:center;
}

.daily-label{
  color:#d8d6d2;
  font-size:13px;
  font-weight:600;
}

.daily-number{
  margin-top:7px;
  color:#8f8f94;
  font-size:14px;
}

.daily-progress{
  width:180px;
  height:3px;
  margin:13px auto 0;
  overflow:hidden;
  border-radius:99px;
  background:rgba(255,255,255,.08);
}

.daily-progress-fill{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:var(--mint);
  transition:width .25s ease;
}

/* Hide the old dashboard styles/content if any survive from v2.7. */
.today{display:none!important}

@media(max-width:430px){
  .grid.module-list,
  .daily-score{
    width:min(100%, 340px);
  }
  .module-list .module{
    grid-template-columns:64px 1fr;
    gap:16px;
  }
  .module-list .icon-wrap{
    width:64px!important;
    max-width:64px!important;
    height:64px;
    border-radius:18px;
  }
}


/* Home v3.1 — compact 2-column icon grid */
.grid.module-list{
  display:grid!important;
  grid-template-columns:repeat(2, minmax(0, 1fr))!important;
  width:min(100%, 420px);
  margin:0 auto;
  gap:25px 24px!important;
}

.module-list .module{
  width:100%;
  display:flex!important;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:0;
  padding:0;
  text-align:center;
}

.module-list .icon-wrap{
  width:96px!important;
  max-width:96px!important;
  height:96px!important;
  margin:0 auto!important;
  border-radius:24px;
}

.module-list .module-copy{
  width:100%;
  margin-top:9px;
}

.module-list .name{
  margin:0;
  text-align:center;
  font-size:16px;
  line-height:1.15;
  font-weight:650;
}

.module-list .status{
  min-height:15px;
  margin-top:4px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.15;
}

.daily-score{
  width:min(100%, 420px);
  margin:29px auto 0;
  padding-top:17px;
  border-top:1px solid rgba(255,255,255,.08);
  text-align:center;
}

.daily-label{
  display:inline;
  color:#d8d6d2;
  font-size:13px;
  font-weight:600;
}

.daily-number{
  display:inline;
  margin:0 0 0 7px;
  color:#8f8f94;
  font-size:13px;
}

.daily-progress{
  width:180px;
  height:3px;
  margin:11px auto 0;
}

@media(max-width:430px){
  .grid.module-list{
    width:min(100%, 330px);
    gap:22px 20px!important;
  }
  .module-list .icon-wrap{
    width:92px!important;
    max-width:92px!important;
    height:92px!important;
    border-radius:23px;
  }
  .daily-score{
    width:min(100%, 330px);
  }
}

@media(max-height:700px){
  .grid.module-list{gap:17px 20px!important}
  .module-list .icon-wrap{
    width:82px!important;
    max-width:82px!important;
    height:82px!important;
    border-radius:21px;
  }
  .daily-score{margin-top:20px;padding-top:14px}
}


/* Home v3.2 — dashboard concept */
.dashboard{
  width:min(100%, 430px);
  margin:0 auto;
}
.vocab-hero{
  position:relative;
  width:100%;
  min-height:150px;
  display:grid!important;
  grid-template-columns:150px 1fr 30px;
  align-items:center;
  gap:10px;
  padding:12px 18px 12px 8px!important;
  overflow:hidden;
  border:1px solid rgba(105,225,190,.22)!important;
  border-radius:30px!important;
  background:
    radial-gradient(circle at 16% 82%, rgba(64,225,192,.16), transparent 38%),
    radial-gradient(circle at 92% 15%, rgba(255,100,93,.12), transparent 42%),
    rgba(255,255,255,.018)!important;
  text-align:left!important;
}
.vocab-art{
  width:145px;
  height:145px;
}
.vocab-art img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:28px;
}
.vocab-copy .name{
  font-size:20px!important;
  font-weight:650;
  text-align:left!important;
}
.vocab-copy .status{
  margin-top:7px;
  font-size:14px!important;
  color:var(--muted);
  text-align:left!important;
}
.hero-arrow{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  color:#d9d7d2;
  font-size:25px;
  font-weight:300;
  line-height:1;
}
.small-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  margin-top:24px;
}
.small-module{
  display:flex!important;
  flex-direction:column;
  align-items:center;
  padding:0!important;
  text-align:center!important;
}
.small-module .icon-wrap{
  width:104px!important;
  max-width:104px!important;
  height:104px!important;
  margin:0 auto!important;
  border-radius:26px!important;
}
.small-module .name{
  margin-top:10px!important;
  font-size:15px!important;
  line-height:1.15;
  font-weight:650;
  text-align:center!important;
}
.small-module .status{
  min-height:15px;
  margin-top:5px!important;
  color:var(--muted);
  font-size:12px!important;
  text-align:center!important;
}
.daily-score{
  width:min(100%,430px)!important;
  margin:28px auto 0!important;
  padding-top:19px!important;
  border-top:1px solid rgba(255,255,255,.10)!important;
}
.daily-progress{
  width:76%!important;
  height:4px!important;
  margin-top:13px!important;
}
@media(max-width:430px){
  .dashboard,.daily-score{width:min(100%,350px)!important}
  .vocab-hero{
    min-height:132px;
    grid-template-columns:126px 1fr 27px;
    border-radius:26px!important;
    padding:8px 14px 8px 5px!important;
  }
  .vocab-art{width:124px;height:124px}
  .small-grid{gap:12px;margin-top:22px}
  .small-module .icon-wrap{
    width:92px!important;
    max-width:92px!important;
    height:92px!important;
    border-radius:23px!important;
  }
}
@media(max-width:360px){
  .dashboard,.daily-score{width:min(100%,320px)!important}
  .small-module .icon-wrap{
    width:82px!important;max-width:82px!important;height:82px!important
  }
  .small-grid{gap:8px}
  .small-module .name{font-size:14px!important}
}


/* Home v3.3 — Wortschatz hero state redesign */
.vocab-hero{
  min-height:154px!important;
  grid-template-columns:178px 1fr 28px!important;
  padding:0 18px 0 0!important;
  border:1px solid rgba(255,108,100,.42)!important;
  background:
    radial-gradient(ellipse at 18% 52%, rgba(255,78,72,.30) 0%, rgba(255,78,72,.16) 28%, transparent 62%),
    radial-gradient(ellipse at 86% 22%, rgba(255,91,79,.13) 0%, transparent 48%),
    rgba(255,255,255,.012)!important;
  box-shadow:
    inset 0 0 30px rgba(255,75,70,.08),
    0 0 28px rgba(255,66,60,.08)!important;
  overflow:hidden;
}

/* New transparent 970×885 artwork can be much larger and dissolve into the tile */
.vocab-art{
  width:190px!important;
  height:170px!important;
  margin-left:-12px;
  align-self:center;
  pointer-events:none;
}
.vocab-art img{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  border-radius:0!important;
  filter:drop-shadow(0 0 16px rgba(75,225,185,.22));
}

.vocab-copy{
  position:relative;
  z-index:2;
}
.vocab-copy .name{
  font-size:21px!important;
}
.vocab-copy .status{
  margin-top:7px!important;
  font-size:14px!important;
}

.vocab-hero .hero-arrow{
  position:relative;
  z-index:2;
  border-color:rgba(255,125,115,.26)!important;
  color:rgba(255,225,220,.78)!important;
}

/* Finished state: JS can add .is-done later when Wortschatz is connected */
.vocab-hero.is-done{
  border-color:rgba(87,222,184,.46)!important;
  background:
    radial-gradient(ellipse at 18% 52%, rgba(58,215,174,.30) 0%, rgba(58,215,174,.16) 28%, transparent 62%),
    radial-gradient(ellipse at 86% 22%, rgba(74,225,187,.12) 0%, transparent 48%),
    rgba(255,255,255,.012)!important;
  box-shadow:
    inset 0 0 30px rgba(65,220,180,.08),
    0 0 28px rgba(65,220,180,.08)!important;
}
.vocab-hero.is-done .status{color:var(--mint)!important}
.vocab-hero.is-done .hero-arrow{
  border-color:rgba(87,222,184,.28)!important;
  color:var(--mint)!important;
}

@media(max-width:430px){
  .vocab-hero{
    min-height:142px!important;
    grid-template-columns:158px 1fr 26px!important;
    padding-right:13px!important;
  }
  .vocab-art{
    width:170px!important;
    height:155px!important;
    margin-left:-15px;
  }
}


/* Home v3.4 — asymmetric mosaic */
.dashboard.mosaic{
  width:min(100%,430px)!important;
  margin:0 auto!important;
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  grid-template-rows:repeat(2,188px)!important;
  gap:12px!important;
}

.mosaic .tile{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  border-radius:28px!important;
  padding:0!important;
  display:flex!important;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  background:rgba(255,255,255,.018)!important;
  border:1px solid rgba(255,255,255,.09)!important;
}

.mosaic .tile-vocab{
  grid-column:1;
  grid-row:1;
  border-color:rgba(255,105,96,.42)!important;
  background:
    radial-gradient(circle at 48% 33%,rgba(255,76,69,.27),transparent 52%),
    rgba(255,255,255,.014)!important;
  box-shadow:inset 0 0 34px rgba(255,76,69,.07)!important;
}

.mosaic .tile-verbs{grid-column:2;grid-row:1}
.mosaic .tile-pronouns{grid-column:1;grid-row:2}
.mosaic .tile-articles{grid-column:2;grid-row:2}

.mosaic .tile-art{
  position:absolute;
  top:9px;
  left:50%;
  transform:translateX(-50%);
  width:118px!important;
  height:118px!important;
  margin:0!important;
  pointer-events:none;
}
.mosaic .tile-art img{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  border-radius:0!important;
}

.mosaic .tile-vocab .tile-art{
  top:-7px;
  width:160px!important;
  height:145px!important;
  filter:drop-shadow(0 0 15px rgba(65,225,184,.20));
}

.mosaic .tile-copy{
  position:relative;
  z-index:2;
  width:100%;
  padding:0 10px 17px;
  text-align:center;
}
.mosaic .name{
  margin:0!important;
  font-size:16px!important;
  line-height:1.12!important;
  font-weight:650!important;
  text-align:center!important;
}
.mosaic .status{
  min-height:14px;
  margin-top:5px!important;
  color:var(--muted)!important;
  font-size:12px!important;
  line-height:1.15!important;
  text-align:center!important;
}

.mosaic .tile-vocab.is-done{
  border-color:rgba(87,222,184,.46)!important;
  background:
    radial-gradient(circle at 48% 33%,rgba(58,215,174,.27),transparent 52%),
    rgba(255,255,255,.014)!important;
}
.mosaic .tile-vocab.is-done .status{color:var(--mint)!important}

.daily-score{
  width:min(100%,430px)!important;
  margin:24px auto 0!important;
  padding-top:17px!important;
}

@media(max-width:430px){
  .dashboard.mosaic,.daily-score{width:min(100%,350px)!important}
  .dashboard.mosaic{
    grid-template-rows:repeat(2,160px)!important;
    gap:10px!important;
  }
  .mosaic .tile{border-radius:24px!important}
  .mosaic .tile-art{
    top:7px;
    width:98px!important;
    height:98px!important;
  }
  .mosaic .tile-vocab .tile-art{
    top:-6px;
    width:142px!important;

/* Notifications v4.17 — persistent Home switch + Worker STOP/GO.

const NOTIFICATION_ENABLED_KEY="deutschNotificationEnabledV1";
const NOTIFICATION_SERVER_URL="https://german-learning-notifications.d45zgw2cgh.workers.dev";
const notificationToggle=document.getElementById("notificationToggle");

function notificationEnabled(){
  return localStorage.getItem(NOTIFICATION_ENABLED_KEY)==="1";

  notificationToggle.classList.toggle("is-on",enabled);

async function setServerNotifications(enabled){
  const endpoint=enabled ? "/go" : "/stop";
  try{
    const response=await fetch(NOTIFICATION_SERVER_URL+endpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:"{}"
    });
    if(!response.ok)throw new Error("server-status-"+response.status);
    return true;
  }catch(error){
    console.error("Notification server update failed:",error);
    return false;
  }
}

  /* Update the visible/local state immediately. */
  localStorage.setItem(NOTIFICATION_ENABLED_KEY,next?"1":"0");
  renderNotificationToggle();

  /* Then tell the Worker to GO or STOP. */
  const ok=await setServerNotifications(next);

  /* If the Worker could not be reached, revert so Home and server

  if(!ok){

/* Deutsch Backup v1.
   The envelope is intentionally module-based so future exercises can add
   their own persistent state without changing the export workflow. */
const DEUTSCH_BACKUP_VERSION=1;
const BACKUP_MODULES={
  wortschatz:{
    storageKey:"wortsternSRSv03",
    storageVersion:"wortsternSRSv03"
  }
};

function buildDeutschBackup(){
  const modules={};
  Object.entries(BACKUP_MODULES).forEach(([moduleName,config])=>{
    const raw=localStorage.getItem(config.storageKey);
    if(raw===null)return;
    let state;
    try{state=JSON.parse(raw)}catch(e){state=raw}
    modules[moduleName]={
      storageVersion:config.storageVersion,
      state
    };
  });
  return {
    app:"Deutsch",
    backupVersion:DEUTSCH_BACKUP_VERSION,
    createdAt:new Date().toISOString(),
    modules
  };
}

function saveDeutschBackup(){
  const note=document.getElementById("backupNote");
  try{
    const backup=buildDeutschBackup();
    if(Object.keys(backup.modules).length===0){
      if(note)note.textContent="Noch kein Fortschritt gefunden.";
      return;
    }
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="Deutsch Backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    if(note)note.textContent="Backup erstellt.";
  }catch(e){
    if(note)note.textContent="Backup konnte nicht erstellt werden.";
  }
}

function validateDeutschBackup(backup){
  if(!backup||backup.app!=="Deutsch")throw new Error("not-deutsch");
  if(backup.backupVersion!==DEUTSCH_BACKUP_VERSION)throw new Error("version");
  if(!backup.modules||typeof backup.modules!=="object")throw new Error("modules");

  const restorable=[];
  Object.entries(BACKUP_MODULES).forEach(([moduleName,config])=>{
    const moduleBackup=backup.modules[moduleName];
    if(!moduleBackup)return;
    if(moduleBackup.storageVersion!==config.storageVersion)throw new Error("storage-version");
    if(moduleBackup.state===undefined)throw new Error("state");
    restorable.push([moduleName,config,moduleBackup.state]);
  });
  if(restorable.length===0)throw new Error("nothing");
  return restorable;
}

async function restoreDeutschBackup(file){
  const note=document.getElementById("backupNote");
  try{
    const backup=JSON.parse(await file.text());
    const restorable=validateDeutschBackup(backup);
    const created=backup.createdAt ? new Date(backup.createdAt) : null;
    const dateLabel=created&&!Number.isNaN(created.getTime())
      ? created.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})
      : "unknown date";
    const moduleLabel=restorable.map(([name])=>name==="wortschatz"?"Wortschatz":name).join(", ");
    if(!window.confirm(`Restore backup from ${dateLabel}?\n\n${moduleLabel} will replace the current saved progress.`)){
      if(note)note.textContent="Restore cancelled.";
      return;
    }
    restorable.forEach(([,config,state])=>{
      localStorage.setItem(config.storageKey,JSON.stringify(state));
    });

    /* Refresh Home statistics from the restored Wortschatz state.
       Wortschatz is closed during Restore, so there is no iframe to reload. */
    const restoredWortschatz=restorable.find(([name])=>name==="wortschatz");
    if(restoredWortschatz){
      const state=restoredWortschatz[2];
      const cards=state&&state.cards&&typeof state.cards==="object" ? state.cards : {};
      const activeIds=Array.isArray(state?.activeIds) ? state.activeIds : [];
      const today=localDay();
      const now=Date.now();
      const remaining=activeIds.filter(id=>{
        const card=cards[id];
        if(!card)return false;
        if(!card.due)return true;
        const due=new Date(card.due).getTime();
        return Number.isNaN(due) || due<=now;
      }).length;
      const total=activeIds.length;
      const done=total>0 && remaining===0;
      try{
        localStorage.setItem(HOME_STATS,JSON.stringify({
          date:today,
          wortschatz:{date:today,remaining,done,total}
        }));
      }catch(e){}
    }

    if(note)note.textContent="Restore complete.";
    syncHomeDashboard();
  }catch(e){
    if(note)note.textContent="This backup cannot be restored.";
  }
}

document.getElementById("backupSave")?.addEventListener("click",saveDeutschBackup);
document.getElementById("backupRestore")?.addEventListener("click",()=>{
  const input=document.getElementById("backupFile");
  if(input){input.value="";input.click()}
});
document.getElementById("backupFile")?.addEventListener("change",event=>{
  const file=event.target.files?.[0];
  if(file)restoreDeutschBackup(file);
});

</script>
