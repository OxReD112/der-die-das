<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
(function(){
  if(localStorage.getItem("deutschThemeV1")==="light"){
    document.documentElement.setAttribute("data-theme","light");
  }
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Der.Die.Das.">

    <title>Artikel</title>
<style>
:root{
  /* ===== PALETTE ===== */
  --bg:#1c1c1e;
  --panel:#252527;
  --text:#f5f5f7;
  --muted:#929297;
  --text-secondary:#c8c8cc;
  --text-strong:#e5e5e7;
  --text-subtle:#aaa6a0;
  --text-label:#aaa093;
  --mint:#5ac8a0;
  --coral:#ff6969;
  --blue:#72a7ff;

  /* ===== SEMANTIC COLORS ===== */
  --button:var(--coral);
  --line:rgba(255,255,255,.09);
  --top-line:rgba(255,255,255,.08);
  --top-title:rgba(255,255,255,.48);
  --progress:rgba(255,255,255,.38);
  --answer-surface:rgba(28,28,30,.58);
  --game-title:rgba(255,255,255,.11);
  --version:rgba(255,255,255,.18);
  --good:rgba(90,200,160,.5);
  --bad:rgba(255,105,105,.5);
  --good-glow:radial-gradient(ellipse at 50% 42%,rgba(90,200,160,.42) 0%,rgba(90,200,160,.24) 18%,rgba(90,200,160,.11) 40%,rgba(90,200,160,.04) 60%,transparent 78%);
  --bad-glow:radial-gradient(ellipse at 50% 42%,rgba(255,105,105,.48) 0%,rgba(255,105,105,.28) 18%,rgba(255,105,105,.13) 40%,rgba(255,105,105,.05) 60%,transparent 78%);
  --card-shadow:0 18px 55px rgba(0,0,0,.18);
  --session-button-bg:#303033;
}
[data-theme="light"]{
  /* ===== LIGHT THEME ===== */
  --bg:#f6f4f1;
  --panel:#ffffff;
  --text:#252528;
  --muted:#727278;
  --text-secondary:#55565b;
  --text-strong:#55565b;
  --text-subtle:#77777d;
  --text-label:#6f6b66;
  --mint:#69c9b1;
  --coral:#ff6f73;

  --button:var(--coral);
  --line:rgba(0,0,0,.09);
  --top-line:rgba(32,32,35,.08);
  --top-title:rgba(37,37,40,.48);
  --progress:rgba(32,32,35,.28);
  --answer-surface:rgba(32,32,35,.035);
  --game-title:rgba(37,37,40,.11);
  --version:rgba(37,37,40,.30);
  --good:rgba(105,201,177,.5);
  --bad:rgba(255,111,115,.5);
  --good-glow:radial-gradient(ellipse at 50% 42%,rgba(105,201,177,.18) 0%,rgba(105,201,177,.09) 18%,rgba(105,201,177,.03) 40%,transparent 70%);
  --bad-glow:radial-gradient(ellipse at 50% 42%,rgba(255,111,115,.19) 0%,rgba(255,111,115,.09) 18%,rgba(255,111,115,.025) 40%,transparent 70%);
  --card-shadow:none;
  --session-button-bg:#eeeae5;
}

*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:min(720px,100%);padding:calc(env(safe-area-inset-top) + 8px) 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:10;padding-bottom:17px;background:var(--bg)}.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--top-line);border-radius:99px}.top-title{font-size:18px;font-weight:700;color:var(--top-title)}.counter{color:var(--muted);font-size:14px}.top-title,.counter{transform:translateY(4px)}.progress{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:99px;overflow:hidden;z-index:1}.progress i{display:block;height:100%;background:var(--progress);width:0}.card{position:relative;overflow:hidden;min-height:390px;border:1px solid var(--line);border-radius:26px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 24px;box-shadow:var(--card-shadow)}
.eyebrow{font-size:14px;color:var(--muted);margin-bottom:18px}.word{font-size:clamp(48px,11vw,76px);font-weight:650;letter-spacing:-.04em}.translation{font-size:18px;color:var(--muted);margin-top:14px;text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.choice{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:17px 8px;font-size:25px;font-weight:650;cursor:pointer}.choice:active{transform:scale(.98)}.der{color:var(--blue)}.die{color:var(--coral)}.das{color:var(--mint)}
.feedback{display:none;margin-top:18px;border-radius:22px;padding:22px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}.feedback.show{display:block}.feedback::before{content:"";position:absolute;left:50%;top:-230px;width:155%;height:650px;transform:translateX(-50%);pointer-events:none}.feedback.correct::before{background:var(--good-glow)}.feedback.wrong::before{background:var(--bad-glow)}.feedback h2,.feedback p,.feedback .answer-card,.feedback .rule-card{position:relative}.feedback h2{margin:0 0 10px;font-size:24px}.feedback p{margin:8px 0;color:var(--text-secondary);line-height:1.45}.answer-card,.rule-card{margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--answer-surface)}.answer-card{text-align:center}.answer-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}.rule-label{font-size:14px;text-transform:uppercase;letter-spacing:.035em;color:var(--text-label);font-weight:400;margin-bottom:12px}.answer-word{font-size:30px;font-weight:700;transition:color .2s ease}

.answer-translation{color:var(--muted);margin-top:6px}.rule-title{font-size:16px;font-weight:400;margin-bottom:8px;line-height:1.5}.rule-examples{font-size:13px;font-style:italic;color:var(--text-subtle);margin-top:10px;line-height:1.45}.rule-reliability{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--text-subtle)}.rule-reliability strong{color:var(--text-strong)}.feedback.correct{border-color:var(--good)}.feedback.wrong{border-color:var(--bad)}.continue{width:100%;margin-top:18px;border:0;border-radius:15px;padding:15px;background:var(--button);color:white;font-size:17px;font-weight:650;cursor:pointer}
.game-title{font-size:clamp(58px,10vw,118px);line-height:.9;font-weight:700;letter-spacing:-.065em;color:var(--game-title);margin:0 0 72px;user-select:none}
.session-screen,.end-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:560px;text-align:center;padding:64px 24px 42px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:var(--card-shadow)}
.session-screen h1,.end-screen h1{font-size:34px;margin:0 0 10px;letter-spacing:-.03em}
.session-screen p,.end-screen p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 28px}
.session-options{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.session-option{min-width:112px;border:1px solid var(--line);background:var(--session-button-bg);color:var(--text);border-radius:18px;padding:18px 22px;font-size:22px;font-weight:650;cursor:pointer}
.session-option:active,.play-again:active{transform:scale(.98)}
.progress-label{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.end-score{font-size:56px;font-weight:700;letter-spacing:-.05em;margin:6px 0 8px}
.play-again{border:0;border-radius:15px;padding:15px 28px;background:var(--coral);color:white;font-size:17px;font-weight:650;cursor:pointer}
#game.hidden,.session-screen.hidden,.end-screen.hidden{display:none}

@media(max-width:520px){.app{padding-top:calc(env(safe-area-inset-top) + 8px)}.card{min-height:360px}.choices{position:sticky;bottom:10px}.choice{font-size:22px}}
.version-mark{position:fixed;right:10px;bottom:8px;color:var(--version);font-size:11px;letter-spacing:.04em;pointer-events:none}
</style>
</head>
<body><main class="app">
<section class="session-screen" id="sessionScreen">
<div class="game-title">Der.Die.Das.</div>
<h1>Wie viele Wörter?</h1>
<p>Wähle eine Runde.</p>
<div class="session-options">
<button class="session-option" data-size="10">10</button>
<button class="session-option" data-size="30">30</button>
<button class="session-option" data-size="50">50</button>
</div>
</section>

<div id="game" class="hidden">
<section class="top">
<div><div class="top-title">Der.Die.Das.</div><div class="progress"><i id="bar"></i></div></div>
<div class="counter" id="counter">1 / 10</div>
</section>
<section class="card" id="card">

<div class="eyebrow">Wähle den richtigen Artikel.</div><div class="word" id="word"></div><div class="translation" id="translation"></div>
</section>
<section class="choices" id="choices"><button class="choice der" data-a="der">der</button><button class="choice die" data-a="die">die</button><button class="choice das" data-a="das">das</button></section>
<section class="feedback" id="feedback"><h2 id="feedbackTitle"></h2><p id="choiceLine"></p><div class="answer-card"><div class="answer-label">Das Wort</div><div class="answer-word"><span class="article" id="answerArticle"></span> <span id="answerWord"></span></div><div class="answer-translation" id="answerTranslation"></div></div><div class="rule-card"><div class="rule-label" id="ruleLabel"></div><div class="rule-title" id="ruleTitle"></div><div class="rule-examples" id="ruleExamples"></div><div class="rule-reliability" id="ruleReliability"></div></div><button class="continue" id="continue">Weiter</button></section>
</div>

<section class="end-screen hidden" id="endScreen">
<div class="progress-label">Fertig</div>
<h1>Gut gemacht!</h1>
<div class="end-score" id="endCorrect">0/0</div>
<p id="endSummary">Runde geschafft.</p>
<button class="play-again" id="playAgain">Noch eine Runde</button>
</section>
<div class="version-mark">v10</div>
</main>
<script src="../components/deutsch-translation-v1.js?v=2"></script>
<script src="words.js?v=3"></script>
<script src="../components/deutsch-progress-v1.js"></script>
<script>
const words=window.WORDS;
let deck=[],index=0,total=0,correct=0,sessionSize=0;
const $=id=>document.getElementById(id);

// Persistent difficulty: mistakes make a word more likely to reappear in future rounds.
const STORAGE_KEY='artikelGameDifficultyV1';
let difficulty={};
try{difficulty=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){difficulty={}}
const wordKey=w=>w.article+'|'+w.word;

// Progress tracking (Documentation/PROGRESS_TRACKER.md). Guarded: Artikel keeps working if the helper is missing.
const PROGRESS_ID='artikel';
const hasProgress=()=>typeof window.DeutschProgress==='object';
// Counted per RULE, not per noun: all nouns of one rule (e.g. -ung → die) share one progress item.
// Nouns without a reliable rule and exceptions (ruleType none / exception) are their own item.
const isIndividual=w=>w.ruleType==='none'||w.ruleType==='exception';
const progressKey=w=>isIndividual(w)?'word:'+wordKey(w):'rule:'+w.ruleLabel+'|'+w.article;
function progressLabel(w){
 if(isIndividual(w))return w.article+' '+w.word;
 let l=w.ruleLabel.replace(/ ENDING$/,'').replace(/ PATTERN$/,'').replace(/ → MOSTLY (DER|DIE|DAS)$/,'');
 l=l.startsWith('-')?l.toLowerCase():l.charAt(0)+l.slice(1).toLowerCase();
 return l+' → '+w.article;
}
// Weight = number of nouns the item covers, so the bar % = share of the 238 nouns I reliably know.
if(hasProgress()){
 const items=new Map();
 words.forEach(w=>{const k=progressKey(w),e=items.get(k);if(e)e.weight++;else items.set(k,{key:k,label:progressLabel(w),weight:1})});
 DeutschProgress.init(PROGRESS_ID,[...items.values()]);
}
function saveDifficulty(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(difficulty))}catch(e){}}
function updateDifficulty(w,ok){
 const key=wordKey(w),old=difficulty[key]||1;
 // Wrong answers raise the weight; correct answers gently bring it back toward normal.
 difficulty[key]=ok?Math.max(1,old-0.5):Math.min(4,old+1);
 saveDifficulty();
}
function newDeck(){
 // Build ONE session with unique nouns only.
 // Difficult nouns are more likely to be selected for the session,
 // but a noun can never appear twice inside the same session.
 const ranked=words.map(w=>{
   const weight=Math.max(1,difficulty[wordKey(w)]||1);
   // Weighted sampling without replacement:
   // higher weight = better chance to land near the front.
   const key=-Math.log(Math.max(Math.random(),1e-12))/weight;
   return {w,key};
 }).sort((a,b)=>a.key-b.key);

 deck=ranked.slice(0,Math.min(sessionSize,ranked.length)).map(x=>x.w);
 index=0;
}
function current(){return deck[index]}
function render(){const w=current();$('word').textContent=w.word;$('translation').textContent=getTranslation(w,'translation');$('feedback').className='feedback';$('choices').style.display='grid';$('card').style.display='flex';$('counter').textContent=`${index+1} / ${sessionSize}`;$('bar').style.width=`${(index/sessionSize)*100}%`}

const DAILY_STATS_KEY='deutschDailyStatsV1';
function localDayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function recordDailyArtikel(ok){
  try{
    const today=localDayKey();
    let data=JSON.parse(localStorage.getItem(DAILY_STATS_KEY)||'{}');

    if(data.date!==today){
      data={date:today,artikel:{answers:0,correct:0}};
    }

    if(!data.artikel) data.artikel={answers:0,correct:0};
    data.artikel.answers++;
    if(ok) data.artikel.correct++;

    localStorage.setItem(DAILY_STATS_KEY,JSON.stringify(data));
  }catch(e){}
}

function choose(article){const w=current(),ok=article===w.article;total++; recordDailyArtikel(ok); updateDifficulty(w,ok); if(hasProgress())DeutschProgress.record(PROGRESS_ID,progressKey(w),ok); if(ok){correct++}
 $('feedback').className='feedback show '+(ok?'correct':'wrong');$('feedbackTitle').textContent=ok?'✓ Richtig!':'✕ Nicht ganz.';$('choiceLine').innerHTML=ok?`Deine Wahl: <strong>${article}</strong>.`:`Deine Wahl: <strong>${article}</strong>. Richtig: <strong>${w.article}</strong>.`;$('answerArticle').textContent=w.article;$('answerWord').textContent=w.word;$('answerTranslation').textContent=getTranslation(w,'translation');$('ruleLabel').textContent=`WHY ${w.article.toUpperCase()}? (${w.ruleLabel})`;$('ruleTitle').textContent=w.explanation;$('ruleExamples').textContent=w.examples;$('ruleReliability').innerHTML=`<strong>Heads up:</strong> ${w.reliability}`;$('choices').style.display='none';$('card').style.display='none'}
function startSession(size){
 sessionSize=size; total=0; correct=0;
 
 newDeck();
 $('sessionScreen').classList.add('hidden');
 $('endScreen').classList.add('hidden');
 $('game').classList.remove('hidden');
 render();
}
function endSession(){
 $('game').classList.add('hidden');
 $('endScreen').classList.remove('hidden');
 $('endCorrect').textContent=`${correct}/${sessionSize}`;
 const pct=Math.round((correct/sessionSize)*100);
 $('endSummary').textContent=`${pct} % richtig. Was schwierig war, kommt öfter wieder.`;
}
$('continue').onclick=()=>{
 if(total>=sessionSize){endSession();return}
 index++;
 render();
};
document.querySelectorAll('.session-option').forEach(b=>b.onclick=()=>startSession(Number(b.dataset.size)));
$('playAgain').onclick=()=>{$('endScreen').classList.add('hidden');$('sessionScreen').classList.remove('hidden')};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.a));
document.addEventListener('keydown',e=>{if($('feedback').classList.contains('show')){if(e.key==='Enter'||e.key===' ')$('continue').click();return}if(e.key==='ArrowLeft'||e.key==='1')choose('der');if(e.key==='ArrowUp'||e.key==='2')choose('die');if(e.key==='ArrowRight'||e.key==='3')choose('das')});


</script></body></html>
