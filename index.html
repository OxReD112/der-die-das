<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <meta content="#1b1b1d" name="theme-color"/>
  <title>
   Deutsch
  </title>
  <style>
   :root {
  /* Core palette */
  --bg: #1b1b1d;
  --text: #f2f0ed;
  --muted: #8f8f94;
  --mint: #55d7b5;

  /* Card system */
  --card-bg: rgba(255,255,255,.018);
  --card-bg-soft: rgba(255,255,255,.014);
  --card-border: rgba(255,255,255,.09);
  --card-radius: 25px;

  /* Completion glow */
  --mint-core: rgba(104,235,195,.95);
  --mint-mid: rgba(78,220,181,.72);

  /* Layout */
  --dashboard-width: 430px;
  --mobile-dashboard-width: 350px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100dvh;
  padding:
    calc(env(safe-area-inset-top) + 28px)
    max(24px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 32px)
    max(24px, env(safe-area-inset-left));
}

html.app-open,
html.app-open body {
  overflow: hidden;
  height: 100%;
}

/* --------------------------------------------------------------------------
   Home layout
   -------------------------------------------------------------------------- */

.page {
  width: min(100%, 720px);
  margin: 0 auto;
  min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 60px);
  display: flex;
  flex-direction: column;
  padding-top: 56px;
}

header {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 22px);
  left: 50%;
  right: auto;
  width: min(calc(100% - 48px), 720px);
  transform: translateX(-50%);
  z-index: 20;
  margin: 0;
  padding: 0;
  background: var(--bg);
}

header h1 {
  margin: 0;
  text-align: center;
  font-size: 32px;
  line-height: 1;
  letter-spacing: -.7px;
  font-weight: 750;
}

.intro {
  margin: 0 0 28px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.4;
  text-align: center;
}

/* --------------------------------------------------------------------------
   Dashboard
   -------------------------------------------------------------------------- */

.dashboard.mosaic {
  width: min(100%, var(--dashboard-width));
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, 141px);
  gap: 10px;
}

.module {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  padding: 0;
  margin: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.mosaic .tile {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--card-border);
  border-radius: var(--card-radius);
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  background: var(--card-bg);
  text-align: center;
}

/* --------------------------------------------------------------------------
   Wortschatz card
   -------------------------------------------------------------------------- */

.mosaic .tile-vocab {
  grid-column: 1 / span 2;
  grid-row: 1;
  display: grid;
  grid-template-columns: 1.08fr .92fr;
  align-items: center;

  border-color: rgba(255,255,255,.10);
  background: var(--card-bg-soft);
  box-shadow: none;
  isolation: isolate;
  overflow: hidden;
  clip-path: inset(0 round var(--card-radius));
  -webkit-clip-path: inset(0 round var(--card-radius));
}

.mosaic .tile-vocab::before,
.mosaic .tile-vocab::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: 25px;
  pointer-events: none;
}

.mosaic .tile-vocab::before {
  background: none;
}

.mosaic .tile-vocab::after {
  background: none;
}

.mosaic .tile-vocab .tile-art {
  position: absolute;
  z-index: 1;
  left: 0;
  top: 0;
  width: auto;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: visible;
  filter: none;
  background: none;
  box-shadow: none;
}

.mosaic .tile-vocab .tile-art img {
  display: block;
  width: auto;
  height: 100%;
  max-width: none;
  max-height: none;
  object-fit: contain;
  object-position: left center;
  filter: none;
  box-shadow: none;
  border-radius: 0;
}

.mosaic .tile-vocab .tile-copy {
  position: absolute;
  z-index: 4;
  left: auto;
  right: 7px;
  top: 50%;
  bottom: auto;
  width: 42%;
  padding: 0;
  transform: translateY(-50%);
  text-align: left;
}

.mosaic .tile-vocab .name,
.mosaic .tile-vocab .status {
  text-align: left;
}

.mosaic .tile-vocab .name {
  margin: 0;
  font-size: 17px;
  line-height: 1.12;
  font-weight: 650;
  white-space: nowrap;
}

.mosaic .tile-vocab .status {
  min-height: 14px;
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.15;
}

.mosaic .tile-vocab.is-done::before {
  background:
    radial-gradient(circle at 100% 0%,
      rgba(69,218,178,.54) 0%,
      rgba(69,218,178,.34) 10%,
      rgba(69,218,178,.16) 20%,
      rgba(69,218,178,.05) 30%,
      transparent 40%),
    radial-gradient(circle at 0% 100%,
      rgba(69,218,178,.58) 0%,
      rgba(69,218,178,.36) 10%,
      rgba(69,218,178,.17) 20%,
      rgba(69,218,178,.05) 30%,
      transparent 40%);
}

.mosaic .tile-vocab.is-done::after {
  background:
    radial-gradient(circle at 100% 0%,
      rgba(69,218,178,.23) 0%,
      rgba(69,218,178,.09) 16%,
      transparent 31%),
    radial-gradient(circle at 0% 100%,
      rgba(69,218,178,.25) 0%,
      rgba(69,218,178,.10) 16%,
      transparent 31%);
}

.mosaic .tile-vocab.is-done .status {
  color: var(--mint);
}



/* --------------------------------------------------------------------------
   Compact exercise cards
   -------------------------------------------------------------------------- */

.mosaic .tile-small {
  border-radius: var(--card-radius);
  overflow: hidden;
}

.mosaic .tile-articles {
  grid-column: 3;
  grid-row: 1;
}

.mosaic .tile-verbs {
  grid-column: 1;
  grid-row: 2;
}

.mosaic .tile-pronouns {
  grid-column: 2;
  grid-row: 2;
}

.mosaic .tile-small .tile-art {
  position: absolute;
  z-index: 1;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: none;
  overflow: visible;
  margin: 0;
  pointer-events: none;
}

.mosaic .tile-small .tile-art img {
  display: block;
  width: 100%;
  height: auto;
  max-width: none;
  object-fit: unset;
  object-position: initial;
  border-radius: 0;
}

.mosaic .tile-small .tile-copy {
  position: absolute;
  z-index: 5;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  padding: 40px 5px 8px;
  text-align: center;
  background: linear-gradient(
    to bottom,
    rgba(23,24,26,0) 0%,
    rgba(23,24,26,.08) 12%,
    rgba(23,24,26,.34) 32%,
    rgba(23,24,26,.72) 58%,
    rgba(23,24,26,.94) 82%,
    rgba(23,24,26,.98) 100%
  );
}

.mosaic .tile-small .name,
.mosaic .tile-small .status {
  position: relative;
  z-index: 7;
}

.mosaic .tile-small .name {
  margin: 0;
  font-size: 13px;
  line-height: 1.12;
  font-weight: 650;
}

.mosaic .tile-small .status {
  min-height: 14px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.15;
}

.mosaic .tile-small::after {
  content: "";
  display: block;
  position: absolute;
  z-index: 5;
  right: -47px;
  bottom: -47px;
  left: auto;
  top: auto;
  width: 94px;
  height: 94px;
  pointer-events: none;
  opacity: 1;
  border-radius: 50%;
  background: none;
}

.mosaic .tile-small.is-done::after {
  background: radial-gradient(
    circle at 50% 50%,
    var(--mint-core) 0%,
    var(--mint-mid) 18%,
    rgba(74,214,176,.28) 38%,
    rgba(74,214,176,.10) 55%,
    transparent 74%
  );
}

.mosaic .tile-small.is-done .status {
  color: var(--mint);
}

/* --------------------------------------------------------------------------
   Heute card
   -------------------------------------------------------------------------- */

.mosaic .tile-today {
  grid-column: 3;
  grid-row: 2;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--card-border);
  border-radius: var(--card-radius);
  background:
    radial-gradient(circle at 50% 34%, rgba(86,219,183,.055), transparent 64%),
    var(--card-bg-soft);
  box-shadow: none;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.mosaic .tile-today::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(
    circle at 50% 0%,
    rgba(255,255,255,.025),
    transparent 58%
  );
}

.mosaic .tile-today > * {
  position: relative;
  z-index: 1;
}

.today-label {
  color: #d8d6d2;
  font-size: 12px;
  font-weight: 650;
}

.today-number {
  margin-top: 10px;
  color: #f0efec;
  font-size: 28px;
  line-height: 1;
  font-weight: 650;
}

.today-unit {
  margin-top: 5px;
  color: var(--muted);
  font-size: 10px;
}

.today-progress {
  width: 72%;
  height: 3px;
  margin-top: 14px;
  overflow: hidden;
  border-radius: 99px;
  background: rgba(255,255,255,.09);
}

.today-progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: var(--mint);
  transition: width .25s ease;
}

/* --------------------------------------------------------------------------
   Phrase of the Week
   -------------------------------------------------------------------------- */

.home-viewport {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.home-track {
  display: flex;
  width: 200%;
  transform: translateX(0);
  transition: transform .42s cubic-bezier(.22,.61,.36,1);
  will-change: transform;
}

.home-screen,
.phrase-screen {
  flex: 0 0 50%;
  width: 50%;
  min-width: 0;
}

.home-screen {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: inherit;
}

.phrase-screen {
  position: relative;
  min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 60px);
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding:
    calc(env(safe-area-inset-top) + 56px)
    max(24px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 32px)
    max(24px, env(safe-area-inset-left));
  overflow: hidden;
}

.phrase-screen-content {
  width: min(100%, 430px);
  margin: 0 auto;
  padding: 24px 20px 24px;
  text-align: center;
}

.phrase-screen .phrase-week-label {
  margin-bottom: 24px;
  font-size: 13px;
}

.phrase-week-label {
  color: #77777d;
  font-size: 10px;
  line-height: 1.2;
  letter-spacing: .45px;
  text-transform: uppercase;
}

.phrase-week-title {
  color: var(--text);
  font-size: 30px;
  line-height: 1.18;
  font-weight: 650;
  letter-spacing: -.35px;
}

.phrase-week-literal {
  margin-top: 6px;
  color: rgba(190,189,186,.58);
  font-size: 17px;
  line-height: 1.45;
}

.phrase-week-meaning {
  margin-top: 28px;
  color: rgba(190,189,186,.68);
  font-size: 18px;
  line-height: 1.45;
}

.phrase-week-example {
  margin-top: 18px;
  color: rgba(169,167,163,.58);
  font-size: 16px;
  line-height: 1.5;
  font-style: italic;
}

.phrase-screen-back {
  position: static;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 28px auto 0;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 50%;
  background: rgba(27,27,29,.58);
  color: rgba(242,240,237,.62);
  font: 400 28px/42px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  text-align: center;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.phrase-screen-back:active {
  opacity: .65;
}

.phrase-screen-back-arrow {
  display: inline-block;
  transform: translateY(-1px);
}

.phrase-week-home-row {
  appearance: none;
  -webkit-appearance: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: min(100%, 430px);
  margin: 28px auto 0;
  padding: 10px 20px 22px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.phrase-week-home-row:active {
  opacity: .65;
}

.phrase-week-home-copy {
  min-width: 0;
  text-align: left;
}

.phrase-week-home-title {
  margin-top: 5px;
  color: var(--text);
  font-size: 16px;
  line-height: 1.18;
  font-weight: 650;
  letter-spacing: -.35px;
}

.phrase-week-home-literal {
  margin-top: 1px;
  color: rgba(190,189,186,.58);
  font-size: 13px;
  line-height: 1.45;
}

.phrase-week-arrow {
  display: block;
  font: 300 34px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Helvetica Neue", Arial, sans-serif;
  transform: translateY(-1px);
}

@media (max-width: 430px) {
  .phrase-screen-content {
    width: min(100%, 350px);
    padding-left: 4px;
    padding-right: 4px;
  }

  .phrase-week-home-row {
    width: min(100%, 350px);
    padding: 10px 4px 20px;
  }
}

/* --------------------------------------------------------------------------
   Backup / utilities
   -------------------------------------------------------------------------- */
.home-utilities {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 28px);
  transform: translateX(-50%);
  width: min(calc(100% - 48px), 720px);
  z-index: 10;
  pointer-events: none;
}

.home-utilities .backup-tools,
.home-utilities #notificationSettings {
  pointer-events: auto;
}

.backup-tools {
  width: min(100%, 620px);
  margin: 0 auto;
  text-align: center;
}

.backup-save {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  padding: 8px 12px;
  background: transparent;
  color: #66666b;
  font: 500 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "Helvetica Neue", Arial, sans-serif;
  cursor: pointer;
}

.backup-save:active {
  color: #929298;
}

.backup-separator {
  color: #66666b;
  font: 500 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "Helvetica Neue", Arial, sans-serif;
}

.backup-file {
  display: none;
}

.backup-note {
  min-height: 14px;
  margin-top: 2px;
  color: #55555a;
  font-size: 10px;
}

.backup-note:empty {
  min-height: 0;
  margin-top: 0;
}

#notificationSettings {
  width: 100%;
  margin-top: -10px;
  text-align: center;
}

#notificationToggle {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  background: transparent;
  color: #66666b;
  font: 500 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "Helvetica Neue", Arial, sans-serif;
  cursor: pointer;
  padding: 8px 12px;
}

#notificationNote {
  min-height: 14px;
  margin-top: 2px;
  color: #55555a;
  font-size: 10px;
}

/* --------------------------------------------------------------------------
   Embedded exercise shell
   -------------------------------------------------------------------------- */

.app-shell {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  background: var(--bg);
}

.app-shell.open {
  display: block;
}

.app-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--bg);
}

.home-back {
  position: absolute;
  z-index: 1001;
  top: auto;
  right: auto;
  bottom: calc(env(safe-area-inset-bottom) + 12px);
  left: max(12px, env(safe-area-inset-left));
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 50%;
  background: rgba(27,27,29,.58);
  color: rgba(242,240,237,.52);
  font: 400 22px/42px -apple-system, BlinkMacSystemFont, "SF Pro Display",
    sans-serif;
  text-align: center;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: none;
  cursor: pointer;
}

.home-glyph {
  display: inline-block;
  transform: scaleX(1.28);
  transform-origin: center;
}

.home-version {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom) + 10px);
  z-index: 10;
  text-align: center;
  color: #55555a;
  font-size: 11px;
  line-height: 1;
  letter-spacing: .35px;
  pointer-events: none;
}

/* --------------------------------------------------------------------------
   Responsive layout
   -------------------------------------------------------------------------- */

@media (min-width: 650px) {
  body {
    padding-top: 48px;
  }

  header {
    margin-bottom: 62px;
  }
}

@media (min-width: 529px) {
  .home-back {
    left: calc(50% - 240px + 12px);
  }
}

@media (max-width: 700px) {
  .mosaic .tile-today {
    padding-top: 8px;
    padding-bottom: 8px;
  }
}

@media (max-width: 430px) {
  header {
    width: calc(100% - 48px);
  }

  .dashboard.mosaic {
    width: min(100%, var(--mobile-dashboard-width));
  }

  .dashboard.mosaic {
    grid-template-rows: repeat(2, 121px);
    gap: 8px;
  }

  .mosaic .tile {
    border-radius: 24px;
  }

  .mosaic .tile-vocab {
    grid-template-columns: 1.06fr .94fr;
  }

  .mosaic .tile-vocab .tile-copy {
    right: 5px;
    width: 42%;
  }

  .mosaic .tile-vocab .name {
    font-size: 15px;
  }

  .mosaic .tile-small .tile-art {
    width: 100%;
    height: 100%;
  }

  .mosaic .tile-small .tile-copy {
    padding: 25px 4px 8px;
  }

  .mosaic .tile-small .name {
    font-size: 12px;
  }

  .mosaic .tile-small .status {
    font-size: 10px;
  }

  .mosaic .tile-today {
    border-radius: 24px;
  }


}

    (function initPhraseOfTheWeek(){

      const phraseTitle=document.getElementById("phraseWeekTitle");

      function showPhrase(){
        homeTrack.style.transform="translateX(-50%)";
        phraseScreen.setAttribute("aria-hidden","false");
      }

      function showHome(){
        homeTrack.style.transform="translateX(0)";
        phraseScreen.setAttribute("aria-hidden","true");
      }

      phraseToggle.addEventListener("click",showPhrase);
      phraseBack.addEventListener("click",showHome);

      function getMonday(date){
        const d=new Date(date);
        d.setHours(0,0,0,0);
        const day=d.getDay();
        const diff=day===0 ? -6 : 1-day;
        d.setDate(d.getDate()+diff);
        return d;
      }

      function getISOWeekKey(date){
        const monday=getMonday(date);
        return monday.getTime();
      }

      function render(){
        if(!Array.isArray(window.PHRASES)||window.PHRASES.length===0) return;

        const startMonday=new Date(2026,0,5);
        const currentWeek=getISOWeekKey(new Date());
        const firstWeek=getISOWeekKey(startMonday);
        const weeks=Math.max(0,Math.floor((currentWeek-firstWeek)/604800000));
        const index=weeks % window.PHRASES.length;
        const phrase=window.PHRASES[index];

        // The same weekly phrase object feeds both the compact Home preview
        // and the full-screen details. There is only one source of truth.
        phraseHomeTitle.textContent=phrase.title;
        phraseHomeLiteral.textContent=phrase.literal;

        phraseTitle.textContent=phrase.title;
        phraseLiteral.textContent=phrase.literal;
        phraseMeaning.textContent="→ "+phrase.meaning;
        phraseExample.textContent=phrase.example;
      }

      if(Array.isArray(window.PHRASES)) render();
      else window.addEventListener("phrasesready",render,{once:true});
    })();

    const DAILY_STATS_KEY='deutschDailyStatsV1';

      let vocabPoints=0;

    }

    const shell = document.getElementById('appShell');

    document.querySelectorAll('[data-app]').forEach(button => {

        frame.src = button.dataset.app;
        shell.classList.add('open');
        shell.setAttribute('aria-hidden', 'false');
        document.documentElement.classList.add('app-open');
      });
    });

    function closeApp() {
      renderDailyStats();
      shell.classList.remove('open');
      shell.setAttribute('aria-hidden', 'true');
      document.documentElement.classList.remove('app-open');
      frame.src = 'about:blank';
    }

    back.addEventListener('click', closeApp);
    renderDailyStats();
  
const HOME_STATS="deutschHomeStatsV1";

function localDay(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

function syncHomeDashboard(){
  /* Wortschatz publishes this object from its own page. */
  try{
    const home=JSON.parse(localStorage.getItem(HOME_STATS)||"{}");
    const ws=home.wortschatz;
    const wsTile=document.querySelector(".tile-vocab");
    const wsStatus=document.getElementById("wortschatzStatus");
    const done=!!(ws && ws.date===localDay() && ws.done);
    if(wsTile)wsTile.classList.toggle("is-done",done);
    if(wsStatus)wsStatus.textContent=done?"✓ fertig":((ws && ws.date===localDay() && Number.isFinite(Number(ws.remaining)) && Number(ws.remaining)>0)?`${Number(ws.remaining)} ${Number(ws.remaining)===1?"Wort":"Wörter"} übrig`:"noch offen");
    if(done && wsStatus)wsStatus.style.color="var(--mint)";
    if(!done && wsStatus)wsStatus.style.color="";
  }catch(e){}

  /* Existing compact cards already expose their completion through their
     visible status; mirror that into the subtle bottom glow. */
  document.querySelectorAll(".tile-small").forEach(tile=>{
    const txt=(tile.querySelector(".status")?.textContent||"").toLowerCase();
    tile.classList.toggle("is-done",txt.includes("fertig")||txt.includes("✓"));
  });
  renderDailyStats();
}

/* Deutsch Backup v1.
   The envelope is intentionally module-based so future exercises can add
   their own persistent state without changing the export workflow. */
const DEUTSCH_BACKUP_VERSION=1;
const BACKUP_MODULES={
  wortschatz:{
    storageKey:"wortsternSRSv03",
    storageVersion:"wortsternSRSv03"
  }
};

function buildDeutschBackup(){
  const modules={};
  Object.entries(BACKUP_MODULES).forEach(([moduleName,config])=>{
    const raw=localStorage.getItem(config.storageKey);
    if(raw===null)return;
    let state;
    try{state=JSON.parse(raw)}catch(e){state=raw}
    modules[moduleName]={
      storageVersion:config.storageVersion,
      state
    };
  });
  return {
    app:"Deutsch",
    backupVersion:DEUTSCH_BACKUP_VERSION,
    createdAt:new Date().toISOString(),
    modules
  };
}

function saveDeutschBackup(){
  const note=document.getElementById("backupNote");
  try{
    const backup=buildDeutschBackup();
    if(Object.keys(backup.modules).length===0){
      if(note)note.textContent="Noch kein Fortschritt gefunden.";
      return;
    }
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="Deutsch Backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    if(note)note.textContent="Backup erstellt.";
  }catch(e){
    if(note)note.textContent="Backup konnte nicht erstellt werden.";
  }
}

function validateDeutschBackup(backup){
  if(!backup||backup.app!=="Deutsch")throw new Error("not-deutsch");
  if(backup.backupVersion!==DEUTSCH_BACKUP_VERSION)throw new Error("version");
  if(!backup.modules||typeof backup.modules!=="object")throw new Error("modules");

  const restorable=[];
  Object.entries(BACKUP_MODULES).forEach(([moduleName,config])=>{
    const moduleBackup=backup.modules[moduleName];
    if(!moduleBackup)return;
    if(moduleBackup.storageVersion!==config.storageVersion)throw new Error("storage-version");
    if(moduleBackup.state===undefined)throw new Error("state");
    restorable.push([moduleName,config,moduleBackup.state]);
  });
  if(restorable.length===0)throw new Error("nothing");
  return restorable;
}

async function restoreDeutschBackup(file){
  const note=document.getElementById("backupNote");
  try{
    const backup=JSON.parse(await file.text());
    const restorable=validateDeutschBackup(backup);
    const created=backup.createdAt ? new Date(backup.createdAt) : null;
    const dateLabel=created&&!Number.isNaN(created.getTime())
      ? created.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})
      : "unknown date";
    const moduleLabel=restorable.map(([name])=>name==="wortschatz"?"Wortschatz":name).join(", ");
    if(!window.confirm(`Restore backup from ${dateLabel}?\n\n${moduleLabel} will replace the current saved progress.`)){
      if(note)note.textContent="Restore cancelled.";
      return;
    }
    restorable.forEach(([,config,state])=>{
      localStorage.setItem(config.storageKey,JSON.stringify(state));
    });

    /* Refresh Home statistics from the restored Wortschatz state.
       Wortschatz is closed during Restore, so there is no iframe to reload. */
    const restoredWortschatz=restorable.find(([name])=>name==="wortschatz");
    if(restoredWortschatz){
      const state=restoredWortschatz[2];
      const cards=state&&state.cards&&typeof state.cards==="object" ? state.cards : {};
      const activeIds=Array.isArray(state?.activeIds) ? state.activeIds : [];
      const today=localDay();
      const now=Date.now();
      const remaining=activeIds.filter(id=>{
        const card=cards[id];
        if(!card)return false;
        if(!card.due)return true;
        const due=new Date(card.due).getTime();
        return Number.isNaN(due) || due<=now;
      }).length;
      const total=activeIds.length;
      const done=total>0 && remaining===0;
      try{
        localStorage.setItem(HOME_STATS,JSON.stringify({
          date:today,
          wortschatz:{date:today,remaining,done,total}
        }));
      }catch(e){}
    }

    if(note)note.textContent="Restore complete.";
    syncHomeDashboard();
  }catch(e){
    if(note)note.textContent="This backup cannot be restored.";
  }
}

document.getElementById("backupSave")?.addEventListener("click",saveDeutschBackup);
document.getElementById("backupRestore")?.addEventListener("click",()=>{
  const input=document.getElementById("backupFile");
  if(input){input.value="";input.click()}
});
document.getElementById("backupFile")?.addEventListener("change",event=>{
  const file=event.target.files?.[0];
  if(file)restoreDeutschBackup(file);
});


/* Notifications v5.2 — iOS Safari Home Screen Web App only.
   This block is isolated from the existing Home logic. */
(function initDeutschNotifications(){
  const SERVER="https://german-learning-notifications.d45zgw2cgh.workers.dev";
  const ENABLED_KEY="deutschNotificationEnabledV1";
  const USER_KEY="deutschNotificationUserIdV1";
  const DEVICE_KEY="deutschNotificationDeviceIdV1";

  const box=document.getElementById("notificationSettings");
  const toggle=document.getElementById("notificationToggle");
  const state=document.getElementById("notificationState");
  const note=document.getElementById("notificationNote");

  if(!box || !toggle || !state) return;

  box.style.width="100%";
  box.style.textAlign="center";

  function isIOSDevice(){
    const ua=navigator.userAgent||"";
    const platform=navigator.platform||"";
    return /iPhone|iPad|iPod/i.test(ua) ||
      (platform==="MacIntel" && navigator.maxTouchPoints>1);
  }

  function isStandalone(){
    return navigator.standalone===true ||
      !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  function isIOSHomeScreenApp(){
    return isIOSDevice() && isStandalone();
  }

  function enabled(){
    return localStorage.getItem(ENABLED_KEY)==="1";
  }

  function getDeviceId(){
    let id=localStorage.getItem(DEVICE_KEY);
    if(!id){
      try{
        id=(crypto.randomUUID ? crypto.randomUUID() :
          "device-"+Date.now()+"-"+Math.random().toString(36).slice(2));
      }catch(e){
        id="device-"+Date.now()+"-"+Math.random().toString(36).slice(2);
      }
      localStorage.setItem(DEVICE_KEY,id);
    }
    return id;
  }

  function getUserId(){
    let id=localStorage.getItem(USER_KEY);
    if(!id){
      try{
        id=(crypto.randomUUID ? crypto.randomUUID() :
          "user-"+Date.now()+"-"+Math.random().toString(36).slice(2));
      }catch(e){
        id="user-"+Date.now()+"-"+Math.random().toString(36).slice(2);
      }
      localStorage.setItem(USER_KEY,id);
    }
    return id;
  }

  function render(){
    const visible=isIOSHomeScreenApp();
    box.hidden=!visible;
    if(!visible) return;

    const on=enabled();
    state.textContent=on?"ON":"OFF";
    toggle.setAttribute("aria-checked",on?"true":"false");
    toggle.style.color="#66666b";
  }

  function base64ToBytes(value){
    const padding="=".repeat((4-value.length%4)%4);
    const base64=(value+padding).replace(/-/g,"+").replace(/_/g,"/");
    const raw=atob(base64);
    const out=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
    return out;
  }

  async function registerPush(){
    if(!("serviceWorker" in navigator)) throw new Error("service-worker");
    if(!("PushManager" in window)) throw new Error("push-not-supported");
    if(!("Notification" in window)) throw new Error("notifications-not-supported");

    const registration=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
    await navigator.serviceWorker.ready;

    const permission=await Notification.requestPermission();
    if(permission!=="granted") throw new Error("permission");

    const configResponse=await fetch(SERVER+"/push-config",{cache:"no-store"});
    if(!configResponse.ok) throw new Error("push-config-"+configResponse.status);
    const config=await configResponse.json();
    if(!config.publicKey) throw new Error("missing-public-key");

    let subscription=await registration.pushManager.getSubscription();
    if(!subscription){
      subscription=await registration.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:base64ToBytes(config.publicKey)
      });
    }

    const response=await fetch(SERVER+"/subscribe",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        userId:getUserId(),
        deviceId:getDeviceId(),
        subscription:subscription.toJSON()
      })
    });

    if(!response.ok) throw new Error("subscribe-"+response.status);
  }

  async function setServerState(on){
    const response=await fetch(SERVER+(on?"/go":"/stop"),{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        userId:getUserId(),
        deviceId:getDeviceId()
      })
    });
    if(!response.ok) throw new Error((on?"/go":"/stop")+"-"+response.status);
  }

  toggle.addEventListener("click",async()=>{
    const next=!enabled();
    toggle.disabled=true;
    if(note) note.textContent="";

    try{
      if(next) await registerPush();
      await setServerState(next);
      localStorage.setItem(ENABLED_KEY,next?"1":"0");
    }catch(error){
      console.error("Deutsch notifications:",error);
      if(note) note.textContent="Notification setup failed.";
    }finally{
      toggle.disabled=false;
      render();
    }
  });

  render();
})();
  </script>
