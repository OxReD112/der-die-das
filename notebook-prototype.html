<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Deutsch. · Notizbuch</title></head>
<body>
<div id="notebook-simplified">
<style>
#notebook-simplified{--bg:light-dark(#f6f4f1,#1b1b1d);--text:light-dark(#242426,#f2f0ed);--muted:light-dark(#727278,#8f8f94);--secondary:light-dark(#55565b,#c8c7c4);--mint:light-dark(#3fa68a,#5bc8a4);--tile:light-dark(#fff,#2a2a2d);--line:light-dark(#0002,#ffffff1a);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
#notebook-simplified *{box-sizing:border-box}#notebook-simplified button,#notebook-simplified input,#notebook-simplified textarea,#notebook-simplified select{font:inherit;color:inherit}#notebook-simplified [hidden]{display:none!important}.phone{width:min(100%,390px);margin:0 auto;background:var(--bg);border-radius:28px;padding:24px;min-height:600px;position:relative}.screen{min-height:550px;display:flex;flex-direction:column}.phrase-screen{justify-content:space-between;text-align:center;padding:24px 8px 0}.phrase-top{text-align:left}.back{border:0;background:none;color:var(--muted);padding:8px 0;cursor:pointer}.phrase-copy{margin:auto 0}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:23px}.phrase-title{font-size:29px;line-height:1.18;font-weight:650;letter-spacing:-.35px}.literal{font-size:17px;color:var(--muted);margin-top:8px}.meaning{font-size:18px;color:var(--secondary);line-height:1.45;margin-top:26px}.example{font-size:15px;color:var(--muted);font-style:italic;margin-top:18px}.phrase-book{margin:0 auto 7px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:12px 18px;cursor:pointer;border-radius:12px}.book-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 17px}.book-title{font-size:25px;line-height:1.12;letter-spacing:-.55px;font-weight:650;margin:0}.search-toggle{height:42px;width:42px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.search{display:flex;gap:8px;align-items:center;height:43px;margin-bottom:13px;padding:0 12px;border-radius:12px;background:var(--tile)}.search input{background:transparent;border:0;outline:0;width:100%;font-size:16px}.search input::placeholder,.field input::placeholder,.field textarea::placeholder{color:var(--muted)}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:9px}.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:9px 0 10px;font-size:14px;cursor:pointer}.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--mint)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:13px 1px;cursor:pointer}.row strong{display:block;font-size:16px;font-weight:550}.row small{display:block;color:var(--muted);font-size:13px;margin-top:3px}.row .topic{display:block;color:var(--muted);font-size:11px;margin-top:5px}.arrow{color:var(--muted)}.new-note{align-self:center;margin:20px auto 0;border:0;border-radius:99px;background:var(--mint);color:var(--bg);padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer}.topic-back{border:0;background:none;color:var(--muted);padding:8px 0;cursor:pointer}.detail-title{font-size:25px;line-height:1.18;letter-spacing:-.45px;margin:10px 0 4px}.detail-sub{font-size:14px;color:var(--muted)}.detail-body{white-space:pre-wrap;line-height:1.6;border-top:1px solid var(--line);padding-top:17px;margin:22px 0;color:var(--secondary)}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:1px solid var(--line);background:var(--tile);border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer}.form-title{font-size:21px;line-height:1.15;font-weight:600;margin:4px 0 18px}.form{display:grid;gap:12px}.field{display:block;padding:12px;border-radius:12px;background:var(--tile)}.field input,.field textarea,.field select{display:block;width:100%;border:0;outline:0;background:transparent;font-size:16px}.field textarea{min-height:145px;resize:vertical}.field-label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.inline-add{border:0;background:transparent;color:var(--mint);text-align:left;padding:6px 0;cursor:pointer}.empty{padding:23px 2px;color:var(--muted);font-size:14px}
</style>
<style>#notebook-simplified .book-top{display:flex;justify-content:space-between;align-items:center;margin:0 0 46px}#notebook-simplified .book-kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}#notebook-simplified .book-title{font-size:30px;line-height:1.12;letter-spacing:-.65px;font-weight:700;margin:0}#notebook-simplified .book-head{margin:0 0 23px}#notebook-simplified .theme-toggle{width:42px;height:42px;border:0;border-radius:50%;background:var(--tile);color:var(--muted);font-size:19px}</style>
<style>#notebook-simplified .undo-toast{margin:14px auto 0;padding:10px 13px;background:var(--tile);border-radius:12px;color:var(--secondary);font-size:13px}#notebook-simplified .undo-toast button{border:0;background:transparent;color:var(--mint);padding:4px 0 4px 12px;cursor:pointer}#notebook-simplified .search-toggle{width:48px;height:48px;border-radius:50%;background:var(--tile);font-size:26px}#notebook-simplified .row strong{line-height:1.15}#notebook-simplified .row small{margin-top:1px;line-height:1.25}#notebook-simplified .row .topic{margin-top:3px}#notebook-simplified .icon-action{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:13px;background:var(--tile);color:var(--text);font-size:21px;cursor:pointer}#notebook-simplified .actions{gap:10px}</style>
<div class="phone">
 <section class="screen phrase-screen" id="phrase-screen">
  <div class="phrase-copy"><div class="eyebrow">Redewendung der Woche</div><div class="phrase-title">Ich verstehe nur Bahnhof.</div><div class="literal">“I only understand train station.”</div><div class="meaning">I don’t understand a thing (≈ “It’s all Greek to me”).</div><div class="example">Der Lehrer erklärt das schon seit zehn Minuten, aber ich verstehe nur Bahnhof.</div></div>
  <button class="phrase-book" id="open-book">Notizbuch</button>
 </section>
 <section class="screen" id="book-screen" hidden>
  <div class="book-top"><button class="back" id="book-back">‹ Zurück</button><button class="theme-toggle" id="theme-toggle" aria-label="Farbschema wechseln">◐</button></div>
  <div class="book-kicker">Dein persönliches Deutsch</div>
  <div class="book-head"><h1 class="book-title">Notizbuch</h1><button class="search-toggle" id="search-toggle" aria-label="Suche öffnen" aria-expanded="false">⌕</button></div>
  <label class="search" id="search-box" hidden><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Notizen und Redewendungen suchen" aria-label="Notizbuch durchsuchen"></label>
  <nav class="tabs" role="tablist" aria-label="Notizbuch"><button class="tab" role="tab" aria-selected="true" data-view="all">Alles</button><button class="tab" role="tab" aria-selected="false" data-view="topics">Themen</button><button class="tab" role="tab" aria-selected="false" data-view="phrases">Redewendungen</button></nav>
  <div id="list-content"></div><button class="new-note" id="create-note">＋ Neue Notiz</button><div class="undo-toast" id="undo-toast" role="status" hidden>Notiz gelöscht <button id="undo-delete">Rückgängig</button></div>
 </section>
 <section class="screen" id="detail-screen" hidden><button class="back" id="detail-back">‹ Notizbuch</button><div class="field-label" id="detail-category"></div><h2 class="detail-title" id="detail-title"></h2><div class="detail-sub" id="detail-sub"></div><div class="detail-body" id="detail-body"></div><div class="actions" id="detail-actions"></div></section>
 <section class="screen" id="edit-screen" hidden><button class="back" id="edit-back">‹ Notizbuch</button><h2 class="form-title" id="form-title">Neue Notiz</h2><div class="form"><label class="field"><span class="field-label">Titel</span><input id="entry-title" placeholder="Titel"></label><label class="field"><span class="field-label">Notiz</span><textarea id="entry-body" placeholder="Was möchtest du dir merken?"></textarea></label><label class="field" id="category-field"><span class="field-label">Thema</span><select id="category-select"></select></label><button class="inline-add" id="add-topic">＋ Eigenes Thema anlegen</button><label class="field" id="new-topic-field" hidden><span class="field-label">Neues Thema</span><input id="new-topic-input" placeholder="Themenname"></label><button class="action" id="save-topic" hidden>Thema hinzufügen</button><button class="new-note" id="save-entry">Speichern</button></div></section>
</div>
<script>
(()=>{
 const root=document.getElementById('notebook-simplified'),$=id=>root.querySelector('#'+id);
 const items=[
  {id:'p1',title:'Ich verstehe nur Bahnhof.',sub:'“I only understand train station.”',body:'Meaning: I don’t understand a thing.\n\nDer Lehrer erklärt das schon seit zehn Minuten, aber ich verstehe nur Bahnhof.',category:'Redewendungen',phrase:true,personal:'Use when I’m completely lost in a conversation.'},
  {id:'n1',title:'Dativ nach mit',sub:'mit + Dativ',body:'Ich fahre mit dem Bus.\nIch spreche mit meiner Lehrerin.',category:'Grammatik'},
  {id:'n2',title:'Beim Bäcker',sub:'Nützliche Sätze für den Alltag',body:'Ich hätte gern zwei Brötchen.\nKann ich mit Karte zahlen?',category:'Alltag'},
  {id:'n3',title:'Wörter, die ich verwechsle',sub:'merken / sich erinnern',body:'sich erinnern an + Akkusativ',category:'Wortschatz'}
 ];
 let topics=['Grammatik','Alltag','Wortschatz'],view='all',topic='',query='',current=null,editId=null,deleted=null;
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const show=id=>{root.querySelectorAll('.screen').forEach(s=>s.hidden=true);$(id).hidden=false};
 function row(x){return `<button class="row" data-entry="${esc(x.id)}"><span><strong>${esc(x.title)}</strong>${x.phrase&&x.sub?`<small>${esc(x.sub)}</small>`:''}<span class="topic">${esc(x.category||'Ohne Thema')}</span></span><span class="arrow">›</span></button>`}
 function paint(){
  const found=items.filter(x=>(view==='all'||(view==='phrases'&&x.phrase)||(view==='topics'&&(!topic||x.category===topic)))&&(!query||[x.title,x.sub,x.body,x.category,x.personal||''].join(' ').toLowerCase().includes(query)));
  if(view==='topics'&&!topic&&!query){const names=[...new Set([...topics,...items.map(x=>x.category).filter(Boolean)])];$('list-content').innerHTML=names.map(t=>`<button class="row" data-topic="${esc(t)}"><span><strong>${esc(t)}</strong><small>${items.filter(x=>x.category===t).length} Einträge</small></span><span class="arrow">›</span></button>`).join('')||'<div class="empty">Lege beim Schreiben dein erstes Thema an.</div>'}
  else{$('list-content').innerHTML=(topic?'<button class="topic-back" id="topic-back">‹ Alle Themen</button>':'')+(found.map(row).join('')||'<div class="empty">Hier ist noch nichts gespeichert.</div>')}
  root.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));root.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;paint()});$('topic-back')?.addEventListener('click',()=>{topic='';paint()});
 }
 function openEntry(id){current=items.find(x=>x.id===id);$('detail-category').textContent=current.category||'';$('detail-title').textContent=current.title;$('detail-sub').textContent=current.sub||'';$('detail-sub').hidden=!current.phrase;$('detail-body').textContent=current.phrase?current.body+(current.personal?'\n\nMeine Notiz: '+current.personal:''):current.body;$('detail-actions').innerHTML=`<button class="icon-action" id="edit-entry" aria-label="${current.phrase?'Meine Notiz bearbeiten':'Bearbeiten'}" data-tooltip="${current.phrase?'Meine Notiz bearbeiten':'Bearbeiten'}">✎</button>${current.phrase?'':'<button class="icon-action" id="delete-entry" aria-label="Löschen" data-tooltip="Löschen">×</button>'}`;show('detail-screen');$('edit-entry').onclick=()=>editEntry(current);$('delete-entry')?.addEventListener('click',()=>{deleted={item:current,index:items.indexOf(current)};items.splice(deleted.index,1);show('book-screen');paint();$('undo-toast').hidden=false;setTimeout(()=>{$('undo-toast').hidden=true;deleted=null},5000)})}
 function options(){const cats=[...new Set([...topics,...items.map(x=>x.category).filter(Boolean)])];$('category-select').innerHTML='<option value="">Ohne Thema</option>'+cats.map(t=>`<option>${esc(t)}</option>`).join('')}
 function editEntry(item=null){editId=item?.id||null;options();$('form-title').textContent=item?(item.phrase?'Meine Notiz bearbeiten':'Notiz bearbeiten'):'Neue Notiz';$('entry-title').value=item&&!item.phrase?item.title:'';$('entry-title').closest('.field').hidden=!!item?.phrase;$('entry-body').value=item?(item.phrase?(item.personal||''):item.body):'';$('category-field').hidden=!!item?.phrase;$('add-topic').hidden=!!item?.phrase;$('category-select').value=item?.category||'';show('edit-screen')}
 root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;topic='';root.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t===b)));paint()});
 $('search-toggle').onclick=()=>{const box=$('search-box');box.hidden=!box.hidden;$('search-toggle').setAttribute('aria-expanded',String(!box.hidden));if(box.hidden){$('search-input').value='';query='';paint()}else $('search-input').focus()};$('search-input').oninput=()=>{query=$('search-input').value.trim().toLowerCase();topic='';paint()};
 $('open-book').onclick=()=>{show('book-screen');view='all';topic='';paint()};$('book-back').onclick=()=>show('phrase-screen');$('detail-back').onclick=()=>{show('book-screen');paint()};$('edit-back').onclick=()=>{show('book-screen');paint()};$('create-note').onclick=()=>editEntry();$('theme-toggle').onclick=()=>{root.style.colorScheme=root.style.colorScheme==='light'?'dark':'light'};$('undo-delete').onclick=()=>{if(deleted){items.splice(deleted.index,0,deleted.item);deleted=null;$('undo-toast').hidden=true;paint()}};
 $('add-topic').onclick=()=>{$('new-topic-field').hidden=false;$('save-topic').hidden=false;$('new-topic-input').focus()};$('save-topic').onclick=()=>{const name=$('new-topic-input').value.trim();if(name&&!topics.includes(name)){topics.push(name);options();$('category-select').value=name;$('new-topic-field').hidden=true;$('save-topic').hidden=true;$('new-topic-input').value=''}};
 $('save-entry').onclick=()=>{const body=$('entry-body').value.trim(),category=$('category-select').value;if(editId){const item=items.find(x=>x.id===editId);if(item.phrase)item.personal=body;else Object.assign(item,{title:$('entry-title').value.trim(),body,category,sub:category||'Eigene Notiz'})}else{const title=$('entry-title').value.trim();if(!title){$('entry-title').focus();return}items.unshift({id:'n'+Date.now(),title,body,category,sub:category||'Eigene Notiz'})}show('book-screen');paint()};
 paint();
})();
</script>
</div>
</body>
</html>
