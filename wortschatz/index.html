<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#1c1c1e;--text:#f3f1ed;--muted:#8c8c91;--mint:#43d2ad;--red:#ff6f73;--line:rgba(67,210,173,.45);--key:#242426;--keyline:#3b3b3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
button{font:inherit}
.app{width:min(760px,100%);margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:12px}
.brand{font:26px Georgia,serif;color:#aaa69f}.progress{height:3px;background:#292a2c;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#777;transition:width .2s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:clamp(38px,8vh,80px);text-align:center}
.topZone{width:min(620px,100%)}.sentence{font-size:clamp(28px,7vw,42px);line-height:1.28;letter-spacing:-.025em;max-width:620px}.blank{display:inline-block;width:1.87em;height:.82em;border-bottom:2px solid rgba(243,241,237,.72);vertical-align:baseline;margin:0 .08em}.translation{margin-top:28px;color:var(--muted);font-size:clamp(16px,4.2vw,22px)}
.inputbox{margin-top:34px;width:min(620px,100%);height:64px;border:1.5px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;outline:none;background:#222225;color:var(--text);text-align:center;caret-color:var(--mint)}
.inputbox:focus{border-color:var(--mint)}
.check{margin-top:14px;width:min(620px,100%);border:0;border-radius:16px;padding:16px;background:#eee8df;color:#18181a;font-weight:750;font-size:17px}
.feedback{display:none;width:min(690px,100%);position:relative;isolation:isolate;border:1px solid rgba(255,255,255,.10);border-radius:28px;background:#202023;padding:30px 24px 24px;overflow:hidden;transform-origin:center center}
@media(max-width:699px){
 .feedback.show{touch-action:pan-y;will-change:transform,opacity}
 .feedback.swiping{transition:none}
 .feedback.snapback{transition:transform .19s cubic-bezier(.2,.8,.2,1),opacity .19s ease}
 .feedback.swipeout{transition:transform .19s cubic-bezier(.4,0,.7,.2),opacity .16s ease}
} .feedback.show{display:block}
.feedbackShell{display:none;width:min(690px,100%);flex-direction:column;align-items:center;transform-origin:center center;margin-top:-30px}
.feedbackShell.show{display:flex}
.feedbackShell .feedback{width:100%}
.feedbackShell .continue{margin-top:18px}
@media(max-width:699px){.feedbackShell{touch-action:pan-y;will-change:transform,opacity}}
@keyframes glowIn{from{opacity:0}to{opacity:1}}
.answerSentence{font-size:clamp(28px,7vw,42px);line-height:1.28;letter-spacing:-.025em;max-width:620px;margin:0 auto}.answerSentence .target{font-weight:600}.feedback.good .answerSentence .target{color:var(--mint)}.feedback.bad .answerSentence .target{color:var(--text)}
.answerTranslation{margin-top:18px;color:var(--muted);font-size:clamp(17px,4.2vw,22px)}
.targetForm{display:inline-block;margin-top:22px;color:var(--mint);font:36px Georgia,serif;background:rgba(67,210,173,.06);padding:1px 5px}.feedback.bad .targetForm{display:none}
.diffBlock{display:none;margin-top:26px;padding-bottom:28px;font:32px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;line-height:1.25}.feedback.bad .diffBlock{display:block}.diffWord{display:inline-block;padding:2px 5px;background:rgba(255,255,255,.025)}.diffSame{color:var(--mint)}.diffWrong{color:#ff8589;background:rgba(255,91,98,.10)}.diffMissing{color:var(--red);background:rgba(255,91,98,.10)}.diffArrow{margin:1px 0;color:#e8d9d9;font:24px/1 sans-serif}.diffCorrect{color:#ddd}.diffCorrect .diffSame{color:var(--mint)}
.answerTargetRow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:0}.answerTargetRow .base{margin:0}.answerTargetRow .speak{margin:0;flex:0 0 auto}.speak{display:block;margin:10px auto 18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.09);background:transparent;color:#aabdb7;font-size:21px}
.detail{position:relative;border-top:1px solid #444448;padding-top:24px;color:#aaa;text-align:center;isolation:isolate}.detail::before{content:"";position:absolute;left:50%;top:-1px;width:0;height:1px;transform:translateX(-50%);background:var(--mint);box-shadow:0 0 14px rgba(67,210,173,.3);z-index:2}.feedback.bad .detail::before{background:var(--red);box-shadow:0 0 14px rgba(255,91,98,.34)}.feedback.show .detail::before{animation:lineGrow .62s cubic-bezier(.2,.8,.2,1) forwards}.detail::after{content:"";position:absolute;z-index:-1;left:50%;top:0;width:min(760px,110vw);height:360px;transform:translate(-50%,-50%);pointer-events:none;opacity:0}.feedback.good .detail::after{background:radial-gradient(ellipse,rgba(67,210,173,.24) 0%,rgba(67,210,173,.12) 28%,rgba(67,210,173,.04) 52%,transparent 74%);animation:glowIn .65s ease forwards}.feedback.bad .detail::after{background:radial-gradient(ellipse,rgba(255,91,98,.34) 0%,rgba(255,91,98,.17) 30%,rgba(255,91,98,.055) 55%,transparent 76%);animation:glowIn .65s ease forwards}@keyframes lineGrow{to{width:100%}}
.base{font-size:25px;margin-bottom:10px}.meaning{font-size:20px;color:#8d9996}.grammar{margin-top:14px;font-size:14px;color:#737a78}
.continue{margin-top:26px;width:min(620px,100%);border:0;border-radius:16px;padding:16px;background:#eee8df;color:#18181a;font-weight:750;font-size:17px}
.keyboard{display:none;width:100%;margin-top:20px;padding-top:12px}
.keyboard.show{display:block}.row{display:flex;justify-content:center;gap:3px;margin-bottom:5px}.key{height:44px;width:calc((100% - 27px)/10);flex:0 0 calc((100% - 27px)/10);min-width:0;border:1px solid var(--keyline);border-radius:10px;background:var(--key);color:#eee;font-size:20px}.row.third{justify-content:flex-end}.row.third .back{margin-left:0;flex:0 0 calc(2 * ((100% - 27px)/10) + 3px);width:calc(2 * ((100% - 27px)/10) + 3px)}.row.special{width:100%;justify-content:center;gap:3px}.row.special .key{color:#b8ddd2}.row.special .space{flex:1 1 auto;width:auto;color:#eee}.row.special .ok{margin-left:0;flex:0 0 calc(2.5 * ((100% - 27px)/10) + 4.5px);width:calc(2.5 * ((100% - 27px)/10) + 4.5px);color:var(--mint);border-color:color-mix(in srgb,var(--mint) 55%,transparent);font-size:22px;font-weight:500}
@media(max-width:699px){.keyboard .key{transform:scale(1);transform-origin:center;transition:transform .09s ease,background-color .09s ease,border-color .09s ease;will-change:transform}.keyboard .key:active,.keyboard .key.is-pressed{transform:scale(1.08);background:#303034;border-color:#56565c;position:relative;z-index:3}.keyboard .key.ok:active,.keyboard .key.ok.is-pressed{border-color:var(--mint)}}
.done{display:none;flex:1;align-items:center;justify-content:center;text-align:center}.done.show{display:flex}.done h1{font:46px Georgia,serif;margin:0 0 15px}.done p{color:var(--muted);font-size:18px;margin:0}.doneScore{margin-top:18px;color:#f3f1ed;font-size:17px}.addWords{margin:30px auto 0;width:min(360px,82vw);border:1px solid #444448;border-radius:16px;padding:15px 18px;background:#242426;color:#f3f1ed;font-weight:700;font-size:16px}.allAdded{display:none;margin-top:25px;color:var(--muted);font-size:15px}
.version{text-align:center;color:#4f4f53;font-size:10px;margin-top:18px}
@media(max-width:699px){.app{padding-left:16px;padding-right:16px}.stage{padding-top:34px}#question{display:flex!important;flex-direction:column;align-items:center;width:100%}#question .topZone{order:1}#question .inputbox{order:3}#question .check{order:4}#question .keyboard{order:5}.topZone{width:min(620px,100%)}.feedback .topZone{width:100%}.sentence,.answerSentence{font-size:28px}.topZone .sentence,.topZone .answerSentence{min-height:2.56em}.translation{font-size:17px;margin-top:28px}.answerTranslation{font-size:17px}.inputbox{height:60px;margin-top:28px}.check{display:none}.keyboard{display:none}.keyboard.show{display:block}.targetForm{margin-top:0}.diffBlock{margin-top:22px;padding-bottom:26px;font-size:28px}.answerTargetRow{margin-top:0}.speak{margin:0;width:42px;height:42px}.detail{padding-top:24px}}
@media(min-width:700px){.keyboard{display:none!important}}
</style>
</head>
<body><main class="app">
<header><div class="top"><span class="brand">Wortschatz.</span><span id="counter"></span></div><div class="progress"><div id="bar"></div></div></header>
<section class="stage" id="study">
 <div id="question">
  <div class="topZone">
   <div class="sentence" id="sentence"></div>
   <div class="translation" id="translation"></div>
  </div>
  <input id="answerInput" class="inputbox" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="none">
  <button class="check" id="desktopCheck">Check</button>
  <div class="keyboard" id="keyboard">
   <div class="row" data-keys="QWERTYUIOP"></div>
   <div class="row" data-keys="ASDFGHJKL"></div>
   <div class="row third" data-keys="ßZXCVBNM"><button class="key back" data-key="BACK">⌫</button></div>
   <div class="row special"><button class="key" data-key="ä">ä</button><button class="key" data-key="ö">ö</button><button class="key" data-key="ü">ü</button><button class="key space" data-key="SPACE" aria-label="Space">&nbsp;</button><button class="key ok" data-key="OK">✓</button></div>
  </div>
 </div>
 <div class="feedbackShell" id="feedbackShell">
  <div class="feedback" id="feedback">
   <div class="topZone">
    <div class="answerSentence" id="answerSentence"></div>
    <div class="answerTranslation" id="answerTranslation"></div>
   </div>
   <div class="diffBlock" id="diffBlock"><div class="diffWord" id="typedDiff"></div><div class="diffArrow">↓</div><div class="diffWord diffCorrect" id="correctDiff"></div></div>
   <div class="detail">
    <div class="answerTargetRow"><div class="base" id="base"></div><button class="speak" id="speak" aria-label="Hear sentence">▶</button></div>
    <div class="meaning" id="meaning"></div>
    <div class="grammar" id="grammar"></div>
   </div>
  </div>
  <button class="continue" id="continue">Continue</button>
 </div>
</section>
<section class="done" id="done"><div><h1>Done for today.</h1><p>Come back tomorrow.</p><div class="doneScore" id="doneScore"></div><button class="addWords" id="addWords">+ Add 5 new words</button><div class="allAdded" id="allAdded">All words are already in your deck.</div></div></section>
<div class="version">v2.18</div>
</main>
<script src="words.js"></script>
<script>
const $=id=>document.getElementById(id), STORE="wortsternSRSv03", HOME_STATS="deutschHomeStatsV1";

function publishWortschatzStatus(done=false){
  try{
    const today=day();
    const allDue=activeCards().filter(c=>rec(c).due<=today);
    const status={
      date:today,
      done:!!done || allDue.length===0,
      remaining:allDue.length,
      updatedAt:Date.now()
    };
    const home=JSON.parse(localStorage.getItem(HOME_STATS)||"{}");
    home.wortschatz=status;
    localStorage.setItem(HOME_STATS,JSON.stringify(home));
  }catch(e){}
}
// Simple SRS: first success -> tomorrow, then +8, +20, +45, +90 days.
// A mistake resets the card: it stays in today's session until answered correctly, then returns tomorrow.
const steps=[1,8,20,45,90];
const INITIAL_WORDS=10, ADD_BATCH=5;
let state={cards:{},activeIds:[]};
try{const saved=JSON.parse(localStorage.getItem(STORE)||"null");if(saved&&saved.cards&&Array.isArray(saved.activeIds))state=saved}catch(e){}
const day=()=>{let d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)}
const add=n=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function ensureDeck(){
 if(!state.activeIds.length){state.activeIds=WORDS.slice(0,INITIAL_WORDS).map(c=>c.id);save()}
}
function rec(c){
 if(!state.cards[c.id])state.cards[c.id]={level:0,due:day()};
 return state.cards[c.id];
}
let queue=[],idx=0,current=null,sessionTotal=0,completed=0,failedToday=new Set(),closedToday=new Set();
function normalize(s){return s.trim().toLocaleLowerCase("de-DE").replace(/\s*,\s*/g," ").replace(/\s+/g," ")}
function targetParts(c){return (c.target||"").split(" / ").map(x=>x.trim()).filter(Boolean)}
function targets(c){
 const parts=targetParts(c);
 // With several blanks, the slash separates the pieces of ONE separable verb,
 // not alternative answers. The learner types both pieces in one field.
 if((c.blank.match(/_____/g)||[]).length>1)return [parts.join(" ")];
 return parts;
}
function activeCards(){const ids=new Set(state.activeIds);return WORDS.filter(c=>ids.has(c.id))}
function build(cards=null){
 ensureDeck();
 queue=(cards||activeCards().filter(c=>rec(c).due<=day())).sort(()=>Math.random()-.5);
 idx=0;sessionTotal=queue.length;completed=0;failedToday=new Set();closedToday=new Set();
 publishWortschatzStatus(queue.length===0);
 render();
}
function blankHTML(c){return c.blank.replace(/_____/g,"<span class='blank' aria-label='missing word'></span>")}
function revealHTML(c){
 let escaped=c.revealed.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const ts=targetParts(c); for(const t of ts){let e=t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");escaped=escaped.replace(new RegExp(e),"<span class='target'>"+t+"</span>")}
 return escaped;
}
function render(){
 if(idx>=queue.length){showDone();return}
 current=queue[idx];$("counter").textContent=`${completed} / ${sessionTotal} today`;$("bar").style.width=`${sessionTotal?completed/sessionTotal*100:100}%`;
 $("sentence").innerHTML=blankHTML(current);$("translation").textContent=current.ru;$("answerInput").value="";
 $("question").style.display="block";$("feedback").className="feedback";$("feedbackShell").className="feedbackShell";$("feedbackShell").style.transform="";$("feedbackShell").style.opacity="";$("keyboard").className="keyboard"+(innerWidth<700?" show":"");
 if(innerWidth>=700)setTimeout(()=>$("answerInput").focus(),30);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function diffHTML(typed,correct){
 const a=[...typed],b=[...correct],m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m;i>=0;i--)for(let j=n;j>=0;j--){if(i===m)dp[i][j]=n-j;else if(j===n)dp[i][j]=m-i;else if(a[i]===b[j])dp[i][j]=dp[i+1][j+1];else dp[i][j]=1+Math.min(dp[i+1][j+1],dp[i+1][j],dp[i][j+1])}
 let i=0,j=0,top=[],bottom=[];
 while(i<m||j<n){
  if(i<m&&j<n&&a[i]===b[j]){top.push(`<span class="diffSame">${esc(a[i])}</span>`);bottom.push(`<span class="diffSame">${esc(b[j])}</span>`);i++;j++;continue}
  const sub=i<m&&j<n?dp[i+1][j+1]:1e9,del=i<m?dp[i+1][j]:1e9,ins=j<n?dp[i][j+1]:1e9;
  if(sub<=del&&sub<=ins){top.push(`<span class="diffWrong">${esc(a[i])}</span>`);bottom.push(`<span class="diffMissing">${esc(b[j])}</span>`);i++;j++}
  else if(del<=ins){top.push(`<span class="diffWrong">${esc(a[i])}</span>`);i++}
  else{bottom.push(`<span class="diffMissing">${esc(b[j])}</span>`);j++}
 }
 return [top.join(""),bottom.join("")];
}
function check(){
 let typed=normalize($("answerInput").value);if(!typed)return;
 const opts=targets(current), matched=opts.find(t=>normalize(t)===typed);
 let ok=!!matched;
 // For an error, compare against the closest accepted answer so the highlighted difference is useful.
 let correct=opts[0]||"";
 if(!ok&&opts.length>1){
   const distance=(x,y)=>{const a=[...normalize(x)],b=[...normalize(y)],d=Array.from({length:a.length+1},(_,i)=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
   correct=[...opts].sort((x,y)=>distance(typed,x)-distance(typed,y))[0];
 } else if(ok) correct=matched;
 $("question").style.setProperty("display","none","important");$("keyboard").classList.remove("show");$("feedbackShell").className="feedbackShell show";$("feedback").className="feedback show "+(ok?"good":"bad");$("answerSentence").innerHTML=revealHTML(current);
 $("answerTranslation").textContent=current.ru;
 if(!ok){const [top,bottom]=diffHTML(typed,normalize(correct));$("typedDiff").innerHTML=top;$("correctDiff").innerHTML=bottom}else{$("typedDiff").innerHTML="";$("correctDiff").innerHTML=""}
 $("base").textContent=current.base;$("meaning").textContent=current.translation;$("grammar").textContent=current.grammar||"";
 const r=rec(current);
 if(ok){
   if(failedToday.has(current.id)){r.level=0;r.due=add(1)}
   else{r.level=Math.min(r.level+1,steps.length);r.due=add(steps[Math.min(r.level-1,steps.length-1)])}
   if(!closedToday.has(current.id)){closedToday.add(current.id);completed++}
 } else {
   failedToday.add(current.id);
   r.level=0;r.due=day();
   // Reinsert once at the end. It remains one of today's unique cards, so the total never grows.
   if(!queue.slice(idx+1).some(c=>c.id===current.id))queue.push(current);
 }
 save();
}
function showDone(){
 publishWortschatzStatus(true);
 $("study").style.display="none";$("done").className="done show";$("counter").textContent=`${sessionTotal} / ${sessionTotal} today`;$("bar").style.width="100%";
 $("doneScore").textContent=sessionTotal?`${sessionTotal} / ${sessionTotal} complete`:"Nothing due right now.";
 const remaining=WORDS.filter(c=>!state.activeIds.includes(c.id)).length;
 $("addWords").style.display=remaining?"block":"none";$("allAdded").style.display=remaining?"none":"block";
}
function addFive(){
 const fresh=WORDS.filter(c=>!state.activeIds.includes(c.id)).slice(0,ADD_BATCH);if(!fresh.length)return;
 fresh.forEach(c=>{state.activeIds.push(c.id);state.cards[c.id]={level:0,due:day()}});save();publishWortschatzStatus(false);
 $("done").className="done";$("study").style.display="flex";build(fresh);
}
function next(){idx++;render()}
$("addWords").onclick=addFive;
$("desktopCheck").onclick=check;$("continue").onclick=next;
document.addEventListener("keydown",e=>{
 if(e.key!=="Enter"||innerWidth<700)return;
 if(!$("feedback").classList.contains("show"))return;
 e.preventDefault();next();
});
$("answerInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();check()}});
// Keyboard press feedback
(()=>{const kb=$("keyboard");if(!kb)return;const release=()=>kb.querySelectorAll(".key.is-pressed").forEach(k=>k.classList.remove("is-pressed"));kb.addEventListener("touchstart",e=>{const key=e.target.closest(".key");if(key)key.classList.add("is-pressed")},{passive:true});kb.addEventListener("touchend",release,{passive:true});kb.addEventListener("touchcancel",release,{passive:true})})();
// Mobile reveal navigation: Tinder-like drag left for the next word.
(()=>{
 const panel=$("feedback"),shell=$("feedbackShell");
 let startX=0,startY=0,lastX=0,startT=0,tracking=false,horizontal=false,finishing=false;

 const clean=()=>{
   tracking=false; horizontal=false;
   shell.classList.remove("swiping","snapback","swipeout");
   shell.style.transform="";
   shell.style.opacity="";
 };

 const snapBack=()=>{
   tracking=false; horizontal=false;
   shell.classList.remove("swiping","swipeout");
   shell.classList.add("snapback");
   shell.style.transform="";
   shell.style.opacity="";
   setTimeout(()=>shell.classList.remove("snapback"),190);
 };

 const goNext=()=>{
   if(finishing)return;
   finishing=true; tracking=false;
   shell.classList.remove("swiping","snapback");
   shell.classList.add("swipeout");
   shell.style.transform="translateX(-115vw) rotate(-8deg) scale(.92)";
   shell.style.opacity="0";
   setTimeout(()=>{
     clean();
     finishing=false;
     next();
   },190);
 };

 shell.addEventListener("touchstart",e=>{
   if(innerWidth>=700||!shell.classList.contains("show")||finishing||e.touches.length!==1)return;
   // Interactive controls must remain normal taps, never swipe starters.
   if(e.target.closest("button,a,input,textarea,select"))return;
   const t=e.touches[0];
   startX=lastX=t.clientX;
   startY=t.clientY;
   startT=performance.now();
   tracking=true;
   horizontal=false;
 },{passive:true});

 shell.addEventListener("touchmove",e=>{
   if(!tracking||e.touches.length!==1)return;
   const t=e.touches[0];
   const dx=t.clientX-startX;
   const dy=t.clientY-startY;
   lastX=t.clientX;

   // Do nothing during tiny finger jitter: a tap stays a tap.
   if(!horizontal){
     if(Math.hypot(dx,dy)<12)return;
     if(dx>=0){tracking=false;return;}
     if(Math.abs(dy)>Math.abs(dx)*1.25){tracking=false;return;}
     horizontal=true;
   }

   e.preventDefault();
   const left=Math.min(0,dx);
   shell.classList.add("swiping");
   // Card follows the finger continuously, Tinder-style.
   const shrink=Math.max(.93,1-Math.abs(left)/1800); shell.style.transform=`translateX(${left}px) rotate(${left/48}deg) scale(${shrink})`;
   shell.style.opacity=String(Math.max(.55,1-Math.abs(left)/520));
 },{passive:false});

 shell.addEventListener("touchend",()=>{
   if(!tracking)return;
   const dx=lastX-startX;
   const elapsed=Math.max(1,performance.now()-startT);
   const speed=-dx/elapsed;

   // Commit only after a real drag, or a clearly intentional fast flick.
   if(horizontal && (dx<=-78 || (dx<=-42 && speed>.55))) goNext();
   else snapBack();
 },{passive:true});

 shell.addEventListener("touchcancel",snapBack,{passive:true});
})();
$("speak").onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(current.revealed);u.lang="de-DE";u.rate=.88;speechSynthesis.speak(u)};
document.querySelectorAll(".row[data-keys]").forEach(row=>{const back=row.querySelector(".back");for(const ch of row.dataset.keys){let b=document.createElement("button");b.className="key";b.dataset.key=ch.toLowerCase();b.textContent=ch;row.insertBefore(b,back)}});
$("keyboard").addEventListener("click",e=>{let b=e.target.closest("[data-key]");if(!b)return;let k=b.dataset.key,input=$("answerInput");if(k==="BACK"){input.value=input.value.slice(0,-1);return}if(k==="OK"){check();return}if(k==="SPACE"){if(input.value.length&&!input.value.endsWith(" "))input.value+=" ";return}input.value+=k});
