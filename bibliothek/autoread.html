<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Автотест чтения</title>
<style>
  /* Test page for the reader (26.10.2026): opens bibliothek.html in a frame and "reads" the open book by itself — taps
     words, waits for the card, closes it, turns pages — for a set time, and records the time of every tap and reloads
     of the tab. Memory of Safari is recorded by the Web Inspector on the Mac (Timelines → Memory) at the same time.
     The reader and the resolver are not changed; this page only clicks inside the frame (same site). */
  :root { --bg:#f6f3ec; --fg:#222; --muted:#666; --line:#d8d2c4; --accent:#2d6a4f; --warn:#a4161a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1d1b; --fg:#eee; --muted:#aaa; --line:#444; --accent:#74c69d; --warn:#ff8585; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.35 -apple-system, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  #panel { padding:8px 12px calc(8px + env(safe-area-inset-top,0)) ; padding-top:calc(8px + env(safe-area-inset-top,0)); border-bottom:1px solid var(--line); }
  #row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, select { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #status { margin-top:6px; color:var(--muted); font-size:13px; min-height:1.3em; }
  #status.warn { color:var(--warn); }
  #frame { flex:1; width:100%; border:0; }
  #result { display:none; flex:1; overflow:auto; padding:12px; }
  #result textarea { width:100%; height:60vh; font:12px/1.4 ui-monospace, Menlo, monospace; background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  body.done #frame { display:none; } body.done #result { display:block; }
</style>
</head>
<body>
<div id="panel">
  <div id="row">
    <button id="start" class="primary" type="button">Старт</button>
    <select id="minutes" aria-label="Длительность">
      <option value="5">5 мин</option><option value="16" selected>16 мин</option><option value="30">30 мин</option>
    </select>
    <button id="stop" type="button" hidden>Стоп</button>
    <button id="show" type="button" hidden>Результат</button>
  </div>
  <div id="status">Откройте книгу в окне ниже (с начала главы), затем нажмите «Старт».</div>
</div>
<iframe id="frame" src="bibliothek.html" title="Читалка"></iframe>
<div id="result">
  <p><button id="copy" class="primary" type="button">Скопировать результат</button> <button id="back" type="button">Назад к читалке</button></p>
  <textarea id="text" readonly></textarea>
</div>
<script>
(() => {
  'use strict';
  const KEY = 'deutschAutoreadV1';
  const TAPS_PER_PAGE = 6, PAUSE_MS = 3000, CARD_SHOW_MS = 1200, TAP_TIMEOUT_MS = 30000;
  const $ = id => document.getElementById(id);
  const frame = $('frame'), status = $('status');
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (_) { return null; } };
  const save = run => { try { localStorage.setItem(KEY, JSON.stringify(run)); } catch (_) {} };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const say = (text, warn) => { status.textContent = text; status.classList.toggle('warn', !!warn); };
  let run = load(), stopping = false, wakeLock = null;
  // ?minutes=N adds a custom duration (short trial runs).
  const custom = +new URLSearchParams(location.search).get('minutes');
  if (custom > 0) $('minutes').add(new Option(custom + ' мин', String(custom), true, true));

  // A run that was still "running" when this page loaded: the tab was reloaded (iOS drops a tab that used too much
  // memory). Count it and keep the taps recorded so far.
  if (run && run.state === 'running') {
    run.reloads.push({at: Date.now(), minute: +((Date.now() - run.started) / 60000).toFixed(1), taps: run.taps.length});
    run.state = 'interrupted'; save(run);
    say(`Вкладка перезагрузилась во время теста (через ${run.reloads.at(-1).minute} мин, после ${run.taps.length} нажатий). «Результат» — что успели записать; «Старт» — новый тест.`, true);
    $('show').hidden = false;
  } else if (run && run.state === 'finished') { $('show').hidden = false; }

  const cacheStats = () => { try { const st = frame.contentWindow.BibliothekDataCache?.stats;
    return st ? {stalled: st.stalled, slow: st.slow.map(x => ({kind: x.kind, ms: x.ms})), keys: st.keys.map(x => ({ms: x.ms, n: x.n}))} : null; } catch (_) { return null; } };
  // Seeded choice of words, so two runs on the same book and page tap the same words.
  let seed = 1;
  const random = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };

  function reader() {
    const doc = frame.contentDocument;
    if (!doc || doc.getElementById('reading-view')?.hidden !== false) return null;
    return doc;
  }
  function visibleWords(doc) {
    const view = doc.getElementById('page-viewport')?.getBoundingClientRect();
    if (!view) return [];
    return [...doc.querySelectorAll('#reading-text .reading-word')].filter(w => {
      const r = w.getBoundingClientRect();
      return r.width > 0 && r.left >= view.left - 1 && r.right <= view.right + 1 && r.top >= view.top - 1 && r.bottom <= view.bottom + 1 && /\p{L}{2,}/u.test(w.textContent);
    });
  }
  function cardReady(doc) {
    const pop = doc.getElementById('word-popover');
    return pop && !pop.hidden && pop.getAttribute('aria-busy') === 'false' && !pop.querySelector('.popover-loading');
  }
  // Breakdown of a tap (07.11.2026, v3): what the time went to, without Web Inspector (it changes speed and memory).
  // Network: the reader's requests that started during the tap (Resource Timing of its frame) — how many, in how many
  // waves one after another (a request that starts after all earlier ones ended), the time any of them was open, the
  // longest wait before a request was sent (requestStart − startTime: the ~1 s seen in Web Inspector) and the longest
  // server wait. Busy: how long the page did not run its timers (a 20 ms timer late by more than 30 ms) — work on the
  // page itself: the resolver, layout.
  function breakdown(win, t0, t1, busy) {
    let list = [];
    try { list = win.performance.getEntriesByType('resource').filter(e => e.startTime >= t0 - 5 && e.startTime <= t1); } catch (_) {}
    list.sort((a, b) => a.startTime - b.startTime);
    let waves = 0, open = 0, end = -1, cover = 0, from = 0, queue = 0, server = 0;
    for (const e of list) {
      if (e.startTime > end + 2) { waves++; if (end >= 0) cover += end - from; from = e.startTime; }
      end = Math.max(end, e.responseEnd || e.startTime + e.duration);
      if (e.requestStart > 0) queue = Math.max(queue, e.requestStart - e.startTime);
      if (e.requestStart > 0 && e.responseStart > 0) server = Math.max(server, e.responseStart - e.requestStart);
    }
    if (end >= 0) cover += end - from;
    open = cover;
    // the data cache (v4, 07.11): its steps slower than 200 ms and its entry counts during the tap
    let slow = [], keys = [];
    try { const st = win.BibliothekDataCache?.stats;
      if (st) { slow = st.slow.filter(x => x.at >= t0 - 5 && x.at <= t1); keys = st.keys.filter(x => x.at <= t1 && x.at + x.ms >= t0); } } catch (_) {}
    return {n: list.length, waves, net: Math.round(open), queue: Math.round(queue), server: Math.round(server), busy: Math.round(busy),
      cs: slow.length, cmax: slow.reduce((m, x) => Math.max(m, x.ms), 0), ck: keys.reduce((m, x) => Math.max(m, x.ms), 0)};
  }
  async function tap(doc, word) {
    const win = doc.defaultView, started = performance.now(), t0 = win.performance.now();
    let busy = 0, last = performance.now();
    const watch = setInterval(() => { const now = performance.now(), late = now - last - 20; if (late > 30) busy += late; last = now; }, 20);
    word.click();
    while (!cardReady(doc)) {
      if (performance.now() - started > TAP_TIMEOUT_MS) { clearInterval(watch); return {ms: null}; }
      await sleep(20);
    }
    clearInterval(watch);
    const ms = Math.round(performance.now() - started);
    return {ms, parts: breakdown(win, t0, win.performance.now(), busy)};
  }
  async function closeCard(doc) {
    doc.getElementById('popover-close')?.click();
    await sleep(150);
  }
  async function nextPage(doc) {
    const before = doc.getElementById('page-status')?.textContent + '|' + visibleWords(doc).slice(0, 3).map(w => w.dataset.tokenOffset).join(',');
    doc.getElementById('page-next')?.click();
    await sleep(900);
    const after = doc.getElementById('page-status')?.textContent + '|' + visibleWords(doc).slice(0, 3).map(w => w.dataset.tokenOffset).join(',');
    return before !== after;
  }

  // Traffic (07.11.2026): what the reader really downloads — Resource Timing of the reader's frame (a file from the data
  // cache or the HTTP cache is not counted: no network). transferSize where the browser gives it, else the encoded size.
  const netKind = url => /dictionary-de-json\/parts\//.test(url) ? 'части внешнего словаря' : /dictionary-de-ru-json\/parts\//.test(url) ? 'части русского словаря'
    : /fallback-verb-forms\/\d/.test(url) ? 'части форм глагола' : /\/worterbuch\//.test(url) ? 'наши словари' : /\.json(\?|$)/.test(url) ? 'другие данные' : 'код, страница, стили';
  let netObserver = null;
  function watchTraffic(doc) {
    try {
      const win = doc.defaultView;
      win.performance.setResourceTimingBufferSize?.(100000);
      netObserver?.disconnect();
      netObserver = new win.PerformanceObserver(list => {
        if (!run || run.state !== 'running') return;
        for (const e of list.getEntries()) {
          const bytes = e.transferSize > 0 ? e.transferSize : (e.transferSize === 0 ? 0 : (e.encodedBodySize || 0));
          if (!bytes) continue;
          const m = Math.floor((Date.now() - run.started) / 60000), k = netKind(e.name), n = run.net;
          n.bytes += bytes; n.requests++; n.byMinute[m] = (n.byMinute[m] || 0) + bytes;
          n.byKind[k] = n.byKind[k] || [0, 0]; n.byKind[k][0] += bytes; n.byKind[k][1]++;
        }
      });
      netObserver.observe({type: 'resource', buffered: false});
      run.net.measured = true;
    } catch (_) { run.net.measured = false; }
  }

  async function start() {
    const doc = reader();
    if (!doc) { say('Сначала откройте книгу в окне ниже.', true); return; }
    const minutes = +$('minutes').value;
    run = {version: 1, state: 'running', started: Date.now(), minutes, ua: navigator.userAgent,
      book: doc.title.replace(/\s*·\s*Bibliothek\s*$/u, ''),
      page: doc.getElementById('page-status')?.textContent?.trim() || '', taps: [], reloads: [], pages: 0, timeouts: 0,
      net: {bytes: 0, requests: 0, byMinute: {}, byKind: {}}};
    watchTraffic(doc);
    save(run); stopping = false; seed = 1;
    $('start').hidden = true; $('stop').hidden = false; $('show').hidden = true; $('minutes').disabled = true;
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) { wakeLock = null; }
    const end = run.started + minutes * 60000;
    let lastSave = 0;
    while (!stopping && Date.now() < end) {
      const page = reader();
      if (!page) { say('Читалка закрыла книгу — тест остановлен.', true); break; }
      const words = visibleWords(page);
      for (let i = 0; i < TAPS_PER_PAGE && words.length && !stopping && Date.now() < end; i++) {
        const word = words[Math.floor(random() * words.length)];
        const {ms, parts} = await tap(page, word);
        if (ms === null) run.timeouts++;
        run.taps.push({t: Math.round((Date.now() - run.started) / 1000), w: word.textContent, ms, ...(parts ? {b: parts} : {})});
        await sleep(CARD_SHOW_MS);
        await closeCard(page);
        const left = Math.max(0, Math.round((end - Date.now()) / 60000));
        say(`Идёт тест: ${run.taps.length} нажатий, последнее ${ms === null ? 'не дождались' : ms + ' мс'}, страниц ${run.pages}, осталось ~${left} мин. Не трогайте телефон.`);
        if (Date.now() - lastSave > 5000) { run.cache = cacheStats(); save(run); lastSave = Date.now(); }
        await sleep(PAUSE_MS);
      }
      if (stopping || Date.now() >= end) break;
      if (!(await nextPage(page))) { say('Книга (или глава) закончилась — тест остановлен раньше.', true); break; }
      run.pages++;
    }
    run.state = 'finished'; run.ended = Date.now(); run.cache = cacheStats(); save(run);
    try { await wakeLock?.release(); } catch (_) {}
    $('start').hidden = false; $('stop').hidden = true; $('minutes').disabled = false; $('show').hidden = false;
    showResult();
  }

  const median = a => { const s = [...a].sort((x, y) => x - y); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : Math.round((s[s.length / 2 - 1] + s[s.length / 2]) / 2)) : '—'; };
  const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.min(s.length - 1, Math.ceil(s.length * p) - 1)] : '—'; };
  function report(r) {
    const ms = r.taps.map(t => t.ms).filter(x => x !== null);
    const lines = [
      'Автотест чтения (bibliothek/autoread.html, v4)',
      `Дата: ${new Date(r.started).toLocaleString('ru-RU')}`,
      `Книга: ${r.book}${r.page ? ' · начало: ' + r.page : ''}`,
      `Задано: ${r.minutes} мин; прошло: ${(((r.ended || Date.now()) - r.started) / 60000).toFixed(1)} мин; состояние: ${r.state}`,
      `Нажатий: ${r.taps.length}; страниц перевёрнуто: ${r.pages}; не дождались карточки (>${TAP_TIMEOUT_MS / 1000} с): ${r.timeouts}`,
      `Перезагрузки вкладки: ${r.reloads.length ? r.reloads.map(x => `на ${x.minute} мин после ${x.taps} нажатий`).join('; ') : 'нет'}`,
      `Время до карточки: медиана ${median(ms)} мс, p90 ${pct(ms, .9)} мс, p95 ${pct(ms, .95)} мс, максимум ${ms.length ? Math.max(...ms) : '—'} мс`,
    ];
    const mb = b => (b / 1048576).toFixed(2) + ' МБ';
    if (r.net?.measured) {
      const minutes = Math.max(1, ((r.ended || Date.now()) - r.started) / 60000);
      lines.push(`Скачано: ${mb(r.net.bytes)} за ${r.net.requests} запросов (${mb(r.net.bytes / minutes)} в минуту; без кэша данных и кэша браузера)`);
      for (const [k, [b, n]] of Object.entries(r.net.byKind).sort((a, b) => b[1][0] - a[1][0])) lines.push(`  ${k}: ${mb(b)}, ${n}`);
    } else if (r.net) lines.push('Скачано: браузер не дал посчитать');
    lines.push('', 'По минутам (минута: нажатий, медиана, максимум' + (r.net?.measured ? ', скачано' : '') + '):');
    const byMinute = new Map();
    for (const t of r.taps) { const m = Math.floor(t.t / 60); if (!byMinute.has(m)) byMinute.set(m, []); byMinute.get(m).push(t.ms); }
    for (const [m, a] of byMinute) { const ok = a.filter(x => x !== null); lines.push(`  ${String(m + 1).padStart(2)}: ${a.length}, ${median(ok)} мс, ${ok.length ? Math.max(...ok) : '—'} мс${a.length - ok.length ? `, не дождались ${a.length - ok.length}` : ''}${r.net?.measured ? `, ${((r.net.byMinute[m] || 0) / 1024).toFixed(0)} КБ` : ''}`); }
    lines.push('', 'Самые долгие нажатия:');
    for (const t of [...r.taps].filter(t => t.ms !== null).sort((a, b) => b.ms - a.ms).slice(0, 10)) lines.push(`  ${t.ms} мс — «${t.w}» на ${(t.t / 60).toFixed(1)} мин`);
    const slow = r.taps.filter(t => t.ms !== null && t.ms >= 1000 && t.b).sort((a, b) => b.ms - a.ms);
    if (r.taps.some(t => t.b)) {
      lines.push('', 'Разбивка нажатий ≥ 1 с (сеть: запросов, волн подряд, время с открытыми запросами, самое долгое ожидание до отправки, самый долгий ответ сервера; страница занята):');
      for (const t of slow) lines.push(`  ${t.ms} мс «${t.w}» (${(t.t / 60).toFixed(1)} мин): сеть ${t.b.net} мс — запросов ${t.b.n}, волн ${t.b.waves}, до отправки ≤ ${t.b.queue} мс, сервер ≤ ${t.b.server} мс; страница занята ${t.b.busy} мс${t.b.cs !== undefined ? `; кэш: медленных шагов ${t.b.cs}${t.b.cs ? ` (≤ ${t.b.cmax} мс)` : ''}${t.b.ck ? `, шёл подсчёт записей ${t.b.ck} мс` : ''}` : ''}`);
      if (!slow.length) lines.push('  нет');
      const all = r.taps.filter(t => t.ms !== null && t.b), avg = k => all.length ? Math.round(all.reduce((a, t) => a + t.b[k], 0) / all.length) : 0;
      lines.push(`  в среднем на нажатие (все ${all.length}): сеть ${avg('net')} мс, ${(all.reduce((a, t) => a + t.b.waves, 0) / Math.max(1, all.length)).toFixed(1)} волн, страница занята ${avg('busy')} мс; ожидание до отправки ≥ 500 мс — в ${all.filter(t => t.b.queue >= 500).length} нажатиях`);
    }
    if (r.cache) {
      const k = r.cache.keys, sorted = [...k].map(x => x.ms).sort((a, b) => a - b), kinds = {};
      for (const x of r.cache.slow) kinds[x.kind] = (kinds[x.kind] || 0) + 1;
      lines.push('', `Кэш данных: не ответил вовремя (0,5 с; до 07.11 вечера — 1,5 с) — ${r.cache.stalled} раз; шагов дольше 200 мс — ${r.cache.slow.length} (${Object.entries(kinds).map(([a, n]) => a + ' ' + n).join(', ') || '—'})`);
      lines.push(`  подсчёт записей: ${k.length} раз, ${sorted.length ? `медиана ${sorted[sorted.length >> 1]} мс, максимум ${sorted.at(-1)} мс, записей ${k.at(-1).n}` : '—'}`);
    }
    lines.push('', `Устройство: ${r.ua}`);
    lines.push('', 'Все нажатия (секунда от начала, слово, мс):', r.taps.map(t => `${t.t} ${t.w} ${t.ms ?? 'x'}`).join('; '));
    return lines.join('\n');
  }
  function showResult() {
    const r = load(); if (!r) return;
    $('text').value = report(r); document.body.classList.add('done');
  }

  $('start').addEventListener('click', () => { start().catch(e => { say('Ошибка теста: ' + e.message, true); const r = load(); if (r) { r.state = 'error'; r.error = String(e.message); save(r); } }); });
  $('stop').addEventListener('click', () => { stopping = true; say('Останавливаю после текущего нажатия…'); });
  $('show').addEventListener('click', showResult);
  $('back').addEventListener('click', () => document.body.classList.remove('done'));
  $('copy').addEventListener('click', async () => {
    const text = $('text');
    try { await navigator.clipboard.writeText(text.value); $('copy').textContent = 'Скопировано'; }
    catch (_) { text.focus(); text.select(); document.execCommand?.('copy'); $('copy').textContent = 'Выделено — скопируйте'; }
  });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && load()?.state === 'running') { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {} }
  });
})();
</script>
</body>
</html>
