<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("deutschThemeV1") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ortspräpositionen" />
    <title>Ortspräpositionen</title>
    <link rel="stylesheet" href="ortspraepositionen.css?v=3" />
  </head>
  <body>
    <main class="app">
      <section id="sessionScreen">
        <h1>Ortspräpositionen</h1>
        <p>Wie viele Übungen?</p>
        <div class="session-options">
          <button class="session-option" data-size="10">10</button>
          <button class="session-option" data-size="20">20</button>
          <button class="session-option" data-size="30">30</button>
        </div>
        <button class="table-btn" type="button" data-otable>Orte · Tabelle</button>
      </section>

      <section id="game" class="hidden">
        <header class="top">
          <div class="top-row">
            <div class="top-title">Ortspräpositionen</div>
            <div class="counter" id="counter">1 / 10</div>
          </div>
          <div class="progress"><i id="bar"></i></div>
          <div class="glow" aria-hidden="true"></div>
        </header>

        <section class="card" id="card">
          <div class="eyebrow" id="eyebrow">&nbsp;</div>
          <div class="place" id="place"></div>
          <div class="translation" id="translation"></div>
          <div class="steps" id="steps"></div>
          <div class="rule" id="rule">
            <div class="rule-label" id="ruleLabel"></div>
            <div class="rule-forms" id="ruleForms"></div>
          </div>
        </section>

        <section class="choices" id="choices"></section>
        <button class="hidden" id="next">Weiter</button>
        <div class="rule-note" id="ruleNote"></div>
        <div class="in-session-table">
          <button class="table-btn" type="button" id="roundTableBtn" data-otable="round" disabled>Orte · Tabelle</button>
        </div>
      </section>

      <section class="hidden" id="endScreen">
        <h1>Fertig.</h1>
        <div class="end-score" id="endScore">0 / 30</div>
        <div class="end-note" id="endNote"></div>
        <div class="finish-actions">
          <button id="playAgain">Noch eine Runde</button>
          <button id="homeBack">Zur Startseite</button>
        </div>
      </section>
      <div class="start-about" id="startAbout">
        <h2>Worum geht's?</h2>
        <p class="about-de" id="aboutText"></p>
      </div>
      <div class="version-mark">v25</div>
      <div class="omodal" id="omodal" aria-hidden="true">
        <div class="osheet" role="dialog" aria-label="Wo · Wohin · Woher">
          <div class="ohead">
            <h2>Wo · Wohin · Woher</h2>
            <button class="oclose" id="oclose" type="button" aria-label="Schließen">×</button>
          </div>
          <div id="otable"></div>
        </div>
      </div>
    </main>

    <script src="../../components/deutsch-translation-v1.js?v=2"></script>
    <script src="../../components/deutsch-day-v1.js?v=1"></script>
    <script src="places.js?v=1"></script>
    <script src="../../components/deutsch-progress-v1.js"></script>
    <script src="ortspraepositionen.js?v=2"></script>
    <script src="../../components/deutsch-wide-v1.js?v=1"></script>
</body>
</html>
