<html lang="en">
<head>

    document.documentElement.setAttribute("data-theme","light");
  }
})();

<link rel="manifest" href="../manifest.webmanifest">

    <title>Artikel</title>
<style>
/* ===== PALETTE ===== */
:root{
  --bg:#1b1b1d;
  --panel:#2a2a2d;
  --text:#f2f0ed;
  --muted:#8f8f94;
  --text-secondary:#c8c7c4;
  --text-strong:#f2f0ed;
  --text-subtle:#c8c7c4;
  --text-label:#8f8f94;
  --mint:#5bc8a4;
  --coral:#ff7770;
  --blue:#72a7ff;

  --line:rgba(255,255,255,.09);
  --bar-track:rgba(255,255,255,.10);
  --answer-surface:rgba(27,27,29,.58);
  --game-title:rgba(255,255,255,.11);
  --good:rgba(91,200,164,.5);
  --bad:rgba(255,119,112,.5);
  --good-glow:radial-gradient(ellipse at 50% 42%,rgba(91,200,164,.42) 0%,rgba(91,200,164,.24) 18%,rgba(91,200,164,.11) 40%,rgba(91,200,164,.04) 60%,transparent 78%);
  --bad-glow:radial-gradient(ellipse at 50% 42%,rgba(255,119,112,.48) 0%,rgba(255,119,112,.28) 18%,rgba(255,119,112,.13) 40%,rgba(255,119,112,.05) 60%,transparent 78%);

  /* shared across exercises (Design Police 2026-09-25) */
  --card-bg:#2a2a2d;
  --card-lift:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.30);
  --start-btn-bg:#2a2a2d;
  --start-btn-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 14px rgba(0,0,0,.14);
  --start-version:rgba(255,255,255,.24);
  --quiet-bg:rgba(255,255,255,.03);
  --quiet-line:rgba(255,255,255,.10);
  --end-again-text:rgba(242,240,237,.55);
  --end-again-line:rgba(255,255,255,.10);
  --end-main-bg:#ece6dc;   /* cream: same as the Prüfen/Weiter buttons */
  --end-main-text:#1b1b1d;
}
[data-theme="light"]{
  --bg:#f6f4f1;
  --panel:#ffffff;
  --text:#242426;
  --muted:#727278;
  --text-secondary:#55565b;
  --text-strong:#55565b;
  --text-subtle:#727278;
  --text-label:#727278;
  --mint:#3fa68a;
  --coral:#e95e66;
  --blue:#5588e0;

  --line:rgba(0,0,0,.09);
  --bar-track:rgba(0,0,0,.10);
  --answer-surface:rgba(36,36,38,.035);
  --game-title:rgba(36,36,38,.09);
  --good:rgba(63,166,138,.5);
  --bad:rgba(233,94,102,.5);
  --good-glow:radial-gradient(ellipse at 50% 42%,rgba(63,166,138,.18) 0%,rgba(63,166,138,.09) 18%,rgba(63,166,138,.03) 40%,transparent 70%);
  --bad-glow:radial-gradient(ellipse at 50% 42%,rgba(233,94,102,.19) 0%,rgba(233,94,102,.09) 18%,rgba(233,94,102,.025) 40%,transparent 70%);

  --card-bg:#fff;
  --card-lift:0 2px 4px rgba(0,0,0,.04),0 14px 34px rgba(0,0,0,.09);
  --start-btn-bg:#fff;
  --start-btn-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 14px rgba(0,0,0,.08);
  --start-version:rgba(36,36,38,.34);
  --quiet-bg:#fff;
  --quiet-line:rgba(0,0,0,.10);
  --end-again-text:rgba(36,36,38,.55);
  --end-again-line:rgba(0,0,0,.10);
  --end-main-bg:#242426;
  --end-main-text:#f6f4f1;
}

/* ===== PAGE SHELL (same as Partizip II) =====
   The page itself never scrolls or bounces. Everything lives in .app, which fills the screen
   and scrolls on its own only when the content is taller than the screen (small phones, large text). */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.app{position:fixed;inset:0;width:min(720px,100%);margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 40px);
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hidden{display:none}

/* ===== START + SUMMARY SCREENS ===== */
.game-title{font-size:clamp(56px,12vw,94px);font-weight:700;letter-spacing:-.065em;color:var(--game-title);margin:30px 0 70px;user-select:none}
#sessionScreen,#endScreen{padding:20px 14px;text-align:center}
#sessionScreen h1,#endScreen h1{font-size:34px;letter-spacing:-.03em;margin:0 0 10px}
#sessionScreen p,#endScreen p{color:var(--muted);font-size:16px}

#sessionScreen p{line-height:1.5;margin:16px 0}
.session-options{display:flex;justify-content:center;gap:12px;margin:28px 0}
.session-option{flex:0 0 96px;width:96px;height:58px;margin:0;padding:0;border:0;border-radius:16px;
  background:var(--start-btn-bg);color:var(--text);box-shadow:var(--start-btn-shadow);font:650 21px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.session-option:active{transform:scale(.97);filter:brightness(.94)}

/* „Worum geht's?“ — width = the 10/20/30 row (3 × 96px + 2 × 12px), fixed above the version mark (2026-09-26) */
.start-about{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);margin:0 auto;padding:0;width:312px;max-width:calc(100% - 36px);text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;z-index:4}
.start-about h2{margin:0 0 5px;font-size:13px;font-weight:650;line-height:1.3;color:var(--muted);letter-spacing:0}
.start-about .about-de{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
body:has(#sessionScreen.hidden) .start-about{display:none}

#endScreen .game-title{margin-bottom:45px}
#endScreen p{margin:0 0 28px}
.end-score{font-size:58px;font-weight:700;letter-spacing:-.05em;margin:18px 0 6px}
.finish-actions{width:min(100%,360px);margin:20px auto 0;display:flex;flex-direction:column;gap:10px}
.finish-actions button{width:100%;height:56px;margin:0;padding:0;border:0;border-radius:17px;font:650 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.finish-actions button:active{transform:scale(.97);filter:brightness(.94)}
#playAgain{background:transparent;color:var(--end-again-text);border:1px solid var(--end-again-line)}
#homeBack{background:var(--end-main-bg);color:var(--end-main-text)}

/* Version number: only on the start and summary screens */
.version-mark{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);margin:0;padding:0;
  text-align:center;font:400 11px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:.04em;color:var(--start-version);pointer-events:none;z-index:5}
body:has(#game:not(.hidden)) .version-mark{display:none}

/* Short screens (phone turned sideways, very small phones): not enough room to pin the description and
   the version number to the bottom without covering the buttons, so they follow the content instead. */
@media (max-height:559px),(max-width:340px) and (max-height:609px){
  .start-about,.version-mark{position:static;margin:0 auto}
  .start-about{margin-top:12px}
  .version-mark{padding:28px 0 4px}
}

/* ===== TOP BAR · position = Partizip II (reference): title and counter centred 33.5px from the top, line at 55px ===== */
#game{padding-top:11px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;padding-bottom:18px;
  position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:10;background:var(--bg)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bar-track);border-radius:99px}
.top:before{content:"";position:absolute;left:0;right:0;bottom:100%;height:calc(env(safe-area-inset-top) + 8px);background:var(--bg)}   /* covers the strip above the bar while the panel scrolls */
.top-title{font-size:18px;font-weight:700;color:var(--muted)}
.counter{color:var(--muted);font-size:14px}
.top-title,.counter{transform:translateY(4px)}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:99px;overflow:hidden;z-index:1}
.progress i{display:block;height:100%;background:var(--muted);width:0}

/* ===== WORD CARD + ANSWER BUTTONS ===== */
.card{position:relative;overflow:hidden;min-height:390px;border-radius:26px;background:var(--card-bg);box-shadow:var(--card-lift);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 24px}
.eyebrow{font-size:16px;color:var(--muted);margin-bottom:18px}
.word{font-size:clamp(48px,11vw,76px);font-weight:650;letter-spacing:-.04em;text-align:center}
.translation{font-size:16px;color:var(--muted);margin-top:14px;text-align:center}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.choice{height:56px;padding:0 10px;border:0;border-radius:14px;background:var(--start-btn-bg);box-shadow:var(--start-btn-shadow);
  font:650 22px -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;cursor:pointer;
  transition:transform .12s ease,filter .12s ease,opacity .16s ease}
.choice:active{transform:scale(.97);filter:brightness(.94)}
.der{color:var(--blue)}.die{color:var(--coral)}.das{color:var(--mint)}
@media(max-width:520px){
  .card{min-height:360px}
  .choices{position:sticky;bottom:10px}
}

/* ===== FEEDBACK ===== */
.feedback{display:none;margin-top:18px;border-radius:22px;padding:22px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.feedback.show{display:block}
.feedback.correct{border-color:var(--good)}
.feedback.wrong{border-color:var(--bad)}
.feedback::before{content:"";position:absolute;left:50%;top:-230px;width:155%;height:650px;transform:translateX(-50%);pointer-events:none}
.feedback.correct::before{background:var(--good-glow)}
.feedback.wrong::before{background:var(--bad-glow)}
.feedback h2,.feedback p,.answer-card,.rule-card{position:relative}   /* above the glow */
#feedbackTitle{margin:0 0 10px;font-size:20px;text-align:center}
.feedback.correct #feedbackTitle{color:var(--mint)}
.feedback.wrong #feedbackTitle{color:var(--coral)}
#choiceLine{margin:8px 0;color:var(--text-secondary);line-height:1.45;text-align:center}
.answer-card,.rule-card{margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--answer-surface)}
.answer-card{text-align:center}
.answer-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.answer-word{font-size:30px;font-weight:700;transition:color .2s ease}
.answer-translation{color:var(--muted);margin-top:6px}
.rule-label{font-size:14px;text-transform:uppercase;letter-spacing:.035em;color:var(--text-label);font-weight:400;margin-bottom:12px}
.rule-title{font-size:16px;font-weight:400;margin-bottom:8px;line-height:1.5}
.rule-examples{font-size:13px;font-style:italic;color:var(--text-subtle);margin-top:10px;line-height:1.45}
.rule-reliability{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--text-subtle)}
.rule-reliability strong{color:var(--text-strong)}

/* Weiter: the quiet button, shared by all exercises (blueprint: Partizip II) — you read the answer first */
#continue{width:100%;height:56px;margin-top:18px;padding:0;border:1px solid var(--quiet-line);border-radius:17px;background:var(--quiet-bg);color:var(--text);
  font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;cursor:pointer;transition:transform .12s ease,filter .12s ease}
#continue:active{transform:scale(.97);filter:brightness(.94)}
</style>
</head>
<body><main class="app">
<section class="session-screen" id="sessionScreen">
<div class="game-title">Der.Die.Das.</div>
<h1>Wie viele Wörter?</h1>
<p>Endungen, Gruppen und Ausnahmen.</p>
<div class="session-options">
<button class="session-option" data-size="10">10</button>
<button class="session-option" data-size="20">20</button>
<button class="session-option" data-size="30">30</button>
</div>
</section>
<div class="start-about" id="startAbout">
  <h2>Worum geht's?</h2>
  <p class="about-de" id="aboutText"></p>
</div>

<div id="game" class="hidden">
<section class="top">
<div><div class="top-title">Der.Die.Das.</div><div class="progress"><i id="bar"></i></div></div>
<div class="counter" id="counter">1 / 10</div>
</section>
<section class="card" id="card">

<div class="eyebrow">Wähle den richtigen Artikel.</div><div class="word" id="word"></div><div class="translation" id="translation"></div>
</section>
<section class="choices" id="choices"><button class="choice der" data-a="der">der</button><button class="choice die" data-a="die">die</button><button class="choice das" data-a="das">das</button></section>
<section class="feedback" id="feedback"><h2 id="feedbackTitle"></h2><p id="choiceLine"></p><div class="answer-card"><div class="answer-label">Das Wort</div><div class="answer-word"><span class="article" id="answerArticle"></span> <span id="answerWord"></span></div><div class="answer-translation" id="answerTranslation"></div></div><div class="rule-card"><div class="rule-label" id="ruleLabel"></div><div class="rule-title" id="ruleTitle"></div><div class="rule-examples" id="ruleExamples"></div><div class="rule-reliability" id="ruleReliability"></div></div><button class="continue" id="continue">Weiter</button></section>
</div>

<section class="end-screen hidden" id="endScreen">
<div class="game-title game-title-done">Der.Die.Das.</div>
<h1>Fertig.</h1>
<div class="end-score" id="endCorrect">0 / 0</div>
<p id="endSummary">Runde geschafft.</p>
<div class="finish-actions">
<button class="again" id="playAgain">Noch eine Runde</button>
<button class="home-back" id="homeBack">Zur Startseite</button>
</div>
</section>
<div class="version-mark">v25</div>
</main>
<script src="../components/deutsch-translation-v1.js?v=2"></script>
<script>
// Start-screen description: shown in the user's language so it is surely understood (like a hint).
const START_ABOUT={text:{
  en:"Helps you learn the patterns behind German articles and choose the right one - even for words you don't know yet.",
  ru:"Помогает запомнить закономерности немецких артиклей и выбрать правильный - даже для незнакомых слов."}};
document.getElementById("aboutText").textContent=getTranslation(START_ABOUT,"text");
</script>
<script src="words.js?v=3"></script>
<script src="../components/deutsch-progress-v1.js"></script>
<script>
const words=window.WORDS;
let deck=[],index=0,total=0,correct=0,sessionSize=0;
const $=id=>document.getElementById(id);

// Persistent difficulty: mistakes make a word more likely to reappear in future rounds.
const STORAGE_KEY='artikelGameDifficultyV1';
let difficulty={};
try{difficulty=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){difficulty={}}
const wordKey=w=>w.article+'|'+w.word;

// Progress tracking (Documentation/PROGRESS_TRACKER.md). Guarded: Artikel keeps working if the helper is missing.
const PROGRESS_ID='artikel';
const hasProgress=()=>typeof window.DeutschProgress==='object';
// Counted per RULE, not per noun: all nouns of one rule (e.g. -ung → die) share one progress item.
// Nouns without a reliable rule and exceptions (ruleType none / exception) are their own item.
const isIndividual=w=>w.ruleType==='none'||w.ruleType==='exception';
const progressKey=w=>isIndividual(w)?'word:'+wordKey(w):'rule:'+w.ruleLabel+'|'+w.article;
function progressLabel(w){
 if(isIndividual(w))return w.article+' '+w.word;
 let l=w.ruleLabel.replace(/ ENDING$/,'').replace(/ PATTERN$/,'').replace(/ → MOSTLY (DER|DIE|DAS)$/,'');
 l=l.startsWith('-')?l.toLowerCase():l.charAt(0)+l.slice(1).toLowerCase();
 return l+' → '+w.article;
}
// Weight = number of nouns the item covers, so the bar % = share of the 238 nouns I reliably know.
if(hasProgress()){
 const items=new Map();
 words.forEach(w=>{const k=progressKey(w),e=items.get(k);if(e)e.weight++;else items.set(k,{key:k,label:progressLabel(w),weight:1})});
 DeutschProgress.init(PROGRESS_ID,[...items.values()]);
}
function saveDifficulty(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(difficulty))}catch(e){}}
function updateDifficulty(w,ok){
 const key=wordKey(w),old=difficulty[key]||1;
 // Wrong answers raise the weight; correct answers gently bring it back toward normal.
 difficulty[key]=ok?Math.max(1,old-0.5):Math.min(4,old+1);
 saveDifficulty();
}
function newDeck(){
 // Build ONE session with unique nouns only.
 // Difficult nouns are more likely to be selected for the session,
 // but a noun can never appear twice inside the same session.
 const ranked=words.map(w=>{
   const weight=Math.max(1,difficulty[wordKey(w)]||1);
   // Weighted sampling without replacement:
   // higher weight = better chance to land near the front.
   const key=-Math.log(Math.max(Math.random(),1e-12))/weight;
   return {w,key};
 }).sort((a,b)=>a.key-b.key);

 deck=ranked.slice(0,Math.min(sessionSize,ranked.length)).map(x=>x.w);
 index=0;
}
function current(){return deck[index]}
/* Long words never wrap: they stay on one line and shrink just enough to fit
   the card (e.g. Harley-Davidson, Geschwindigkeit on narrow phones). */
function fitOneLine(el){
 if(!el)return;
 el.style.fontSize='';el.style.whiteSpace='nowrap';
 const box=el.parentElement;if(!box||!box.clientWidth)return;
 const cs=getComputedStyle(box);
 const avail=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 const need=el.scrollWidth;
 if(avail>0&&need>avail){el.style.fontSize=Math.floor(parseFloat(getComputedStyle(el).fontSize)*avail/need*0.97)+'px'}
}
addEventListener('resize',()=>{fitOneLine($('word'));fitOneLine(document.querySelector('.answer-word'))});
function render(){const w=current();$('word').textContent=w.word;$('translation').textContent=getTranslation(w,'translation');$('feedback').className='feedback';$('choices').style.display='grid';$('card').style.display='flex';$('counter').textContent=`${index+1} / ${sessionSize}`;$('bar').style.width=`${(index/sessionSize)*100}%`;fitOneLine($('word'))}

const DAILY_STATS_KEY='deutschDailyStatsV1';
function localDayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function recordDailyArtikel(ok){
  try{
    const today=localDayKey();
    let data=JSON.parse(localStorage.getItem(DAILY_STATS_KEY)||'{}');

    if(data.date!==today){
      data={date:today,artikel:{answers:0,correct:0}};
    }

    if(!data.artikel) data.artikel={answers:0,correct:0};
    data.artikel.answers++;
    if(ok) data.artikel.correct++;

    localStorage.setItem(DAILY_STATS_KEY,JSON.stringify(data));
  }catch(e){}
}

function choose(article){const w=current(),ok=article===w.article;total++; recordDailyArtikel(ok); updateDifficulty(w,ok); if(hasProgress())DeutschProgress.record(PROGRESS_ID,progressKey(w),ok); if(ok){correct++}
 $('feedback').className='feedback show '+(ok?'correct':'wrong');$('feedbackTitle').textContent=ok?'✓ Richtig':'✕ Nicht ganz';$('choiceLine').innerHTML=ok?`Deine Wahl: <strong>${article}</strong>.`:`Deine Wahl: <strong>${article}</strong>. Richtig: <strong>${w.article}</strong>.`;$('answerArticle').textContent=w.article;$('answerWord').textContent=w.word;$('answerTranslation').textContent=getTranslation(w,'translation');$('ruleLabel').textContent=`WHY ${w.article.toUpperCase()}? (${w.ruleLabel})`;$('ruleTitle').textContent=w.explanation;$('ruleExamples').textContent=Array.isArray(w.examples)?w.examples.join(', '):w.examples;$('ruleReliability').innerHTML=`<strong>Heads up:</strong> ${w.reliability}`;$('choices').style.display='none';$('card').style.display='none';fitOneLine(document.querySelector('.answer-word'))}
function startSession(size){
 sessionSize=size; total=0; correct=0;
 
 newDeck();
 $('sessionScreen').classList.add('hidden');
 $('endScreen').classList.add('hidden');
 $('game').classList.remove('hidden');
 render();
}
function endSession(){
 $('game').classList.add('hidden');
 $('endScreen').classList.remove('hidden');
 $('endCorrect').textContent=`${correct} / ${sessionSize}`;
 const pct=Math.round((correct/sessionSize)*100);
 $('endSummary').textContent=`${pct} % richtig. Was schwierig war, kommt öfter wieder.`;
}
$('continue').onclick=()=>{
 if(total>=sessionSize){endSession();return}
 index++;
 render();
};
document.querySelectorAll('.session-option').forEach(b=>b.onclick=()=>startSession(Number(b.dataset.size)));
$('playAgain').onclick=()=>{$('endScreen').classList.add('hidden');$('sessionScreen').classList.remove('hidden')};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.a));
document.addEventListener('keydown',e=>{if($('feedback').classList.contains('show')){if(e.key==='Enter'||e.key===' ')$('continue').click();return}if(e.key==='ArrowLeft'||e.key==='1')choose('der');if(e.key==='ArrowUp'||e.key==='2')choose('die');if(e.key==='ArrowRight'||e.key==='3')choose('das')});



function goBackToHome(){
  try{
    if(window.parent && window.parent!==window){
      if(typeof window.parent.closeApp==="function"){window.parent.closeApp();return;}
      const parentDoc=window.parent.document;
      const shell=parentDoc.getElementById("appShell");
      const frame=parentDoc.getElementById("appFrame");
      if(shell && frame){
        shell.classList.remove("open");shell.setAttribute("aria-hidden","true");
        parentDoc.documentElement.classList.remove("app-open");frame.src="about:blank";return;
      }
    }
  }catch(e){}
  window.parent.postMessage({type:"deutsch:home"},"*");
